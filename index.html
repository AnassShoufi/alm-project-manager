/* =====================================================
   PROJECT
===================================================== */

function getVariationsProject(projectId){

    return projects.find(
        p =>
            String(p.id) ===
            String(projectId)
    );

}


/* =====================================================
   MONEY
===================================================== */

function parseVariationMoney(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return 0;
    }

    return Number(
        String(value)
            .replace(/,/g,"")
            .replace(/[^\d.-]/g,"")
    ) || 0;

}


function formatVariationMoney(value){

    const number =
        parseVariationMoney(value);

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   FORMAT MONEY INPUT
   Converts 100000 to 100,000.00
===================================================== */

function formatVariationInput(input){

    if(!input){
        return;
    }

    const raw =
        String(input.value || "")
            .replace(/,/g,"")
            .replace(/[^\d.-]/g,"");

    if(raw === ""){
        return;
    }

    const number =
        Number(raw);

    if(isNaN(number)){
        return;
    }

    input.value =
        formatVariationMoney(number);

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function variationEscape(value){

    return String(
        value === null ||
        value === undefined
            ? ""
            : value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   INDEXEDDB - PDF STORAGE
===================================================== */

let variationFileDBPromise = null;


function getVariationFileDB(){

    if(variationFileDBPromise){

        return variationFileDBPromise;

    }


    variationFileDBPromise =
        new Promise(
            function(resolve,reject){

                if(!window.indexedDB){

                    reject(
                        new Error(
                            "IndexedDB is not available in this browser."
                        )
                    );

                    return;

                }


                const request =
                    indexedDB.open(
                        "ALM_Variation_Files",
                        1
                    );


                request.onupgradeneeded =
                function(event){

                    const db =
                        event.target.result;


                    if(
                        !db.objectStoreNames.contains(
                            "files"
                        )
                    ){

                        db.createObjectStore(
                            "files",
                            {
                                keyPath:"id"
                            }
                        );

                    }

                };


                request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };


                request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

            }
        );


    return variationFileDBPromise;

}


/* =====================================================
   SAVE PDF
===================================================== */

async function saveVariationPDF(
    fileId,
    file
){

    const db =
        await getVariationFileDB();


    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    "files"
                );


            store.put({

                id:fileId,

                name:file.name,

                type:
                    file.type ||
                    "application/pdf",

                blob:file

            });


            transaction.oncomplete =
            function(){

                resolve();

            };


            transaction.onerror =
            function(){

                reject(
                    transaction.error
                );

            };

        }
    );

}


/* =====================================================
   GET PDF
===================================================== */

async function getVariationPDF(
    fileId
){

    if(!fileId){

        return null;

    }


    const db =
        await getVariationFileDB();


    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "files"
                );


            const request =
                store.get(fileId);


            request.onsuccess =
            function(){

                resolve(
                    request.result ||
                    null
                );

            };


            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =====================================================
   DELETE PDF
===================================================== */

async function deleteVariationPDF(
    fileId
){

    if(!fileId){

        return;

    }


    try{

        const db =
            await getVariationFileDB();


        await new Promise(
            function(resolve,reject){

                const transaction =
                    db.transaction(
                        "files",
                        "readwrite"
                    );


                const store =
                    transaction.objectStore(
                        "files"
                    );


                store.delete(
                    fileId
                );


                transaction.oncomplete =
                function(){

                    resolve();

                };


                transaction.onerror =
                function(){

                    reject(
                        transaction.error
                    );

                };

            }
        );

    }
    catch(error){

        console.error(
            "PDF delete error:",
            error
        );

    }

}

/* =====================================================
   PAYMENT TOTALS
===================================================== */

function getVariationPaymentTotals(
    variation
){

    let invoiced = 0;

    let received = 0;


    (
        variation.paymentStages ||
        []
    )
    .forEach(
        function(stage){

            invoiced +=
                parseVariationMoney(
                    stage.invoiceValue
                );


            received +=
                parseVariationMoney(
                    stage.receivedValue
                );

        }
    );


    return {

        invoiced:invoiced,

        received:received,

        outstanding:
            invoiced -
            received

    };

}


/* =====================================================
   FINANCIAL STATUS
   PAYMENT IS COMPARED AGAINST PAYABLE AMOUNT
===================================================== */

function getVariationFinancialStatus(
    variation
){

    const approved =
        parseVariationMoney(
            variation.approvedValue
        );


    const payable =
        parseVariationMoney(
            variation.payableAmount
        );


    const totals =
        getVariationPaymentTotals(
            variation
        );


    const received =
        totals.received;


    if(approved <= 0){

        return "Not Approved";

    }


    if(payable <= 0){

        return "Payable Not Set";

    }


    if(received <= 0){

        if(totals.invoiced > 0){

            return "Invoiced";

        }

        return "Not Paid";

    }


    if(received > payable){

        return "Overpaid";

    }


    if(received >= payable){

        return "Fully Paid";

    }


    return "Partially Paid";

}

/* =====================================================
   ADD VARIATION
===================================================== */

window.addVariationRow =
function(projectId){

    const project =
        getVariationsProject(
            projectId
        );


    if(!project){

        return;

    }


    if(!project.variations){

        project.variations = [];

    }


    const nextNumber =
        project.variations.length + 1;


    project.variations.push({

        variationNumber:
            "V-" +
            String(nextNumber)
                .padStart(3,"0"),

        variationType:
            "",

        description:
            "",

        contractor:
            "",

        submittedValue:
            "",

        approvedValue:
            "",

        payableAmount:
            "",

        status:
            "Draft",

        paymentStages:
            []

    });


    persist();


    renderVariationsSection(
        project
    );

};


/* =====================================================
   UPDATE NORMAL FIELD
===================================================== */

window.updateVariationField =
function(
    projectId,
    index,
    field,
    value
){

    const project =
        getVariationsProject(
            projectId
        );


    if(
        !project ||
        !project.variations ||
        !project.variations[index]
    ){

        return;

    }


    project.variations[index][field] =
        value;


    persist();


    refreshVariationFinancialDisplays(
        project,
        index
    );

};


/* =====================================================
   UPDATE MAIN AMOUNT
===================================================== */

window.updateVariationAmount =
function(
    projectId,
    index,
    field,
    value
){

    const project =
        getVariationsProject(
            projectId
        );


    if(
        !project ||
        !project.variations ||
        !project.variations[index]
    ){

        return;

    }


    project.variations[index][field] =
        value;


    persist();


    updateVariationSummary(
        project
    );


    refreshVariationFinancialDisplays(
        project,
        index
    );


    updateVariationStageSummaryInPlace(
        project,
        index
    );

};


/* =====================================================
   REFRESH FINANCIAL DISPLAY
===================================================== */

function refreshVariationFinancialDisplays(
    project,
    index
){

    const variation =
        project.variations[index];


    if(!variation){

        return;

    }


    const status =
        getVariationFinancialStatus(
            variation
        );


    const row =
        document.getElementById(
            `variation-row-${index}`
        );


    if(!row){

        return;

    }


    /*
       Columns:
       0 Number
       1 Type
       2 Description
       3 Contractor
       4 Submitted
       5 Approved
       6 Payable
       7 Workflow Status
       8 Financial Status
       9 Payment Stages
       10 Action
    */

    const financialCell =
        row.cells[8];


    if(financialCell){

        financialCell.innerHTML =
            variationFinancialBadge(
                status
            );

    }

}


/* =====================================================
   UPDATE SUMMARY
   VARIATIONS ONLY
===================================================== */

function updateVariationSummary(
    project
){

    let totalSubmitted = 0;

    let totalApproved = 0;

    let totalPayable = 0;

    let totalInvoiced = 0;

    let totalReceived = 0;


    (
        project.variations ||
        []
    )
    .forEach(
        function(variation){

            totalSubmitted +=
                parseVariationMoney(
                    variation.submittedValue
                );


            totalApproved +=
                parseVariationMoney(
                    variation.approvedValue
                );


            totalPayable +=
                parseVariationMoney(
                    variation.payableAmount
                );


            const totals =
                getVariationPaymentTotals(
                    variation
                );


            totalInvoiced +=
                totals.invoiced;


            totalReceived +=
                totals.received;

        }
    );


    const outstanding =
        totalPayable -
        totalReceived;


    const submittedEl =
        document.getElementById(
            "variation-summary-submitted"
        );


    const approvedEl =
        document.getElementById(
            "variation-summary-approved"
        );


    const payableEl =
        document.getElementById(
            "variation-summary-payable"
        );


    const invoicedEl =
        document.getElementById(
            "variation-summary-invoiced"
        );


    const receivedEl =
        document.getElementById(
            "variation-summary-received"
        );


    const outstandingEl =
        document.getElementById(
            "variation-summary-outstanding-payable"
        );


    if(submittedEl){

        submittedEl.innerText =
            formatVariationMoney(
                totalSubmitted
            );

    }


    if(approvedEl){

        approvedEl.innerText =
            formatVariationMoney(
                totalApproved
            );

    }


    if(payableEl){

        payableEl.innerText =
            formatVariationMoney(
                totalPayable
            );

    }


    if(invoicedEl){

        invoicedEl.innerText =
            formatVariationMoney(
                totalInvoiced
            );

    }


    if(receivedEl){

        receivedEl.innerText =
            formatVariationMoney(
                totalReceived
            );

    }


    if(outstandingEl){

        outstandingEl.innerText =
            formatVariationMoney(
                outstanding
            );

    }

}

        getVariationPaymentTotals(

/* =====================================================
   =====================================================
   EXCEL EXPORT
   ONE SHEET ONLY
   VARIATIONS ONLY
   =====================================================
===================================================== */

window.exportVariationsToExcel =
function(projectId){

    const project =
        getVariationsProject(
            projectId
        );


    if(!project){

        alert(
            "Project not found."
        );

        return;

    }


    if(
        !project.variations ||
        project.variations.length === 0
    ){

        alert(
            "There are no variations to export."
        );

        return;

    }


    /*
       Make sure SheetJS is available.
    */

    if(
        typeof XLSX === "undefined"
    ){

        alert(
            "Excel export library is not available.\n\n" +
            "Please make sure SheetJS / XLSX is loaded in the project."
        );

        return;

    }


    try{

        let totalSubmitted = 0;

        let totalApproved = 0;

        let totalPayable = 0;

        let totalInvoiced = 0;

        let totalReceived = 0;


        project.variations.forEach(
            function(variation){

                totalSubmitted +=
                    parseVariationMoney(
                        variation.submittedValue
                    );


                totalApproved +=
                    parseVariationMoney(
                        variation.approvedValue
                    );


                totalPayable +=
                    parseVariationMoney(
                        variation.payableAmount
                    );


                const totals =
                    getVariationPaymentTotals(
                        variation
                    );


                totalInvoiced +=
                    totals.invoiced;


                totalReceived +=
                    totals.received;

            }
        );


        const outstandingPayable =
            totalPayable -
            totalReceived;


        /*
           =================================================
           EXCEL DATA
           =================================================
        */

        const rows = [];


        /*
           TITLE
        */

        rows.push([
            "VARIATION REGISTER & PAYMENT TRACKING"
        ]);


        /*
           PROJECT
        */

        rows.push([
            "Project",
            project.name ||
            project.projectName ||
            ""
        ]);


        /*
           VARIATION SUMMARY ONLY
        */

        rows.push([
            "Total Submitted Variations",
            totalSubmitted
        ]);


        rows.push([
            "Total Approved Variations",
            totalApproved
        ]);


        rows.push([
            "Total Payable Variations",
            totalPayable
        ]);


        rows.push([
            "Total Invoiced",
            totalInvoiced
        ]);


        rows.push([
            "Total Payment Received",
            totalReceived
        ]);


        rows.push([
            "Outstanding Variation Payable",
            outstandingPayable
        ]);


        /*
           BLANK ROW
        */

        rows.push([]);


        /*
           MAIN TABLE HEADER
        */

        rows.push([

            "ROW TYPE",

            "VARIATION NO.",

            "TYPE",

            "DESCRIPTION",

            "CONTRACTOR / SUBMITTED BY",

            "SUBMITTED VALUE",

            "APPROVED VALUE",

            "PAYABLE AMOUNT",

            "WORKFLOW STATUS",

            "FINANCIAL STATUS",

            "STAGE",

            "INVOICE VALUE",

            "INVOICE DATE",

            "PAYMENT RECEIVED",

            "PAYMENT RECEIVED DATE",

            "STAGE BALANCE",

            "INVOICE PDF"

        ]);


        /*
           =================================================
           VARIATIONS + PAYMENT STAGES
           =================================================

           Each Variation is followed immediately
           by its Payment Stages.
        */

        project.variations.forEach(
            function(
                variation,
                variationIndex
            ){

                const totals =
                    getVariationPaymentTotals(
                        variation
                    );


                const payable =
                    parseVariationMoney(
                        variation.payableAmount
                    );


                const financialStatus =
                    getVariationFinancialStatus(
                        variation
                    );


                /*
                   MAIN VARIATION ROW
                */

                rows.push([

                    "VARIATION",

                    variation.variationNumber ||
                    "",

                    variation.variationType ||
                    "",

                    variation.description ||
                    "",

                    variation.contractor ||
                    "",

                    parseVariationMoney(
                        variation.submittedValue
                    ),

                    parseVariationMoney(
                        variation.approvedValue
                    ),

                    payable,

                    variation.status ||
                    "Draft",

                    financialStatus,

                    "",

                    totals.invoiced,

                    "",

                    totals.received,

                    "",

                    payable -
                    totals.received,

                    ""

                ]);


                /*
                   PAYMENT STAGE ROWS
                */

                (
                    variation.paymentStages ||
                    []
                )
                .forEach(
                    function(
                        stage,
                        stageIndex
                    ){

                        const invoice =
                            parseVariationMoney(
                                stage.invoiceValue
                            );


                        const received =
                            parseVariationMoney(
                                stage.receivedValue
                            );


                        const balance =
                            invoice -
                            received;


                        let stageStatus =
                            "Not Paid";


                        if(
                            received > invoice &&
                            invoice > 0
                        ){

                            stageStatus =
                                "Overpaid";

                        }
                        else if(
                            received >= invoice &&
                            invoice > 0
                        ){

                            stageStatus =
                                "Fully Paid";

                        }
                        else if(
                            received > 0
                        ){

                            stageStatus =
                                "Partially Paid";

                        }
                        else if(
                            invoice > 0
                        ){

                            stageStatus =
                                "Invoiced";

                        }


                        rows.push([

                            "PAYMENT STAGE",

                            variation.variationNumber ||
                            "",

                            "",

                            "Payment Stage " +
                            (stageIndex + 1),

                            "",

                            "",

                            "",

                            "",

                            "",

                            stageStatus,

                            stageIndex + 1,

                            invoice,

                            stage.invoiceDate ||
                            "",

                            received,

                            stage.receivedDate ||
                            "",

                            balance,

                            stage.fileName ||
                            ""

                        ]);

                    }
                );


                /*
                   Blank separator after each variation
                   when payment stages exist.
                */

                if(
                    variation.paymentStages &&
                    variation.paymentStages.length > 0
                ){

                    rows.push([]);

                }

            }
        );


        /*
           =================================================
           CREATE WORKSHEET
           =================================================
        */

        const worksheet =
            XLSX.utils.aoa_to_sheet(
                rows
            );


        /*
           =================================================
           COLUMN WIDTHS
           =================================================
        */

        worksheet["!cols"] = [

            { wch:16 },  // Row Type
            { wch:16 },  // Variation No
            { wch:18 },  // Type
            { wch:34 },  // Description
            { wch:28 },  // Contractor
            { wch:18 },  // Submitted
            { wch:18 },  // Approved
            { wch:18 },  // Payable
            { wch:20 },  // Workflow
            { wch:20 },  // Financial
            { wch:10 },  // Stage
            { wch:18 },  // Invoice
            { wch:16 },  // Invoice Date
            { wch:20 },  // Received
            { wch:24 },  // Received Date
            { wch:18 },  // Balance
            { wch:35 }   // PDF
        ];


        /*
           =================================================
           MERGE TITLE
           =================================================
        */

        worksheet["!merges"] = [

            {
                s:{
                    r:0,
                    c:0
                },

                e:{
                    r:0,
                    c:16
                }
            }

        ];


        /*
           =================================================
           FREEZE PANES
           Main table header is row 11 in Excel.
           Zero-based row index = 10.
           =================================================
        */

        worksheet["!freeze"] = {

            xSplit:0,

            ySplit:10

        };


        /*
           =================================================
           NUMBER FORMATTING
           Correct monetary columns:
           5 Submitted
           6 Approved
           7 Payable
           11 Invoice
           13 Received
           15 Balance
           =================================================
        */

        const moneyColumns = [

            5,
            6,
            7,
            11,
            13,
            15

        ];


        /*
           Format summary money cells.
           Summary starts at Excel row 3
           through Excel row 8.
        */

        for(
            let rowIndex = 2;
            rowIndex <= 7;
            rowIndex++
        ){

            const cell =
                worksheet[
                    XLSX.utils.encode_cell({
                        r:rowIndex,
                        c:1
                    })
                ];


            if(cell){

                cell.t = "n";

                cell.z =
                    '#,##0.00';

            }

        }


        /*
           Format all monetary columns
           from the main table onward.

           Main header is zero-based row 9.
           Data starts at zero-based row 10.
        */

        for(
            let rowIndex = 10;
            rowIndex < rows.length;
            rowIndex++
        ){

            moneyColumns.forEach(
                function(columnIndex){

                    const cell =
                        worksheet[
                            XLSX.utils.encode_cell({
                                r:rowIndex,
                                c:columnIndex
                            })
                        ];


                    if(cell){

                        cell.t =
                            "n";

                        cell.z =
                            '#,##0.00';

                    }

                }
            );

        }


        /*
           =================================================
           STYLING
           =================================================
        */


        /*
           TITLE
        */

        if(
            worksheet["A1"]
        ){

            worksheet["A1"].s = {

                font:{
                    bold:true,
                    sz:16,
                    color:{
                        rgb:"FFFFFF"
                    }
                },

                fill:{
                    fgColor:{
                        rgb:"1F4E78"
                    }
                },

                alignment:{
                    horizontal:"center",
                    vertical:"center"
                }

            };

        }


        /*
           PROJECT ROW
        */

        if(
            worksheet["A2"]
        ){

            worksheet["A2"].s = {

                font:{
                    bold:true
                }

            };

        }


        /*
           SUMMARY LABELS

           Zero-based rows 2 through 7.
        */

        for(
            let rowIndex = 2;
            rowIndex <= 7;
            rowIndex++
        ){

            const labelCell =
                worksheet[
                    XLSX.utils.encode_cell({
                        r:rowIndex,
                        c:0
                    })
                ];


            if(labelCell){

                labelCell.s = {

                    font:{
                        bold:true
                    },

                    fill:{
                        fgColor:{
                            rgb:"EAF2F8"
                        }
                    }

                };

            }

        }


        /*
           MAIN TABLE HEADER

           Zero-based row 9.
        */

        for(
            let columnIndex = 0;
            columnIndex <= 16;
            columnIndex++
        ){

            const cell =
                worksheet[
                    XLSX.utils.encode_cell({
                        r:9,
                        c:columnIndex
                    })
                ];


            if(cell){

                cell.s = {

                    font:{
                        bold:true,
                        color:{
                            rgb:"FFFFFF"
                        }
                    },

                    fill:{
                        fgColor:{
                            rgb:"4472C4"
                        }
                    },

                    alignment:{
                        horizontal:"center",
                        vertical:"center",
                        wrapText:true
                    },

                    border:{

                        top:{
                            style:"thin",
                            color:{
                                rgb:"B7C9E2"
                            }
                        },

                        bottom:{
                            style:"thin",
                            color:{
                                rgb:"B7C9E2"
                            }
                        },

                        left:{
                            style:"thin",
                            color:{
                                rgb:"B7C9E2"
                            }
                        },

                        right:{
                            style:"thin",
                            color:{
                                rgb:"B7C9E2"
                            }
                        }

                    }

                };

            }

        }


        /*
           =================================================
           STYLE VARIATION AND STAGE ROWS
           =================================================
        */

        for(
            let rowIndex = 10;
            rowIndex < rows.length;
            rowIndex++
        ){

            const rowTypeCell =
                worksheet[
                    XLSX.utils.encode_cell({
                        r:rowIndex,
                        c:0
                    })
                ];


            if(!rowTypeCell){

                continue;

            }


            const rowType =
                rowTypeCell.v;


            /*
               VARIATION ROWS
            */

            if(
                rowType ===
                "VARIATION"
            ){

                for(
                    let columnIndex = 0;
                    columnIndex <= 16;
                    columnIndex++
                ){

                    const cell =
                        worksheet[
                            XLSX.utils.encode_cell({
                                r:rowIndex,
                                c:columnIndex
                            })
                        ];


                    if(cell){

                        cell.s = {

                            font:{
                                bold:true
                            },

                            fill:{
                                fgColor:{
                                    rgb:"D9EAF7"
                                }
                            },

                            alignment:{
                                vertical:"center",
                                wrapText:true
                            },

                            border:{

                                top:{
                                    style:"thin",
                                    color:{
                                        rgb:"9FBAD0"
                                    }
                                },

                                bottom:{
                                    style:"thin",
                                    color:{
                                        rgb:"9FBAD0"
                                    }
                                }

                            }

                        };

                    }

                }

            }


            /*
               PAYMENT STAGE ROWS
            */

            if(
                rowType ===
                "PAYMENT STAGE"
            ){

                for(
                    let columnIndex = 0;

                    const cell =
                        worksheet[
                            XLSX.utils.encode_cell({

                            },

                            border:{

                                bottom:{
                                    style:"hair",
                                    color:{
                                        rgb:"D9D9D9"
                                    }
                                }

                            }

                        };

                    }

                }


                /*
                   Make stage description visually indented.
                */

                const descriptionCell =
                    worksheet[
                        XLSX.utils.encode_cell({
                            r:rowIndex,
                            c:3
                        })
                    ];


                if(descriptionCell){

                    descriptionCell.s = {

                        font:{
                            italic:true
                        },

                        alignment:{
                            indent:1,
                            vertical:"center"
                        }

                    };

                }


                /*

                */

                const stageCell =
                    worksheet[
                        XLSX.utils.encode_cell({
                            r:rowIndex,
                            c:10
                        })
                    ];


                if(stageCell){

                    stageCell.s = {

                        font:{
                            bold:true
                        },

                        alignment:{
                            horizontal:"center"
                        }

                    };

                }

            }

        }


        /*
           =================================================
           ALIGNMENT
           =================================================
        */

        for(
            let rowIndex = 10;
            rowIndex < rows.length;
            rowIndex++
        ){

            /*
               MONEY COLUMNS RIGHT ALIGNED
            */

            moneyColumns.forEach(
                function(columnIndex){

                    const cell =
                        worksheet[
                            XLSX.utils.encode_cell({
                                r:rowIndex,
                                c:columnIndex
                            })
                        ];


                    if(cell){

                        if(!cell.s){

                            cell.s = {};

                        }


                        cell.s.alignment = {

                            horizontal:"right",

                            vertical:"center"

                        };

                    }

                }
            );


            /*
               STATUS / STAGE / DATE COLUMNS CENTERED
            */

            [
                0,
                8,
                9,
                10,
                12,
                14
            ]
            .forEach(
                function(columnIndex){

                    const cell =
                        worksheet[
                            XLSX.utils.encode_cell({
                                r:rowIndex,
                                c:columnIndex
                            })
                        ];


                    if(cell){

                        if(!cell.s){

                            cell.s = {};

                        }


                        cell.s.alignment = {

                            horizontal:"center",

                            vertical:"center",

                            wrapText:true

                        };

                    }

                }
            );

        }


        /*
           =================================================
           ROW HEIGHTS
           =================================================
        */

        worksheet["!rows"] = [];


        worksheet["!rows"][0] = {

            hpt:28

        };


        worksheet["!rows"][9] = {

            hpt:35

        };


        /*
           =================================================
           CREATE WORKBOOK
           =================================================
        */

        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Variations"
        );


        /*
           =================================================
           FILE NAME
           =================================================
        */

        const projectName =
            (
                project.name ||
                project.projectName ||
                "Project"
            )
            .toString()
            .replace(
                /[\\/:*?"<>|]/g,
                ""
            )
            .trim();


        const fileName =
            projectName +
            " - Variations Register.xlsx";


        /*
           =================================================
           DOWNLOAD
           =================================================
        */

        XLSX.writeFile(
            workbook,
            fileName
        );

    }
    catch(error){

        console.error(
            "Variation Excel export error:",
            error
        );


        alert(
            "Unable to export the Variations to Excel.\n\n" +
            error.message
        );

    }

};

window.deleteVariation =
async function(
    projectId,
    index
){

    const project =
        getVariationsProject(
            projectId
        );


    if(!project){

        return;

    }


    const variation =
        project.variations[
            index
        ];


    if(!variation){

        return;

    }


    if(
        !confirm(
            "Delete this variation and all its payment stages?"
        )
    ){

        return;

    }


    for(
        const stage
        of (
            variation.paymentStages ||
            []
        )
    ){

        if(stage.fileId){

            await deleteVariationPDF(
                stage.fileId
            );

        }

    }


    project.variations.splice(
        index,
        1
    );


    persist();


    renderVariationsSection(
        project
    );

};
/* =====================================================
   MANPOWER MODULE - STEP 1
   MANPOWER DEPLOYMENT REGISTER
===================================================== */

function almManpowerEscape(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   INITIALIZE MANPOWER
===================================================== */

function almEnsureManpower(project){

    if(!project.manpowerRecords){
        project.manpowerRecords = [];
        persist();
    }

    return project.manpowerRecords;

}

   RENDER MANPOWER

/* =====================================================
   MANPOWER STEP 2
   CURRENT MANPOWER POSITION
===================================================== */

function almMP2Today(){

    const d = new Date();

    const year =
        d.getFullYear();

    const month =
        String(d.getMonth() + 1)
        .padStart(2,"0");

    const day =
        String(d.getDate())
        .padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =====================================================
   CHECK ACTIVE MANPOWER
===================================================== */

function almMP2IsActive(
    record,
    selectedDate
){

    if(!record.startDate || !record.endDate){
        return false;
    }

    return (
        record.startDate <= selectedDate &&
        selectedDate <= record.endDate
    );

}


/* =====================================================
   CURRENT MANPOWER CALCULATION
===================================================== */

function almMP2GetCurrentStats(
    project,
    selectedDate
){

    const records =
        project.manpowerRecords || [];


    const activeRecords =
        records.filter(
            record =>
                almMP2IsActive(
                    record,
                    selectedDate
                )
        );


    const total =
        activeRecords.reduce(
            (sum,record) =>
                sum + Number(record.manpower || 0),
            0
        );


    const direct =
        activeRecords
            .filter(
                record =>
                    record.type === "Direct"
            )
            .reduce(
                (sum,record) =>
                    sum + Number(record.manpower || 0),
                0
            );


    const subcontractor =
        activeRecords
            .filter(
                record =>
                    record.type === "Subcontractor"
            )
            .reduce(
                (sum,record) =>
                    sum + Number(record.manpower || 0),
                0
            );


    const stages =
        new Set(
            activeRecords
                .map(
                    record =>
                        String(
                            record.workStage || ""
                        ).trim()
                )
                .filter(Boolean)
        );


    const trades =
        new Set(
            activeRecords
                .map(
                    record =>
                        String(
                            record.trade || ""
                        ).trim()
                )
                .filter(Boolean)
        );


    return {

        total,

        direct,

        subcontractor,

        activeDeployments:
            activeRecords.length,

        activeStages:
            stages.size,

        activeTrades:
            trades.size,

        activeRecords

    };

}

){

    const project =
        projects.find(
            p => String(p.id) === String(projectId)
        );

    if(!project){
        return;
    }

    almEnsureManpower(project);

    if(!project.manpowerRecords[index]){
        return;
    }


    if(field === "manpower"){

        project.manpowerRecords[index][field] =
            Math.max(
                0,
                Number(value || 0)
            );

    }else{

        project.manpowerRecords[index][field] =
            value;

    }


    persist();

};


/* =====================================================
   DELETE DEPLOYMENT
===================================================== */

window.almDeleteManpower = function(
    projectId,
    index
){

    const project =
        projects.find(
            p => String(p.id) === String(projectId)
        );

    if(!project){
        return;
    }

    almEnsureManpower(project);


    if(!project.manpowerRecords[index]){
        return;
    }


    if(
        !confirm(
            "Delete this manpower deployment?"
        )
    ){

        return;

    }


    project.manpowerRecords.splice(
        index,
        1
    );

    persist();

    renderManpowerSection(project);

};

/* =====================================================
   GET PROJECT DATE RANGE
===================================================== */

function almMP3GetProjectDateRange(project){

    const records =
        project.manpowerRecords || [];


    const validRecords =
        records.filter(
            record =>
                record.startDate &&
                record.endDate
        );


    if(!validRecords.length){

        return null;

    }


    let startDate =
        validRecords[0].startDate;

    let endDate =
        validRecords[0].endDate;


    validRecords.forEach(
        record => {

            if(
                record.startDate <
                startDate
            ){

                startDate =
                    record.startDate;

            }


            if(
                record.endDate >
                endDate
            ){

                endDate =
                    record.endDate;

            }

        }
    );


    return {

        startDate,

        endDate

    };

}


/* =====================================================
   MONTHLY MANPOWER CALCULATION
===================================================== */

function almMP3GetMonthlyData(project){

    const records =
        project.manpowerRecords || [];


    const range =
        almMP3GetProjectDateRange(project);


    if(!range){

        return [];

    }


    const start =
        new Date(
            range.startDate + "T00:00:00"
        );


    const end =
        new Date(
            range.endDate + "T00:00:00"
        );


    start.setDate(1);

    end.setDate(1);


    const months = [];


    let cursor =
        new Date(start);


    while(cursor <= end){

        const year =
            cursor.getFullYear();

        const month =
            cursor.getMonth();


        const monthStart =
            new Date(
                year,
                month,
                1
            );


        const monthEnd =
            new Date(
                year,
                month + 1,
                0
            );


        const monthStartString =
            almMP3DateString(
                monthStart
            );


        const monthEndString =
            almMP3DateString(
                monthEnd
            );


        const dailyValues = [];

        const dailyDirect = [];

        const dailySubcontractor = [];


        let day =
            new Date(monthStart);


        while(day <= monthEnd){

            const dayString =
                almMP3DateString(day);


            const active =
                records.filter(
                    record =>
                        record.startDate &&
                        record.endDate &&
                        record.startDate <= dayString &&
                        dayString <= record.endDate
                );


            let total = 0;

            let direct = 0;

            let subcontractor = 0;


            active.forEach(
                record => {

                    const manpower =
                        Number(
                            record.manpower || 0
                        );


                    total += manpower;


                    if(
                        record.type ===
                        "Subcontractor"
                    ){

                        subcontractor +=
                            manpower;

                    }else{

                        direct +=
                            manpower;

                    }

                }
            );


            dailyValues.push(total);

            dailyDirect.push(direct);

            dailySubcontractor.push(
                subcontractor
            );


            day.setDate(
                day.getDate() + 1
            );

        }


        const average =
            dailyValues.length
            ?
            dailyValues.reduce(
                (a,b) => a + b,
                0
            ) / dailyValues.length
            :
            0;


        const peak =
            dailyValues.length
            ?
            Math.max(
                ...dailyValues
            )
            :
            0;


        const monthEndValue =
            dailyValues.length
            ?
            dailyValues[
                dailyValues.length - 1
            ]
            :
            0;


        const directAverage =
            dailyDirect.length
            ?
            dailyDirect.reduce(
                (a,b) => a + b,
                0
            ) / dailyDirect.length
            :
            0;


        const subcontractorAverage =
            dailySubcontractor.length
            ?
            dailySubcontractor.reduce(
                (a,b) => a + b,
                0
            ) / dailySubcontractor.length
            :
            0;


        months.push({

            year,

            month,

            label:
                cursor.toLocaleDateString(
                    "en-GB",
                    {
                        month:"short",
                        year:"numeric"
                    }
                ),

            average,

            peak,

            monthEnd:
                monthEndValue,

            directAverage,

            subcontractorAverage

        });


        cursor.setMonth(
            cursor.getMonth() + 1
        );

    }


    return months;

}


/* =====================================================
   DATE FORMAT
===================================================== */

function almMP3DateString(date){

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");


    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}

/* =====================================================
   GET WORK STAGE DATA
===================================================== */

function almMP4GetWorkStageData(project){

    const records =
        project.manpowerRecords || [];


    const selectedDate =
        project.manpowerAsOfDate ||
        almMP2Today();


    const activeRecords =
        records.filter(
            record =>
                almMP2IsActive(
                    record,
                    selectedDate
                )
        );


    const stageMap = {};


    activeRecords.forEach(
        record => {

            const stage =
                String(
                    record.workStage || ""
                ).trim();


            if(!stage){
                return;
            }


            if(!stageMap[stage]){

                stageMap[stage] = {

                    stage,

                    total: 0,

                    direct: 0,

                    subcontractor: 0,

                    deployments: 0

                };

            }


            const manpower =
                Number(
                    record.manpower || 0
                );


            stageMap[stage].total +=
                manpower;


            stageMap[stage].deployments +=
                1;


            if(
                record.type ===
                "Subcontractor"
            ){

                stageMap[stage].subcontractor +=
                    manpower;

            }else{

                stageMap[stage].direct +=
                    manpower;

            }

        }
    );


    return Object.values(stageMap)
        .sort(
            (a,b) =>
                b.total - a.total
        );

}

            260,

/* =====================================================
   GET TRADE DATA
===================================================== */

function almMP5GetTradeData(project){

    const records =
        project.manpowerRecords || [];

    const selectedDate =
        project.manpowerAsOfDate ||
        almMP2Today();

    const activeRecords =
        records.filter(
            record =>
                almMP2IsActive(
                    record,
                    selectedDate
                )
        );

    const tradeMap = {};

    activeRecords.forEach(
        record => {

            const trade =
                String(
                    record.trade || ""
                ).trim();

            if(!trade){
                return;
            }

            if(!tradeMap[trade]){

                tradeMap[trade] = {

                    trade,

                    total: 0,

                    direct: 0,

                    subcontractor: 0,

                    deployments: 0

                };

            }

            const manpower =
                Number(
                    record.manpower || 0
                );

            tradeMap[trade].total +=
                manpower;

            tradeMap[trade].deployments +=
                1;

            if(
                record.type ===
                "Subcontractor"
            ){

                tradeMap[trade].subcontractor +=
                    manpower;

            }else{

                tradeMap[trade].direct +=
                    manpower;

            }

        }
    );

    return Object.values(tradeMap)
        .sort(
            (a,b) =>
                b.total - a.total
        );

}


/* =====================================================
   BUILD TRADE BAR CHART
===================================================== */

function almMP5BuildTradeChart(
    tradeData
){

    if(!tradeData.length){

        return `
            <div style="
                padding:40px;
                text-align:center;
                color:#64748b;
            ">
                No active trade manpower
                for the selected date.
            </div>
        `;

    }

    const width = 1000;

    const rowHeight = 48;

    const height =
        Math.max(
            260,
            80 +
            tradeData.length *
            rowHeight
        );

    const left = 210;

    const right = 60;

    const top = 25;

    const bottom = 35;

    const chartWidth =
        width -
        left -
        right;

    const maxValue =
        Math.max(
            1,
            ...tradeData.map(
                item =>
                    item.total
            )
        );

    let grid = "";

    for(let i = 0; i <= 5; i++){

        const value =
            maxValue *
            (i / 5);

        const x =
            left +
            (
                i / 5
            ) *
            chartWidth;

        grid += `

            <line
                x1="${x}"
                y1="${top}"
                x2="${x}"
                y2="${height - bottom}"
                stroke="#e5e7eb"
                stroke-width="1"
            />

            <text
                x="${x}"
                y="${height - 12}"
                text-anchor="middle"
                font-size="11"
                fill="#64748b"
            >
                ${Math.round(value)}
            </text>

        `;

    }

    let bars = "";

    tradeData.forEach(
        (item,index) => {

            const y =
                top +
                index *
                rowHeight;

            const barWidth =
                (
                    item.total /
                    maxValue
                ) *
                chartWidth;

            bars += `

                <text
                    x="${left - 12}"
                    y="${y + 23}"
                    text-anchor="end"
                    font-size="12"
                    fill="#374151"
                >
                    ${almManpowerEscape(
                        item.trade
                    )}
                </text>

                <rect
                    x="${left}"
                    y="${y + 7}"
                    width="${barWidth}"
                    height="26"
                    rx="4"
                    fill="#17243a"
                />

                <text
                    x="${left + barWidth + 8}"
                    y="${y + 25}"
                    font-size="12"
                    font-weight="600"
                    fill="#17243a"
                >
                    ${item.total}
                </text>

            `;

        }
    );

    return `

        <div style="
            width:100%;
            overflow-x:auto;
        ">

            <svg
                viewBox="
                    0 0
                    ${width}
                    ${height}
                "
                style="
                    width:100%;
                    min-width:750px;
                    height:auto;
                    display:block;
                "
            >

                ${grid}

                ${bars}

            </svg>

        </div>

    `;

}

/* =====================================================
   GET TIMELINE RANGE
===================================================== */

function almMP6GetTimelineRange(project){

    const records =
        project.manpowerRecords || [];

    const validRecords =
        records.filter(
            record =>
                record.startDate &&
                record.endDate &&
                record.endDate >= record.startDate
        );

    if(!validRecords.length){

        return null;

    }

    let startDate =
        validRecords[0].startDate;

    let endDate =
        validRecords[0].endDate;


    validRecords.forEach(
        record => {

            if(record.startDate < startDate){

                startDate =
                    record.startDate;

            }

            if(record.endDate > endDate){

                endDate =
                    record.endDate;

            }

        }
    );


    return {

        startDate,

        endDate

    };

}


/* =====================================================
   BUILD TIMELINE
===================================================== */

function almMP6BuildTimeline(project){

    const records =
        (project.manpowerRecords || [])
            .filter(
                record =>
                    record.startDate &&
                    record.endDate &&
                    record.endDate >= record.startDate
            );


    if(!records.length){

        return `
            <div style="
                padding:40px;
                text-align:center;
                color:#64748b;
            ">
                No dated manpower deployments
                available for the timeline.
            </div>
        `;

    }


    const range =
        almMP6GetTimelineRange(project);


    if(!range){

        return "";

    }


    const start =
        new Date(
            range.startDate + "T00:00:00"
        );


    const end =
        new Date(
            range.endDate + "T00:00:00"
        );


    const totalDays =
        Math.max(
            1,
            Math.ceil(
                (
                    end - start
                ) /
                86400000
            ) + 1
        );


    /*
       Timeline width.
       More days = wider timeline.
    */

    const dayWidth = 9;

    const timelineWidth =
        Math.max(
            850,
            totalDays * dayWidth
        );


    const labelWidth = 280;

    const manpowerWidth = 90;

    const rowHeight = 52;

    const headerHeight = 65;


    const height =
        headerHeight +
        records.length *
        rowHeight +
        20;


    /* ---------------------------------------------
       MONTH HEADERS
    --------------------------------------------- */

    let monthHeaders = "";

    let cursor =
        new Date(
            start.getFullYear(),
            start.getMonth(),
            1
        );


    while(cursor <= end){

        const monthStart =
            new Date(cursor);


        const nextMonth =
            new Date(
                cursor.getFullYear(),
                cursor.getMonth() + 1,
                1
            );


        const visibleStart =
            monthStart < start
            ? start
            : monthStart;


        const visibleEnd =
            nextMonth > end
            ? end
            : new Date(
                nextMonth.getTime() - 86400000
            );


        const offsetStart =
            Math.max(
                0,
                Math.round(
                    (
                        visibleStart - start
                    ) /
                    86400000
                )
            );


        const days =
            Math.round(
                (
                    visibleEnd -
                    visibleStart
                ) /
                86400000
            ) + 1;


        const x =
            offsetStart *
            dayWidth;


        const width =
            days *
            dayWidth;


        const label =
            cursor.toLocaleDateString(
                "en-GB",
                {
                    month:"short",
                    year:"numeric"
                }
            );


        monthHeaders += `

            <rect
                x="${x}"
                y="0"
                width="${width}"
                height="32"
                fill="#f3f6fa"
                stroke="#e5e7eb"
            />

            <text
                x="${x + width / 2}"
                y="20"
                text-anchor="middle"
                font-size="11"
                font-weight="600"
                fill="#374151"
            >
                ${label}
            </text>

        `;


        cursor.setMonth(
            cursor.getMonth() + 1
        );

    }


    /* ---------------------------------------------
       DATE GRID
    --------------------------------------------- */

    let grid = "";


    let gridDate =
        new Date(start);


    while(gridDate <= end){

        const dayIndex =
            Math.round(
                (
                    gridDate - start
                ) /
                86400000
            );


        const x =
            dayIndex *
            dayWidth;


        const isMonthStart =
            gridDate.getDate() === 1;


        if(
            isMonthStart ||
            gridDate.getDate() === 15
        ){

            grid += `

                <line
                    x1="${x}"
                    y1="32"
                    x2="${x}"
                    y2="${height}"
                    stroke="#e5e7eb"
                    stroke-width="1"
                />

                <text
                    x="${x + 3}"
                    y="50"
                    font-size="9"
                    fill="#64748b"
                >
                    ${String(
                        gridDate.getDate()
                    ).padStart(2,"0")}
                </text>

            `;

        }


        gridDate.setDate(
            gridDate.getDate() + 1
        );

    }


    /* ---------------------------------------------
       DEPLOYMENT ROWS
    --------------------------------------------- */

    let rows = "";


    records.forEach(
        (record,index) => {

            const recordStart =
                new Date(
                    record.startDate +
                    "T00:00:00"
                );


            const recordEnd =
                new Date(
                    record.endDate +
                    "T00:00:00"
                );


            const startOffset =
                Math.max(
                    0,
                    Math.round(
                        (
                            recordStart -
                            start
                        ) /
                        86400000
                    )
                );


            const duration =
                Math.round(
                    (
                        recordEnd -
                        recordStart
                    ) /
                    86400000
                ) + 1;


            const barX =
                startOffset *
                dayWidth;


            const barWidth =
                Math.max(
                    dayWidth,
                    duration *
                    dayWidth
                );


            const rowY =
                headerHeight +
                index *
                rowHeight;


            const typeLabel =
                record.type ===
                "Subcontractor"
                ?
                "Subcontractor"
                :
                "Direct";


            rows += `

                <!-- ROW BACKGROUND -->

                <rect
                    x="0"
                    y="${rowY}"
                    width="${timelineWidth}"
                    height="${rowHeight}"
                    fill="${
                        index % 2 === 0
                        ? "#ffffff"
                        : "#fafbfc"
                    }"
                    stroke="#eef0f3"
                />


                <!-- BAR -->

                <rect
                    x="${barX}"
                    y="${rowY + 14}"
                    width="${barWidth}"
                    height="24"
                    rx="5"
                    fill="#17243a"
                />


                <!-- MANPOWER ON BAR -->

                <text
                    x="${barX + barWidth / 2}"
                    y="${rowY + 30}"
                    text-anchor="middle"
                    font-size="10"
                    font-weight="700"
                    fill="white"
                >
                    ${Number(
                        record.manpower || 0
                    )}
                </text>


                <!-- LEFT LABEL -->

                <text
                    x="${-labelWidth + 10}"
                    y="${rowY + 19}"
                    font-size="11"
                    font-weight="600"
                    fill="#374151"
                >
                    ${almManpowerEscape(
                        record.workStage ||
                        "Unspecified"
                    )}
                </text>


                <text
                    x="${-labelWidth + 10}"
                    y="${rowY + 35}"
                    font-size="9"
                    fill="#64748b"
                >
                    ${almManpowerEscape(
                        record.trade || ""
                    )}
                    ${
                        record.company
                        ?
                        " • " +
                        almManpowerEscape(
                            record.company
                        )
                        :
                        ""
                    }
                </text>


                <!-- RIGHT MANPOWER -->

                <text
                    x="${timelineWidth + 15}"
                    y="${rowY + 29}"
                    font-size="11"
                    font-weight="700"
                    fill="#17243a"
                >
                    ${Number(
                        record.manpower || 0
                    )}
                </text>

            `;

        }
    );


    /*
       SVG uses a negative left area for labels.
       Wrap everything in a translated group.
    */

    return `

        <div style="
            overflow-x:auto;
            width:100%;
            padding-bottom:8px;
        ">

            <svg
                viewBox="
                    ${-labelWidth}
                    0
                    ${timelineWidth +
                      labelWidth +
                      manpowerWidth}
                    ${height}
                "
                style="
                    width:100%;
                    min-width:1100px;
                    height:auto;
                    display:block;
                "
            >

                <!-- HEADER LABEL -->

                <text
                    x="${-labelWidth + 10}"
                    y="20"
                    font-size="11"
                    font-weight="700"
                    fill="#374151"
                >
                    WORK STAGE / TRADE
                </text>

/* =====================================================
