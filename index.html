<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALM Project Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}

body{
    background:#f4f6f8;
    color:#172033;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:255px;
    background:#17243a;
    color:white;
    padding:25px 16px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:35px;
}

.logo-box{
    background:#f5a400;
    color:white;
    width:40px;
    height:40px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu button{
    border:0;
    background:transparent;
    color:#e7edf7;
    padding:13px 12px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#2b405f;
}

/* MAIN */
.main{
    margin-left:255px;
    width:calc(100% - 255px);
}

.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid #e1e5ea;
    display:flex;
    align-items:center;
    padding:0 32px;
}

.search{
    width:430px;
    padding:13px 16px;
    border:1px solid #d5dbe3;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.content{
    padding:30px 34px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#708096;
}

/* BUTTONS */
.btn{
    border:0;
    padding:12px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#1976b8;
    color:white;
}

.btn-primary:hover{
    background:#125e94;
}

.btn-secondary{
    background:#e8edf3;
    color:#25344a;
}

.btn-danger{
    background:#dc3545;
    color:white;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:22px;
}

.stat-card .label{
    color:#708096;
    margin-bottom:12px;
}

.stat-card .number{
    font-size:32px;
    font-weight:bold;
}

/* TABLE */
.panel{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    overflow:hidden;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 22px;
    border-bottom:1px solid #e5e9ee;
}

.panel-header h2{
    font-size:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:16px 18px;
    text-align:left;
    border-bottom:1px solid #edf0f3;
    font-size:14px;
}

th{
    color:#68788e;
    background:#fafbfc;
}

tr:hover td{
    background:#fafcff;
}

.project-name{
    font-weight:bold;
    color:#17243a;
}

.progress-wrap{
    width:120px;
}

.progress-bar{
    height:7px;
    background:#e5e9ee;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.progress-fill{
    height:100%;
    background:#1976b8;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-active{
    background:#d9f7e5;
    color:#148344;
}

.badge-delayed{
    background:#fff0c7;
    color:#a56a00;
}

.badge-completed{
    background:#dce8ff;
    color:#2459a6;
}

.badge-onhold{
    background:#eceff3;
    color:#657284;
}

.actions{
    display:flex;
    gap:7px;
}

.action-btn{
    border:1px solid #d8dee6;
    background:white;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
}

.action-btn:hover{
    background:#f0f4f8;
}

/* MODAL */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal{
    width:700px;
    max-width:94%;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
    padding:22px 25px;
    border-bottom:1px solid #e5e9ee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:21px;
}

.close{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    color:#68788e;
}

.modal-body{
    padding:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:13px;
    font-weight:bold;
    color:#4d5d73;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #d4dae2;
    border-radius:6px;
    outline:none;
    font-size:14px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#1976b8;
}

.modal-footer{
    padding:18px 25px;
    border-top:1px solid #e5e9ee;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}
/* =========================
   PROJECT DETAILS WINDOW
========================= */

.project-details-modal{

    width:1100px;
    max-width:95%;
    height:85vh;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
}


.project-details-header{

    min-height:80px;

    padding:20px 25px;

    border-bottom:1px solid #e5e9ee;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.project-details-header h2{

    font-size:24px;

    color:#17243a;

}


.project-details-code{

    color:#708096;

    font-size:13px;

    margin-top:5px;

}


.project-details-layout{

    display:grid;

    grid-template-columns:230px 1fr;

    flex:1;

    min-height:0;

}


.project-details-menu{

    background:#f7f9fb;

    border-right:1px solid #e1e5ea;

    padding:15px;

    overflow-y:auto;

}


.project-menu-btn{

    width:100%;

    border:0;

    background:transparent;

    color:#46566c;

    padding:12px 14px;

    margin-bottom:5px;

    border-radius:7px;

    text-align:left;

    cursor:pointer;

    font-size:14px;

}


.project-menu-btn:hover{

    background:#e8edf3;

}


.project-menu-btn.active{

    background:#1976b8;

    color:white;

    font-weight:bold;

}


.project-details-content{

    padding:28px;

    overflow-y:auto;

}


.project-section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}


.project-section-header h3{

    font-size:22px;

    color:#17243a;

}


.project-section-header p{

    color:#708096;

    margin-top:5px;

    font-size:14px;

}


.project-info-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;

}


.project-info-card{

    border:1px solid #e1e5ea;

    border-radius:8px;

    padding:17px;

    background:#fafbfc;

}


.project-info-card span{

    display:block;

    color:#708096;

    font-size:12px;

    margin-bottom:7px;

}


.project-info-card strong{

    font-size:15px;

    color:#17243a;

}


.project-description{

    margin-top:22px;

    padding:20px;

    border:1px solid #e1e5ea;

    border-radius:8px;

}


.project-description h3{

    margin-bottom:10px;

}


.project-description p{

    color:#68788e;

    line-height:1.6;

}


.project-empty-section{

    min-height:350px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    border:2px dashed #dfe5ec;

    border-radius:10px;

    color:#708096;

}


.project-empty-icon{

    font-size:45px;

    margin-bottom:15px;

}


.project-empty-section h3{

    color:#17243a;

    margin-bottom:8px;

}


.project-empty-section p{

    max-width:450px;

    line-height:1.6;

}
/* RESPONSIVE */
@media(max-width:1000px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .sidebar{
        width:200px;
    }

    .main{
        margin-left:200px;
        width:calc(100% - 200px);
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    table{
        min-width:900px;
    }

    .panel{
        overflow-x:auto;
    }
}
    /* =========================
   DRAWINGS MODULE
========================= */

.project-link{
    cursor:pointer;
    color:#17243a;
}

.project-link:hover{
    color:#1976b8;
    text-decoration:underline;
}

.module-page{
    padding:0;
}

.module-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.module-toolbar-left h1{
    font-size:28px;
    margin-bottom:5px;
}

.module-toolbar-left p{
    color:#708096;
}

.back-btn{
    border:0;
    background:#e8edf3;
    color:#25344a;
    padding:11px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.back-btn:hover{
    background:#dce3eb;
}

.drawing-table-wrap{
    overflow-x:auto;
}

.drawing-number{
    font-weight:bold;
    color:#17243a;
}

.drawing-title{
    font-weight:bold;
}

.drawing-file{
    color:#1976b8;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
}

.drawing-file:hover{
    text-decoration:underline;
}

.revision-badge{
    display:inline-block;
    background:#eef3f8;
    color:#34495e;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status-review{
    background:#fff0c7;
    color:#a56a00;
}

.drawing-status-approved{
    background:#d9f7e5;
    color:#148344;
}

.drawing-status-rejected{
    background:#ffe0e3;
    color:#b42332;
}

.drawing-status-superseded{
    background:#eceff3;
    color:#657284;
}

.drawing-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.drawing-modal{
    width:760px;
}

.file-name{
    margin-top:6px;
    font-size:12px;
    color:#708096;
}

.info-box{
    background:#f7f9fb;
    border:1px solid #e1e5ea;
    border-radius:8px;
    padding:14px;
    margin-bottom:20px;
}

.info-box strong{
    color:#17243a;
}

.no-drawings{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}

@media(max-width:700px){
    .module-toolbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }
}
    /* =====================================================
   MANPOWER MODULE
===================================================== */
let manpowerFilters = {
    dateFrom: "",
    dateTo: "",
    workStage: "All",
    type: "All",
    trade: "All"
};
.manpower-dashboard{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.manpower-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.manpower-stat{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:20px;
}

.manpower-stat-label{
    color:#708096;
    font-size:13px;
    margin-bottom:8px;
}

.manpower-stat-value{
    font-size:30px;
    font-weight:bold;
    color:#17243a;
}

.manpower-stat-sub{
    margin-top:5px;
    color:#708096;
    font-size:12px;
}

.manpower-chart-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.manpower-chart{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:20px;
}

.manpower-chart h3{
    font-size:17px;
    color:#17243a;
    margin-bottom:5px;
}

.manpower-chart p{
    color:#708096;
    font-size:12px;
    margin-bottom:18px;
}

.manpower-bar-row{
    display:grid;
    grid-template-columns:145px 1fr 45px;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.manpower-bar-label{
    font-size:12px;
    color:#46566c;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.manpower-bar-track{
    height:10px;
    background:#edf1f5;
    border-radius:20px;
    overflow:hidden;
}

.manpower-bar-fill{
    height:100%;
    background:#1976b8;
    border-radius:20px;
}

.manpower-bar-value{
    font-size:12px;
    font-weight:bold;
    text-align:right;
}

.manpower-table-wrap{
    overflow-x:auto;
}

.manpower-table{
    min-width:1200px;
}

.manpower-table input,
.manpower-table select{
    width:100%;
    min-width:100px;
    padding:8px 9px;
    border:1px solid #d4dae2;
    border-radius:5px;
    background:white;
    font-size:13px;
}

.manpower-table input:focus,
.manpower-table select:focus{
    outline:none;
    border-color:#1976b8;
}

.manpower-number{
    width:75px !important;
    min-width:75px !important;
    text-align:center;
}

.manpower-total-cell{
    font-weight:bold;
    font-size:15px;
    color:#17243a;
    text-align:center;
}

.manpower-type-direct{
    background:#e8f3fb;
    color:#176394;
    padding:5px 8px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
}

.manpower-type-sub{
    background:#fef3c7;
    color:#946200;
    padding:5px 8px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
}

.manpower-current-stage{
    background:#f7f9fb;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:18px 20px;
}

.manpower-current-stage-label{
    color:#708096;
    font-size:12px;
    margin-bottom:5px;
}

.manpower-current-stage-value{
    font-size:20px;
    font-weight:bold;
    color:#17243a;
}

.manpower-trend{
    width:100%;
    height:220px;
}

.manpower-trend svg{
    width:100%;
    height:100%;
}

.manpower-empty{
    text-align:center;
    padding:45px 20px;
    color:#708096;
}

.manpower-empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.manpower-section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.manpower-section-title h2{
    font-size:20px;
    color:#17243a;
}

.manpower-section-title p{
    color:#708096;
    font-size:13px;
    margin-top:4px;
}

.manpower-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.manpower-small-btn{
    border:1px solid #d8dee6;
    background:white;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
    font-size:12px;
}

.manpower-small-btn:hover{
    background:#f0f4f8;
}

@media(max-width:1000px){

    .manpower-stats{
        grid-template-columns:repeat(2,1fr);
    }

    .manpower-chart-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .manpower-stats{
        grid-template-columns:1fr;
    }

}

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-box">ALM</div>
            <div>ALM<br>Project Manager</div>
        </div>

        <nav class="menu">
            <button class="active" onclick="showDashboard()">▦ Dashboard</button>
            <button onclick="showProjects()">▣ Projects</button>
            <button>☑ Tasks</button>
            <button>▤ Documents</button>
            <button>🛒 Procurement</button>
            <button>▣ Payments</button>
            <button>⚒ Variations</button>
            <button>♟ Manpower</button>
            <button>▣ Equipment</button>
            <button>▤ Reports</button>
            <button>⚙ Settings</button>
        </nav>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <input
                id="globalSearch"
                class="search"
                type="text"
                placeholder="Search projects, tasks, documents..."
                oninput="searchProjects()"
            >
        </header>

        <section class="content" id="pageContent"></section>

    </main>

</div>

<!-- DRAWING MODAL -->
<div class="modal-overlay" id="drawingModal">

    <div class="modal drawing-modal">

        <div class="modal-header">

            <h2 id="drawingModalTitle">
                Upload Drawing
            </h2>

            <button
                class="close"
                onclick="closeDrawingModal()">
                ×
            </button>

        </div>


        <form
            id="drawingForm"
            onsubmit="saveDrawing(event)">

            <div class="modal-body">

                <div class="info-box">
                    Project:
                    <strong id="drawingProjectName">
                        -
                    </strong>
                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Drawing Number *
                        </label>

                        <input
                            id="drawingNumber"
                            required
                            placeholder="e.g. STR-001">

                    </div>


                    <div class="form-group">

                        <label>
                            Drawing Title *
                        </label>

                        <input
                            id="drawingTitle"
                            required
                            placeholder="e.g. Foundation Layout">

                    </div>


                    <div class="form-group">

                        <label>
                            Discipline
                        </label>

                        <select id="drawingDiscipline">

                            <option value="Architectural">
                                Architectural
                            </option>

                            <option value="Structural">
                                Structural
                            </option>

                            <option value="Civil">
                                Civil
                            </option>

                            <option value="MEP">
                                MEP
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Revision
                        </label>

                        <input
                            id="drawingRevision"
                            placeholder="Rev.00">

                    </div>


                    <div class="form-group">

                        <label>
                            Drawing Date
                        </label>

                        <input
                            id="drawingDate"
                            type="date">

                    </div>


                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="drawingStatus">

                            <option value="For Review">
                                For Review
                            </option>

                            <option value="Approved">
                                Approved
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                            <option value="Superseded">
                                Superseded
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            Drawing File *
                        </label>

                        <input
                            id="drawingFile"
                            type="file"
                            accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png"
                            required>

                        <div
                            class="file-name"
                            id="selectedDrawingFile">
                            No file selected
                        </div>

                    </div>


                    <div class="form-group full">

                        <label>
                            Remarks
                        </label>

                        <textarea
                            id="drawingRemarks"
                            placeholder="Additional remarks...">
                        </textarea>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeDrawingModal()">

                    Cancel

                </button>


                <button

/* =========================

window.createBOQFolder = function(projectId){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project) return;

    if(!project.boqFolders){
        project.boqFolders = [];
    }

    const name = prompt(
        "Enter folder name:"
    );

    if(!name || !name.trim()){
        return;
    }

    const folder = {

        id:
            "boq_folder_" +
            Date.now(),

        name:
            name.trim()

    };

    project.boqFolders.push(folder);

    persist();

    showProjectSection(
        "boq",
        projectId
    );

};


/* =========================
   OPEN BOQ FOLDER
========================= */

window.openBOQFolder = function(projectId, folderId){

    console.log("OPEN BOQ FOLDER:", {
        projectId: projectId,
        folderId: folderId
    });

    const project = projects.find(
        p => String(p.id) === String(projectId)
    );

    if(!project){
        console.error("PROJECT NOT FOUND:", projectId);
        return;
    }

    ensureBOQFolders(project);

    /* ROOT */
    if(folderId === null || folderId === undefined){

        window.boqCurrentFolder[projectId] = null;

        console.log("OPENING BOQ ROOT");

        showProjectSection(
            "boq",
            projectId
        );

        return;
    }

    /* FIND FOLDER */
    const folder = project.boqFolders.find(
        f => String(f.id) === String(folderId)
    );

    if(!folder){

        console.error(
            "BOQ FOLDER NOT FOUND:",
            folderId,
            project.boqFolders
        );

        return;
    }

    /* SAVE CURRENT FOLDER */
    window.boqCurrentFolder[projectId] = folder.id;

    console.log(
        "OPENING BOQ FOLDER:",
        folder.name,
        folder.id
    );

    /* REFRESH BOQ */
    showProjectSection(
        "boq",
        projectId
    );

};

window.uploadBOQ = function(projectId){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project) return;

    if(!project.boqs){
        project.boqs = [];
    }

    const currentFolderId =
        window.boqCurrentFolder?.[projectId] || null;

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept =
        ".pdf,.xlsx,.xls,.csv";

    input.onchange = function(){

        const file = input.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload = function(e){

            project.boqs.push({

                fileName:
                    file.name,

                fileType:
                    file.type || "Unknown",

                fileData:
                    e.target.result,

                uploadedBy:
                    "Project Manager",

                date:
                    new Date()
                    .toISOString()
                    .split("T")[0],

                folderId:
                    currentFolderId

            });

            persist();

            showProjectSection(
                "boq",
                projectId
            );

        };

        reader.readAsDataURL(file);

    };

    input.click();

};

    /* =========================
   BOQ FOLDERS
========================= */

window.boqCurrentFolder = window.boqCurrentFolder || {};

function ensureBOQFolders(project){

    if(!project.boqFolders){

        project.boqFolders = [
            {
                id: "root",
                name: "BOQ",
                parentId: null,
                files: project.boqs || []
            }
        ];

        project.boqs = [];

        persist();
    }

    if(!project.boqFolders.find(f => f.id === "root")){

        project.boqFolders.unshift({
            id: "root",
            name: "BOQ",
            parentId: null,
            files: []
        });

        persist();
    }

    return project.boqFolders;
}


/* CREATE FOLDER */

window.createBOQFolder = function(projectId,parentId = null){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project) return;

    ensureBOQFolders(project);

    const folderName = prompt(
        "Enter folder name:"
    );

    if(!folderName) return;

    const cleanName = folderName.trim();

    if(!cleanName) return;

    const exists = project.boqFolders.some(
        folder =>
            folder.parentId === parentId &&
            folder.name.toLowerCase() === cleanName.toLowerCase()
    );

    if(exists){

        alert("A folder with this name already exists.");

        return;
    }

    project.boqFolders.push({

        id:
            "boq-folder-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name: cleanName,

        parentId: parentId,

        files: []

    });

    persist();

    boqCurrentFolder[projectId] = parentId;

    showProjectSection(
        "boq",
        projectId
    );

};

/* =========================
   DELETE BOQ FOLDER
========================= */

window.deleteBOQFolder = function(projectId, folderId){

    const project = projects.find(
        p => String(p.id) === String(projectId)
    );

    if(!project) return;

    ensureBOQFolders(project);

    /* NEVER DELETE ROOT */
    if(folderId === "root" || folderId === null){
        alert("The main BOQ folder cannot be deleted.");
        return;
    }

    const folder = project.boqFolders.find(
        f => String(f.id) === String(folderId)
    );

    if(!folder){
        console.error(
            "BOQ FOLDER NOT FOUND:",
            folderId
        );
        return;
    }

    /* CONFIRM */
    const confirmed = confirm(
        `Delete folder "${folder.name}"?\n\n` +
        `All subfolders and BOQ files inside this folder will also be deleted.`
    );

    if(!confirmed) return;

    /* FIND ALL FOLDERS TO DELETE */
    const foldersToDelete = new Set([
        String(folderId)
    ]);

    let changed = true;

    while(changed){

        changed = false;

        project.boqFolders.forEach(f => {

            if(
                f.parentId !== null &&
                foldersToDelete.has(String(f.parentId)) &&
                !foldersToDelete.has(String(f.id))
            ){

                foldersToDelete.add(String(f.id));

                changed = true;
            }

        });

    }

    /* DELETE BOQ FILES INSIDE THESE FOLDERS */

    if(project.boqs){

        project.boqs = project.boqs.filter(
            boq =>
                !foldersToDelete.has(
                    String(boq.folderId)
                )
        );

    }

    /* DELETE FOLDERS */

    project.boqFolders =
        project.boqFolders.filter(
            f =>
                !foldersToDelete.has(
                    String(f.id)
                )
        );

    /* GO BACK TO PARENT FOLDER */

    window.boqCurrentFolder[projectId] =
        folder.parentId ?? null;

    persist();

    showProjectSection(
        "boq",
        projectId
    );

};

function ensureDocumentsFolders(project){

                name: "Documents",
                parentId: null,
                files: []
            }
        ];

        persist();

    if(
        !project.documentsFolders.find(
            folder =>

        )
    ){

        project.documentsFolders.unshift({

            id: "root",

            name: "Documents",

            parentId: null,

            files: []

        });

        persist();

    }


    return project.documentsFolders;

}

        );


    /* =========================

        documents

/* =====================================================
   CREATE DOCUMENT FOLDER
===================================================== */

window.createDocumentsFolder =
function(projectId, parentId = null){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        console.error(
            "DOCUMENT PROJECT NOT FOUND:",
            projectId
        );

        return;

    }


    ensureDocumentsFolders(project);


    const folderName =
        prompt(
            "Enter folder name:"
        );


    if(!folderName) return;


    const cleanName =
        folderName.trim();


    if(!cleanName) return;


    const exists =
        project.documentsFolders.some(
            folder =>

                String(
                    folder.parentId ?? null
                ) ===
                String(
                    parentId ?? null
                )

                &&

                String(
                    folder.name
                ).toLowerCase() ===
                cleanName.toLowerCase()
        );


    if(exists){

        alert(
            "A folder with this name already exists."
        );

        return;

    }


    const newFolder = {

        id:
            "documents-folder-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:
            cleanName,

        parentId:
            parentId,

        files: []

    };


    project.documentsFolders.push(
        newFolder
    );


    persist();


    window.documentsCurrentFolder[
        project.id
    ] =
        parentId;


    showProjectSection(
        "documents",
        project.id
    );

};


/* =====================================================
   OPEN DOCUMENT FOLDER
===================================================== */

window.openDocumentsFolder =
function(projectId, folderId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        console.error(
            "DOCUMENT PROJECT NOT FOUND:",
            projectId
        );

        return;

    }


    ensureDocumentsFolders(project);


    /* ROOT */

    if(
        folderId === null ||
        folderId === undefined
    ){

        window.documentsCurrentFolder[
            project.id
        ] = null;


        showProjectSection(
            "documents",
            project.id
        );


        return;

    }


    const folder =
        project.documentsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder){

        console.error(
            "DOCUMENT FOLDER NOT FOUND:",
            folderId
        );

        return;

    }


    window.documentsCurrentFolder[
        project.id
    ] =
        folder.id;


    showProjectSection(
        "documents",
        project.id
    );

};


/* =====================================================
   BACK TO PARENT FOLDER
===================================================== */

window.goBackDocumentsFolder =
function(projectId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureDocumentsFolders(project);


    const currentId =
        window.documentsCurrentFolder[
            project.id
        ] ?? null;


    if(currentId === null){

        return;

    }


    const currentFolder =
        project.documentsFolders.find(
            folder =>
                String(folder.id) ===
                String(currentId)
        );


    if(!currentFolder){

        window.documentsCurrentFolder[
            project.id
        ] = null;

    }else{

        window.documentsCurrentFolder[
            project.id
        ] =
            currentFolder.parentId ?? null;

    }


    showProjectSection(
        "documents",
        project.id
    );

};


/* =====================================================
   DELETE DOCUMENT FOLDER
===================================================== */

window.deleteDocumentsFolder =
function(projectId, folderId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureDocumentsFolders(project);


    if(
        String(folderId) === "root"
    ){

        alert(
            "The main Documents folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.documentsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder){

        console.error(
            "DOCUMENT FOLDER NOT FOUND:",
            folderId
        );

        return;

    }


    const confirmed =
        confirm(

            `Delete folder "${folder.name}"?\n\n` +

            `All subfolders and documents inside this folder will also be deleted.`

        );


    if(!confirmed) return;


    /* =========================
       FIND ALL DESCENDANTS
    ========================= */

    const foldersToDelete =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.documentsFolders.forEach(
            child => {

                if(

                    child.parentId !== null &&

                    foldersToDelete.has(
                        String(child.parentId)
                    ) &&

                    !foldersToDelete.has(
                        String(child.id)
                    )

                ){

                    foldersToDelete.add(
                        String(child.id)
                    );

                    changed = true;

                }

            }
        );

    }


    /* =========================
       DELETE DOCUMENTS
    ========================= */

    if(project.documents){

        project.documents =
            project.documents.filter(
                doc =>

                    !foldersToDelete.has(
                        String(
                            doc.folderId
                        )
                    )
            );

    }


    /* =========================
       DELETE FOLDERS
    ========================= */

    project.documentsFolders =
        project.documentsFolders.filter(
            folder =>

                !foldersToDelete.has(
                    String(folder.id)
                )
        );


    /* =========================
       GO TO PARENT
    ========================= */

    window.documentsCurrentFolder[
        project.id
    ] =
        folder.parentId ?? null;


    persist();


    showProjectSection(
        "documents",
        project.id
    );

};


/* =====================================================
   UPLOAD DOCUMENT
===================================================== */

window.uploadDocument =
function(projectId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        alert(
            "Project not found."
        );

        return;

    }


    ensureDocumentsFolders(project);


    const currentFolderId =
        window.documentsCurrentFolder[
            project.id
        ] ?? null;


    const input =
        document.createElement(
            "input"
        );


    input.type = "file";


    input.accept =
        ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.dwg,.zip";


    input.onchange =
    function(){

        const file =
            input.files[0];


        if(!file) return;


        const title =
            prompt(
                "Document Title:",
                file.name
            );


        if(title === null) return;


        const uploadedBy =
            prompt(
                "Uploaded By:",
                "Project Manager"
            );


        if(uploadedBy === null) return;


        const reader =
            new FileReader();


        reader.onload =
        function(e){

            if(!project.documents){

                project.documents = [];

            }


            project.documents.push({

                id:
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,8),

                title:
                    title || file.name,

                fileName:
                    file.name,

                fileType:
                    file.type ||
                    "Unknown",

                fileData:
                    e.target.result,

                uploadedBy:
                    uploadedBy ||
                    "Project Manager",

                date:
                    new Date()
                        .toISOString()
                        .split("T")[0],

                folderId:
                    currentFolderId

            });


            persist();


            showProjectSection(
                "documents",
                project.id
            );

        };


        reader.readAsDataURL(file);

    };


    input.click();

};


/* =====================================================
   VIEW DOCUMENT
===================================================== */

window.viewDocument =
function(projectId,index){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(
        !project ||
        !project.documents
    ){

        alert(
            "Project or documents not found."
        );

        return;

    }


    const doc =
        project.documents[index];


    if(
        !doc ||
        !doc.fileData
    ){

        alert(
            "No file is attached to this document."
        );

        return;

    }


    const parts =
        doc.fileData.split(",");


    if(parts.length < 2){

        alert(
            "Invalid file data."
        );

        return;

    }


    const mimeType =

        parts[0]
            .match(
                /data:(.*?);base64/
            )?.[1]

        ||

        doc.fileType

        ||

        "application/octet-stream";


    const byteCharacters =
        atob(parts[1]);


    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for(
        let i = 0;
        i < byteCharacters.length;
        i++
    ){

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);

    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    const blob =
        new Blob(
            [byteArray],
            {
                type: mimeType
            }
        );


    const blobURL =
        URL.createObjectURL(
            blob
        );


    window.open(
        blobURL,
        "_blank"
    );

};

window.downloadDocument =

                String(projectId)
        );


    if(
        !project ||
        !project.documents
    ){

        alert(
            "Project or documents not found."
        );

        return;

    }


    const doc =
        project.documents[index];


    if(
        !doc ||
        !doc.fileData
    ){

        alert(
            "No file is attached to this document."
        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        doc.fileData;


    link.download =
        doc.fileName ||
        "Document";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

};

window.deleteDocument =
function(projectId,index){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(
        !project ||
        !project.documents
    ){

        alert(
            "Project or documents not found."
        );

        return;

    const doc =
        project.documents[index];


    if(!doc) return;


    const confirmed =
        confirm(
            `Are you sure you want to delete "${doc.fileName}"?`
        );


    if(!confirmed) return;


    project.documents.splice(
        index,
        1
    );


    persist();


    showProjectSection(
        "documents",
        project.id
    );

};

function ensureDrawingsFolders(project){

    if(!project.drawingsFolders){

        project.drawingsFolders = [
            {
                id: "root",
                name: "Drawings",
                parentId: null,
                files: []
            }
        ];

    }


    if(
        !project.drawingsFolders.find(
            folder =>

        )
    ){

        project.drawingsFolders.unshift({

            id: "root",

            name: "Drawings",

            parentId: null,

            files: []

        });

        persist();

    }


    return project.drawingsFolders;

}

window.createDrawingsFolder =
function(projectId, parentId = null){

    const project =

    ensureDrawingsFolders(project);


    const folderName =
        prompt(

        folderName.trim();

        project.drawingsFolders.some(
            folder =>

                String(

                ) ===
                String(
                    parentId ?? null

                String(
                    folder.name
                ).toLowerCase() ===
                cleanName.toLowerCase()
        );

/* =====================================================
   DELETE DRAWING FOLDER
===================================================== */

window.deleteDrawingsFolder =
function(projectId, folderId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureDrawingsFolders(project);


    if(
        String(folderId) === "root"
    ){

        alert(
            "The main Drawings folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.drawingsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder) return;


    const confirmed =
        confirm(

            `Delete folder "${folder.name}"?\n\n` +

            `All subfolders and drawings inside this folder will also be deleted.`

        );


    if(!confirmed) return;


    const foldersToDelete =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.drawingsFolders.forEach(
            child => {

                if(

                    child.parentId !== null &&

                    foldersToDelete.has(
                        String(child.parentId)
                    ) &&

                    !foldersToDelete.has(
                        String(child.id)
                    )

                ){

                    foldersToDelete.add(
                        String(child.id)
                    );

                    changed = true;

                }

            }
        );

    }


    if(project.drawings){

        project.drawings =
            project.drawings.filter(
                drawing =>

                    !foldersToDelete.has(
                        String(
                            drawing.folderId
                        )
                    )
            );

    }


    project.drawingsFolders =
        project.drawingsFolders.filter(
            folder =>

                !foldersToDelete.has(
                    String(folder.id)
                )
        );


    window.drawingsCurrentFolder[
        project.id
    ] =
        folder.parentId ?? null;


    persist();


    showProjectSection(
        "drawings",
        project.id
    );

};

window.uploadDrawing =

        window.drawingsCurrentFolder[

window.viewDrawing =
function(projectId,index){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(
        !project ||
        !project.drawings
    ){

        alert(
            "Project or drawings not found."
        );

        return;

    }


    const drawing =
        project.drawings[index];


    if(
        !drawing ||
        !drawing.fileData
    ){

        alert(
            "No file is attached to this drawing."
        );

        return;

    }


    const parts =
        drawing.fileData.split(",");


    if(parts.length < 2){

        alert(
            "Invalid file data."
        );

        return;

    }


    const mimeType =
        parts[0]
            .match(
                /data:(.*?);base64/
            )?.[1]

        ||

        drawing.fileType

        ||

        "application/octet-stream";


    const byteCharacters =
        atob(parts[1]);


    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for(
        let i = 0;
        i < byteCharacters.length;
        i++
    ){

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);

    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    const blob =
        new Blob(
            [byteArray],
            {
                type: mimeType
            }
        );


    const blobURL =
        URL.createObjectURL(
            blob
        );


    window.open(
        blobURL,
        "_blank"
    );

};

/* =====================================================
   WEEKLY REPORT ESCAPE
===================================================== */

function weeklyReportEscape(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   WEEKLY REPORT DATE FORMAT
===================================================== */

function weeklyReportDate(value){

    if(!value){
        return "-";
    }

    const parts =
        String(value).split("-");

    if(parts.length !== 3){
        return value;
    }

    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* =====================================================
   GET SATURDAY OF WEEK
===================================================== */

function getWeeklyReportSaturday(dateValue){

    const date =
        new Date(
            dateValue + "T00:00:00"
        );

    const day =
        date.getDay();

    /*
       JavaScript:
       Sunday = 0
       Monday = 1
       ...
       Saturday = 6
    */

    const difference =
        day === 6
            ? 0
            : day + 1;

    date.setDate(
        date.getDate() - difference
    );

    return weeklyReportDateISO(date);

}


/* =====================================================
   GET FRIDAY OF WEEK
===================================================== */

function getWeeklyReportFriday(dateValue){

    const saturday =
        new Date(
            dateValue + "T00:00:00"
        );

    saturday.setDate(
        saturday.getDate() + 6
    );

    return weeklyReportDateISO(
        saturday
    );

}


/* =====================================================
   DATE TO ISO
===================================================== */

function weeklyReportDateISO(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =====================================================
   NEXT WEEK NUMBER
===================================================== */

function getNextWeeklyReportNumber(project){

    const reports =
        project.weeklyReports || [];

    if(!reports.length){

        return 1;

    }

    const numbers =
        reports
            .map(report =>
                Number(
                    report.weekNumber || 0
                )
            )
            .filter(number =>
                Number.isFinite(number)
            );

    if(!numbers.length){

        return 1;

    }

    return Math.max(...numbers) + 1;

}

/* =====================================================
   CALCULATE OVERALL WEATHER
===================================================== */

function updateWeeklyOverallWeather(){

    const days = [
        "Saturday",
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday"
    ];

    const weatherCounts = {};
    const weatherOrder = [];

    days.forEach(day => {

        const input =
            document.getElementById(
                "weeklyWeather_" + day
            );

        if(!input || !input.value){
            return;
        }

        const weather =
            input.value;

        if(!weatherCounts[weather]){

            weatherCounts[weather] = 0;

            weatherOrder.push(
                weather
            );
        }

        weatherCounts[weather]++;
    });


    let overallWeather = "";

    let highestCount = 0;


    weatherOrder.forEach(weather => {

        if(
            weatherCounts[weather] >
            highestCount
        ){

            highestCount =
                weatherCounts[weather];

            overallWeather =
                weather;
        }

    });


    const overallInput =
        document.getElementById(
            "weeklyReportOverallWeather"
        );

    if(overallInput){

        overallInput.value =
            overallWeather;

    }

}

/* =====================================================
   WEATHER DAYS
===================================================== */

function getWeeklyWeatherDays(startDate){

    const saturday =
        new Date(
            startDate + "T00:00:00"
        );

    const days = [

        {
            name:"Saturday",
            offset:0
        },

        {
            name:"Sunday",
            offset:1
        },

        {
            name:"Monday",
            offset:2
        },

        {
            name:"Tuesday",
            offset:3
        },

        {
            name:"Wednesday",
            offset:4
        },

        {
            name:"Thursday",
            offset:5
        },

        {
            name:"Friday",
            offset:6
        }

    ];

    return days.map(day => {

        const date =
            new Date(saturday);

        date.setDate(
            saturday.getDate() +
            day.offset
        );

        return {

            name:day.name,

            date:
                weeklyReportDateISO(
                    date
                )

        };

    });

}

/* =====================================================
   CREATE WEEKLY REPORT
===================================================== */
window.createWeeklyReport =
function(projectId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project){

        return;

    }


    const reports =
        ensureWeeklyReports(project);


    const weekNumber =
        getNextWeeklyReportNumber(
            project
        );


    const today =
        weeklyReportDateISO(
            new Date()
        );


    const saturday =
        getWeeklyReportSaturday(
            today
        );


    const friday =
        getWeeklyReportFriday(
            saturday
        );


    /*
       GET PREVIOUS WEEK REPORT
    */

    const previousReport =
        reports
            .filter(
                report =>
                    Number(
                        report.weekNumber || 0
                    ) < weekNumber
            )
            .sort(
                (a,b) =>
                    Number(
                        b.weekNumber || 0
                    ) -
                    Number(
                        a.weekNumber || 0
                    )
            )[0];


    /*
       CARRY FORWARD MATERIAL BALANCES
    */

    const previousMaterials =
        previousReport &&
        Array.isArray(
            previousReport.materials
        )
        ?
        previousReport.materials.map(
            material => ({

                name:
                    material.name || "",

                unit:
                    material.unit || "",

                availableFromPreviousWeek:
                    Number(
                        material.balance || 0
                    ),

                planned:"",

                delivered:"",

                used:"",

                balance:
                    Number(
                        material.balance || 0
                    ),

                remarks:""

            })
        )
        :
        [];


    openWeeklyReportForm(
        project,
        null,
        {

            weekNumber,

            reportDate:today,

            startDate:saturday,

            endDate:friday,

            projectManager:
                project.manager || "",

            projectStartDate:
                project.startDate || "",

            rainStoppageHours:0,

            overallWeather:"",

            weather:{},

            materials:
                previousMaterials

        }
    );

};
/* =====================================================
   EDIT WEEKLY REPORT
===================================================== */

window.editWeeklyReport =
function(
    projectId,
    index
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project){

        return;

    }


    ensureWeeklyReports(project);


    const report =
        project.weeklyReports[index];


    if(!report){

        return;

    }


    openWeeklyReportForm(
        project,
        index,
        report
    );

};

window.saveWeeklyReport =
function(
    event,
    projectId,
    editIndex

    event.preventDefault();


    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        return;

    }


    ensureWeeklyReports(project);


    const weekNumber =
        Number(
            document.getElementById(
                "weeklyReportWeekNumber"
            ).value || 0
        );


    const reportDate =
        document.getElementById(
            "weeklyReportDate"

    const startDate =
        document.getElementById(

        ).value;


    const endDate =
        document.getElementById(
            "weeklyReportEndDate"
        ).value;


    if(!weekNumber){

        alert(

        );

        return;

    }


    if(!startDate || !endDate){

        alert(
            "Please enter the reporting period."
        );

        return;

    }


    /*

    */

    const duplicate =
        project.weeklyReports.some(
            (item,index) =>

                weekNumber &&
                index !== editIndex

        "Thursday",
        "Friday"

            document.getElementById(

            input
                ? input.value
                : "";

   const workProgress = [];

[

    const location =

            "weeklyWorkLocation_" + i

    const progress =
        document.getElementById(
            "weeklyWorkProgress_" + i
        )?.value || "";

    const remarks =
        document.getElementById(
            "weeklyWorkRemarks_" + i
        )?.value.trim() || "";


    if(
        activity ||
        location ||
        progress !== "" ||
        remarks
    ){

        workProgress.push({

            activity,

            location,

            progress:
                progress === ""
                ? ""
                : Number(progress),

            remarks

        });

    }

});

window.deleteWeeklyReport =
function(
    projectId,
    index
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        return;

    }


    ensureWeeklyReports(project);


    const report =
        project.weeklyReports[index];


    if(!report){

        return;

    }


    const confirmed =
        confirm(
            `Are you sure you want to delete Week ${report.weekNumber}?`
        );


    if(!confirmed){

        return;

    }


    project.weeklyReports.splice(
        index,
        1
    );


    persist();


    renderWeeklyReportsSection(
        project
    );

};

window.createReportsFolder =
function(projectId, parentId = null){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureReportsFolders(project);


    const folderName =
        prompt(
            "Enter folder name:"
        );


    if(!folderName) return;


    const cleanName =
        folderName.trim();


    if(!cleanName) return;


    const exists =
        project.reportsFolders.some(
            folder =>

                String(
                    folder.parentId ?? null
                ) ===
                String(
                    parentId ?? null
                )

                &&

                String(
                    folder.name
                ).toLowerCase() ===
                cleanName.toLowerCase()
        );


    if(exists){

        alert(
            "A folder with this name already exists."
        );

        return;

    }


    project.reportsFolders.push({

        id:
            "reports-folder-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:
            cleanName,

        parentId:
            parentId,

        files: []

    });


    persist();


    window.reportsCurrentFolder[
        project.id
    ] =
        parentId;


    showProjectSection(
        "reports",
        project.id
    );

};

/* =====================================================
   DELETE REPORT FOLDER
===================================================== */

window.deleteReportsFolder =
function(projectId, folderId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureReportsFolders(project);


    if(
        String(folderId) === "root"
    ){

        alert(
            "The main Reports folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.reportsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder) return;


    const confirmed =
        confirm(

            `Delete folder "${folder.name}"?\n\n` +

            `All subfolders and reports inside this folder will also be deleted.`

        );


    if(!confirmed) return;


    const foldersToDelete =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.reportsFolders.forEach(
            child => {

                if(

                    child.parentId !== null &&

                    foldersToDelete.has(
                        String(child.parentId)
                    ) &&

                    !foldersToDelete.has(
                        String(child.id)
                    )

                ){

                    foldersToDelete.add(
                        String(child.id)
                    );

                    changed = true;

                }

            }
        );

    }


    if(project.reports){

        project.reports =
            project.reports.filter(
                report =>

                    !foldersToDelete.has(
                        String(
                            report.folderId
                        )
                    )
            );

    }


    project.reportsFolders =
        project.reportsFolders.filter(
            folder =>

                !foldersToDelete.has(
                    String(folder.id)
                )
        );


    window.reportsCurrentFolder[
        project.id
    ] =
        folder.parentId ?? null;


    persist();


    showProjectSection(
        "reports",
        project.id
    );

};

window.uploadReport =
function(projectId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        alert(
            "Project not found."
        );

        return;

    }


    ensureReportsFolders(project);


    const currentFolderId =
        window.reportsCurrentFolder[
            project.id
        ] ?? null;


    const input =
        document.createElement(
            "input"
        );


    input.type = "file";


    input.accept =
        ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.zip";


    input.onchange =
    function(){

        const file =
            input.files[0];


        if(!file) return;


        const title =
            prompt(
                "Report Title:",
                file.name
            );


        if(title === null) return;


        const uploadedBy =
            prompt(
                "Uploaded By:",
                "Project Manager"
            );


        if(uploadedBy === null) return;


        const reader =
            new FileReader();


        reader.onload =
        function(e){

            if(!project.reports){

                project.reports = [];

            }


            project.reports.push({

                id:
                    "report-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,8),

                title:
                    title || file.name,

                fileName:
                    file.name,

                fileType:
                    file.type ||
                    "Unknown",

                fileData:
                    e.target.result,

                uploadedBy:
                    uploadedBy ||
                    "Project Manager",

                date:
                    new Date()
                        .toISOString()
                        .split("T")[0],

                folderId:
                    currentFolderId

            });


            persist();


            showProjectSection(
                "reports",
                project.id
            );

        };


        reader.readAsDataURL(file);

    };


    input.click();

};


/* =====================================================
   VIEW REPORT
===================================================== */

window.viewReport =
function(projectId,index){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(
        !project ||
        !project.reports
    ){

        alert(
            "Project or reports not found."
        );

        return;

    }


    const report =
        project.reports[index];


    if(
        !report ||
        !report.fileData
    ){

        alert(
            "No file is attached to this report."
        );

        return;

    }


    const parts =
        report.fileData.split(",");


    if(parts.length < 2){

        alert(
            "Invalid file data."
        );

        return;

    }


    const mimeType =
        parts[0]
            .match(
                /data:(.*?);base64/
            )?.[1]

        ||

        report.fileType

        ||

        "application/octet-stream";


    const byteCharacters =
        atob(parts[1]);


    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for(
        let i = 0;
        i < byteCharacters.length;
        i++
    ){

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);

    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    const blob =
        new Blob(
            [byteArray],
            {
                type: mimeType
            }
        );


    const blobURL =
        URL.createObjectURL(
            blob
        );


    window.open(
        blobURL,
        "_blank"
    );

};

    }


    if(priority === "Medium"){

        cls =
            "badge-active";

    }


    if(priority === "High"){

        cls =

    if(priority === "Critical"){

    }


    return `

                priority || "Medium"

}

/* =====================================================
   MONEY HELPERS
===================================================== */

function parsePaymentMoney(value){
    if(value === null || value === undefined || value === ""){
        return 0;
    }

    const cleaned = String(value)
        .replace(/,/g, "")
        .replace(/[^\d.-]/g, "");

    return Number(cleaned) || 0;
}


function formatPaymentMoney(value){
    return Number(value || 0).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function getPaymentContractValue(project){
    return parsePaymentMoney(
        project.contractValue ||
        project.contractAmount ||
        project.value ||
        0
    );
}


/* =====================================================
   PAYMENT STATUS
===================================================== */

function getPaymentStatus(payment){

    const invoice = parsePaymentMoney(payment.invoiceValue);
    const received = parsePaymentMoney(payment.paymentReceived);

    if(received > invoice && invoice > 0){
        return "Overpaid";
    }

    if(invoice > 0 && received >= invoice){
        return "Fully Paid";
    }

    if(received > 0 && received < invoice){
        return "Partially Paid";
    }

    return "Not Paid";
}


function getPaymentStatusColor(status){

    if(status === "Fully Paid"){
        return "#198754";
    }

    if(status === "Partially Paid"){
        return "#d39e00";
    }

    if(status === "Overpaid"){
        return "#dc3545";
    }

    return "#6c757d";
}

/* =====================================================
   UPDATE NORMAL FIELD
===================================================== */

window.updatePaymentField = function(
    projectId,
    index,
    field,
    value
){

    const project = getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }

    project.payments[index][field] = value;

    persist();
};


/* =====================================================
   UPDATE MONEY FIELD - LIVE
===================================================== */

window.updatePaymentAmount = function(
    projectId,
    index,
    field,
    value
){

    const project = getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }

    project.payments[index][field] =
        parsePaymentMoney(value);

    persist();

    /*
       IMPORTANT:
       We DO NOT call renderPaymentsSection() here.
       Only the affected row + summary are updated.
    */

    updatePaymentRowCalculations(
        projectId,
        index
    );

    updatePaymentSummary(project);

};


/* =====================================================
   UPDATE ROW CALCULATIONS
===================================================== */

function updatePaymentRowCalculations(
    projectId,
    index
){

    const project =
        getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }

    const payment =
        project.payments[index];

    const invoice =
        parsePaymentMoney(payment.invoiceValue);

    const received =
        parsePaymentMoney(payment.paymentReceived);

    const balance =
        invoice - received;

    const status =
        getPaymentStatus(payment);


    const balanceCell =
        document.getElementById(
            `payment-balance-${index}`
        );

    if(balanceCell){

        balanceCell.textContent =
            formatPaymentMoney(balance);

        balanceCell.style.color =
            balance < 0
            ? "#dc3545"
            : "#333";
    }


    const statusCell =
        document.getElementById(
            `payment-status-${index}`
        );

    if(statusCell){

        statusCell.innerHTML =
            paymentStatusBadge(status);
    }

}


/* =====================================================
   UPDATE SUMMARY - LIVE
===================================================== */

function updatePaymentSummary(project){

    if(!project){
        return;
    }

    let totalInvoiced = 0;
    let totalReceived = 0;

    (project.payments || []).forEach(payment => {

        totalInvoiced +=
            parsePaymentMoney(
                payment.invoiceValue
            );

        totalReceived +=
            parsePaymentMoney(
                payment.paymentReceived
            );

    });


    const contractValue =
        getPaymentContractValue(project);

    const outstanding =
        totalInvoiced - totalReceived;

    const invoicedPercent =
        contractValue > 0
        ? (totalInvoiced / contractValue) * 100
        : 0;

    const paidPercent =
        contractValue > 0
        ? (totalReceived / contractValue) * 100
        : 0;


    const totalInvoiceElement =
        document.getElementById(
            "payments-total-invoice"
        );

    if(totalInvoiceElement){

        totalInvoiceElement.textContent =
            formatPaymentMoney(totalInvoiced);

    }


    const totalReceivedElement =
        document.getElementById(
            "payments-total-received"
        );

    if(totalReceivedElement){

        totalReceivedElement.textContent =
            formatPaymentMoney(totalReceived);

    }


    const totalBalanceElement =
        document.getElementById(
            "payments-total-balance"
        );

    if(totalBalanceElement){

        totalBalanceElement.textContent =
            formatPaymentMoney(outstanding);

        totalBalanceElement.style.color =
            outstanding < 0
            ? "#dc3545"
            : "#333";
    }


    const invoicedPercentElement =
        document.getElementById(
            "payments-invoiced-percent"
        );

    if(invoicedPercentElement){

        invoicedPercentElement.textContent =
            `${invoicedPercent.toFixed(2)}% of Contract`;

    }


    const paidPercentElement =
        document.getElementById(
            "payments-paid-percent"
        );

    if(paidPercentElement){

        paidPercentElement.textContent =
            `${paidPercent.toFixed(2)}% of Contract`;

    }


    const contractPaidElement =
        document.getElementById(
            "payments-contract-paid"
        );

    if(contractPaidElement){

        contractPaidElement.textContent =
            `${paidPercent.toFixed(2)}%`;

    }

}

/* =====================================================
   UPLOAD INVOICE PDF
===================================================== */

window.uploadPaymentInvoice = function(
    projectId,
    index,
    input
){

    const project =
        getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }

    const file =
        input.files && input.files[0];

    if(!file){
        return;
    }


    if(
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ){

        alert("Please select a PDF file.");

        input.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(e){

        project.payments[index].fileName =
            file.name;

        project.payments[index].fileType =
            file.type || "application/pdf";

        project.payments[index].fileData =
            e.target.result;

        persist();


        const cell =
            document.getElementById(
                `payment-invoice-file-${index}`
            );


        if(cell){

            cell.innerHTML = `

                <div style="
                    display:flex;
                    flex-direction:column;
                    gap:4px;
                    align-items:center;
                ">

                    <span style="
                        font-size:11px;
                        max-width:130px;
                        overflow:hidden;
                        text-overflow:ellipsis;
                        white-space:nowrap;

                            onclick="viewPaymentInvoice(${project.id},${index})"

/* =====================================================
   VIEW INVOICE
===================================================== */

window.viewPaymentInvoice = function(
    projectId,
    index
){

    const project =
        getPaymentsProject(projectId);

    if(
        !project ||
        !project.payments ||
        !project.payments[index]
    ){
        return;
    }

    const payment =
        project.payments[index];

    const fileData =
        payment.fileData ||
        payment.invoiceFileData;

    if(!fileData){

        alert("No Invoice PDF is attached.");

        return;
    }


    try{

        const base64 =
            fileData.split(",")[1];

        if(!base64){

            alert("Invalid Invoice PDF data.");

            return;
        }


        const byteCharacters =
            atob(base64);

        const byteNumbers =
            new Array(
                byteCharacters.length
            );

        for(
            let i = 0;
            i < byteCharacters.length;
            i++
        ){

            byteNumbers[i] =
                byteCharacters.charCodeAt(i);

        }


        const byteArray =
            new Uint8Array(
                byteNumbers
            );


        const blob =
            new Blob(
                [byteArray],
                {
                    type:"application/pdf"
                }
            );


        const url =
            URL.createObjectURL(blob);


        window.open(
            url,
            "_blank"
        );


    }catch(error){

        console.error(
            "Invoice PDF error:",
            error
        );

        alert(
            "Unable to open the Invoice PDF."
        );

    }

};
/* =====================================================
   DOWNLOAD INVOICE
===================================================== */

window.downloadPaymentInvoice = function(
    projectId,
    index
){

    const project =
        getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }

    const payment =
        project.payments[index];

    if(!payment.fileData){

        alert("No invoice PDF attached.");

        return;
    }


    const link =
        document.createElement("a");

    link.href =
        payment.fileData;

    link.download =
        payment.fileName ||
        `Payment-Invoice-${index + 1}.pdf`;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

};


/* =====================================================
   DELETE PAYMENT
===================================================== */

window.deletePayment = function(
    projectId,
    index
){

    const project =
        getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }


    const payment =
        project.payments[index];


    const confirmed =
        confirm(
            `Delete Payment ${
                payment.paymentNumber ||
                index + 1
            }?`
        );


    if(!confirmed){
        return;
    }


    project.payments.splice(index,1);

    persist();

    renderPaymentsSection(project);

};


/* =====================================================
   EXCEL EXPORT
===================================================== */

window.downloadPaymentsExcel = function(
    projectId
){

    const project =
        getPaymentsProject(projectId);

    if(!project){
        return;
    }


    if(
        typeof XLSX === "undefined"
    ){

        alert(
            "Excel library is not loaded."
        );

        return;
    }


    const rows =
        (project.payments || []).map(payment => ({

            "Payment Number":
                payment.paymentNumber || "",

            "Payment Type":
                payment.paymentType || "",

            "Contractor":
                payment.contractor || "",

            "Invoice Value":
                parsePaymentMoney(
                    payment.invoiceValue
                ),

            "Payment Received":
                parsePaymentMoney(
                    payment.paymentReceived
                ),

            "Balance":
                parsePaymentMoney(
                    payment.invoiceValue
                ) -
                parsePaymentMoney(
                    payment.paymentReceived
                ),

            "Date of Payment Received":
                payment.paymentDate || "",

            "Invoice PDF":
                payment.fileName || ""

        }));


    const worksheet =
        XLSX.utils.json_to_sheet(rows);


    worksheet["!cols"] = [

        {wch:18},
        {wch:22},
        {wch:30},
        {wch:18},
        {wch:20},
        {wch:18},
        {wch:28},
        {wch:35}

    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Payments"
    );


    const projectName =
        project.name ||
        project.projectName ||
        "Project";


    XLSX.writeFile(
        workbook,
        `${projectName}-Payments.xlsx`
    );

};
