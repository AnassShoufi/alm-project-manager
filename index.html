                        `

                        :

                        `
                        <div class="manpower-trend">

                            <svg
                                viewBox="0 0 400 210"
                                preserveAspectRatio="none"
                            >

                                <line
                                    x1="20"
                                    y1="180"
                                    x2="380"
                                    y2="180"
                                    stroke="#dfe5ec"
                                />

                                <line
                                    x1="20"
                                    y1="35"
                                    x2="20"
                                    y2="180"
                                    stroke="#dfe5ec"
                                />

                                <polyline
                                    points="${polyline}"
                                    fill="none"
                                    stroke="#1976b8"
                                    stroke-width="3"
                                />

                                ${
                                    trendPoints
                                        .map(
                                            point => `
                                                <circle
                                                    cx="${point.x}"
                                                    cy="${point.y}"
                                                    r="4"
                                                    fill="#1976b8"
                                                >
                                                    <title>
                                                        ${point.date}:
                                                        ${point.total}
                                                    </title>
                                                </circle>
                                            `
                                        )
                                        .join("")
                                }

                            </svg>

                        </div>
                        `

                    }

                </div>


                <div class="manpower-chart">

                    <h3>
                        Manpower by Work Stage
                    </h3>

                    <p>
                        Workforce deployment
                    </p>

                    ${
                        stageEntries.length === 0

                        ?

                        `
                        <div class="manpower-empty">
                            No data available.
                        </div>
                        `

                        :

                        stageEntries
                            .map(
                                item => `

                                    <div class="manpower-bar-row">

                                        <div class="manpower-bar-label">
                                            ${escapeHTML(item[0])}
                                        </div>

                                        <div class="manpower-bar-track">

                                            <div
                                                class="manpower-bar-fill"
                                                style="
                                                    width:${
                                                        (
                                                            item[1] /
                                                            maxStage
                                                        ) * 100
                                                    }%;
                                                "
                                            ></div>

                                        </div>

                                        <div class="manpower-bar-value">
                                            ${item[1]}
                                        </div>

                                    </div>

                                `
                            )
                            .join("")

                    }

                </div>


                <div class="manpower-chart">

                    <h3>
                        Manpower by Trade
                    </h3>

                    <p>
                        Workforce composition
                    </p>

                    ${
                        tradeEntries.length === 0

                        ?

                        `
                        <div class="manpower-empty">
                            No data available.
                        </div>
                        `

                        :

                        tradeEntries
                            .map(
                                item => `

                                    <div class="manpower-bar-row">

                                        <div class="manpower-bar-label">
                                            ${escapeHTML(item[0])}
                                        </div>

                                        <div class="manpower-bar-track">

                                            <div
                                                class="manpower-bar-fill"
                                                style="
                                                    width:${
                                                        (
                                                            item[1] /
                                                            maxTrade
                                                        ) * 100
                                                    }%;
                                                "
                                            ></div>

                                        </div>

                                        <div class="manpower-bar-value">
                                            ${item[1]}
                                        </div>

                                    </div>

                                `
                            )
                            .join("")

                    }

                </div>


                <div class="manpower-chart">

                    <h3>
                        Direct vs Subcontractor
                    </h3>

                    <p>
                        Current workforce composition
                    </p>


                    <div style="
                        display:grid;
                        grid-template-columns:1fr 1fr;
                        gap:15px;
                        margin-top:25px;
                    ">


                        <div style="
                            text-align:center;
                            padding:25px 10px;
                            background:#e8f3fb;
                            border-radius:10px;
                        ">

                            <div style="
                                font-size:32px;
                                font-weight:bold;
                                color:#176394;
                            ">
                                ${currentDirect}
                            </div>

                            <div style="
                                margin-top:5px;
                                font-size:12px;
                                color:#176394;
                            ">
                                Direct
                            </div>

                        </div>


                        <div style="
                            text-align:center;
                            padding:25px 10px;
                            background:#fef3c7;
                            border-radius:10px;
                        ">

                            <div style="
                                font-size:32px;
                                font-weight:bold;
                                color:#946200;
                            ">
                                ${currentSub}
                            </div>

                            <div style="
                                margin-top:5px;
                                font-size:12px;
                                color:#946200;
                            ">
                                Subcontractor
                            </div>

                        </div>


                    </div>

                </div>


            </div>


            <!-- REGISTER -->

            <div class="panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            Manpower Register
                        </h2>

                        <p style="
                            color:#708096;
                            margin-top:5px;
                            font-size:13px;
                        ">
                            ${filteredRecords.length}
                            record(s) shown
                        </p>

                    </div>

                </div>


                ${
                    filteredRecords.length === 0

                    ?

                    `
                    <div class="manpower-empty">

                        <div class="manpower-empty-icon">
                            👷
                        </div>

                        <h3>
                            No records found
                        </h3>

                        <p style="margin-top:8px;">
                            Try changing the filters
                            or add a new manpower record.
                        </p>

                    </div>
                    `

                    :

                    `
                    <div class="manpower-table-wrap">

                        <table class="manpower-table">

                            <thead>

                                <tr>

                                    <th>Date</th>
                                    <th>Work Stage</th>
                                    <th>Type</th>
                                    <th>Trade</th>
                                    <th>Company / Subcontractor</th>
                                    <th>Count</th>
                                    <th>Total</th>
                                    <th>Remarks</th>
                                    <th>Action</th>

                                </tr>

                            </thead>

                            <tbody>

                                ${recordRows}

                            </tbody>

                        </table>

                    </div>
                    `
                }

            </div>


        </div>

    `;

}
/* =====================================================
   ADD MANPOWER RECORD
===================================================== */
/* =====================================================
   MANPOWER FILTERS
===================================================== */

window.setManpowerFilter = function(
    projectId,
    field,
    value
){

    manpowerFilters[field] =
        value;

    const project =
        getManpowerProject(projectId);

    if(!project){
        return;
    }

    renderManpowerSection(project);

};


window.resetManpowerFilters = function(
    projectId
){

    manpowerFilters = {

        dateFrom: "",
        dateTo: "",
        workStage: "All",
        type: "All",
        trade: "All"

    };

    const project =
        getManpowerProject(projectId);

    if(!project){
        return;
    }

    renderManpowerSection(project);

};
window.addManpowerRecord = function(projectId){

    const project =
        getManpowerProject(projectId);

    if(!project){
        return;
    }

    ensureManpowerData(project);

    project.manpowerRecords.push({

        id:
            "manpower-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        date:
            manpowerToday(),

        workStage:
            "Other",

        type:
            "Direct",

        trade:
            "Skilled Workers",

        company:
            "ALM",

        count:
            0,

        remarks:
            ""

    });

    persist();

    renderManpowerSection(project);

};


/* =====================================================
   UPDATE MANPOWER FIELD
===================================================== */

window.updateManpowerField = function(
    projectId,
    index,
    field,
    value
){

    const project =
        getManpowerProject(projectId);

    if(
        !project ||
        !project.manpowerRecords ||
        !project.manpowerRecords[index]
    ){
        return;
    }

    project.manpowerRecords[index][field] =
        value;

    if(field === "type"){

        if(value === "Direct"){

            if(
                !project.manpowerRecords[index].company ||
                project.manpowerRecords[index].company === ""
            ){

                project.manpowerRecords[index].company =
                    "ALM";

            }

        }

    }

    persist();

    renderManpowerSection(project);

};


/* =====================================================
   UPDATE MANPOWER NUMBER
===================================================== */

window.updateManpowerNumber = function(
    projectId,
    index,
    value
){

    const project =
        getManpowerProject(projectId);

    if(
        !project ||
        !project.manpowerRecords ||
        !project.manpowerRecords[index]
    ){
        return;
    }

    project.manpowerRecords[index].count =
        manpowerNumber(value);

    persist();

    renderManpowerSection(project);

};


/* =====================================================
   DELETE MANPOWER RECORD
===================================================== */

window.deleteManpowerRecord = function(
    projectId,
    index
){

    const project =
        getManpowerProject(projectId);

    if(
        !project ||
        !project.manpowerRecords ||
        !project.manpowerRecords[index]
    ){
        return;
    }

    const record =
        project.manpowerRecords[index];

    const confirmed =
        confirm(
            `Delete manpower record for ${
                record.date || "this date"
            }?`
        );

    if(!confirmed){
        return;
    }

    project.manpowerRecords.splice(
        index,
        1
    );

    persist();

    renderManpowerSection(project);

};


/* =====================================================
   MANPOWER EXCEL EXPORT
===================================================== */

window.downloadManpowerExcel = function(
    projectId
){

    const project =
        getManpowerProject(projectId);

    if(!project){
        return;
    }

    if(
        typeof XLSX === "undefined"
    ){

        alert(
            "Excel library is not loaded."
        );

        return;

    }

    const rows =
        (project.manpowerRecords || [])
            .map(record => ({

                "Date":
                    record.date || "",

                "Work Stage":
                    record.workStage || "",

                "Type":
                    record.type || "",

                "Trade":
                    record.trade || "",

                "Company / Subcontractor":
                    record.company || "",

                "Manpower":
                    manpowerNumber(
                        record.count
                    ),

                "Remarks":
                    record.remarks || ""

            }));

    const worksheet =
        XLSX.utils.json_to_sheet(rows);

    worksheet["!cols"] = [

        {wch:15},
        {wch:25},
        {wch:18},
        {wch:25},
        {wch:30},
        {wch:12},
        {wch:40}

    ];

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Manpower"
    );

    XLSX.writeFile(
        workbook,
        `${
            project.name ||
            "Project"
        }-Manpower.xlsx`
    );

};
</script>
