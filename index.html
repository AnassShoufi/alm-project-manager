<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALM Project Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}

body{
    background:#f4f6f8;
    color:#172033;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:255px;
    background:#17243a;
    color:white;
    padding:25px 16px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:35px;
}
  .logo img{
    width:64px;
    height:64px;
    object-fit:contain;
    background:#ffffff;
    border-radius:10px;
    padding:4px;
    box-sizing:border-box;
    flex-shrink:0;
}

.logo-box{
    background:#f5a400;
    color:white;
    width:40px;
    height:40px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu button{
    border:0;
    background:transparent;
    color:#e7edf7;
    padding:13px 12px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#2b405f;
}

/* MAIN */
.main{
    margin-left:255px;
    width:calc(100% - 255px);
}

.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid #e1e5ea;
    display:flex;
    align-items:center;
    padding:0 32px;
}

.search{
    width:430px;
    padding:13px 16px;
    border:1px solid #d5dbe3;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.content{
    padding:30px 34px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#708096;
}

/* BUTTONS */
.btn{
    border:0;
    padding:12px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#1976b8;
    color:white;
}

.btn-primary:hover{
    background:#125e94;
}

.btn-secondary{
    background:#e8edf3;
    color:#25344a;
}

.btn-danger{
    background:#dc3545;
    color:white;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:22px;
}

.stat-card .label{
    color:#708096;
    margin-bottom:12px;
}

.stat-card .number{
    font-size:32px;
    font-weight:bold;
}

/* TABLE */
.panel{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    overflow:hidden;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 22px;
    border-bottom:1px solid #e5e9ee;
}

.panel-header h2{
    font-size:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:16px 18px;
    text-align:left;
    border-bottom:1px solid #edf0f3;
    font-size:14px;
}

th{
    color:#68788e;
    background:#fafbfc;
}

tr:hover td{
    background:#fafcff;
}

.project-name{
    font-weight:bold;
    color:#17243a;
}

.progress-wrap{
    width:120px;
}

.progress-bar{
    height:7px;
    background:#e5e9ee;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.progress-fill{
    height:100%;
    background:#1976b8;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-active{
    background:#d9f7e5;
    color:#148344;
}

.badge-delayed{
    background:#fff0c7;
    color:#a56a00;
}

.badge-completed{
    background:#dce8ff;
    color:#2459a6;
}

.badge-onhold{
    background:#eceff3;
    color:#657284;
}

.actions{
    display:flex;
    gap:7px;
}

.action-btn{
    border:1px solid #d8dee6;
    background:white;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
}

.action-btn:hover{
    background:#f0f4f8;
}

/* MODAL */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal{
    width:700px;
    max-width:94%;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
    padding:22px 25px;
    border-bottom:1px solid #e5e9ee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:21px;
}

.close{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    color:#68788e;
}

.modal-body{
    padding:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:13px;
    font-weight:bold;
    color:#4d5d73;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #d4dae2;
    border-radius:6px;
    outline:none;
    font-size:14px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#1976b8;
}

.modal-footer{
    padding:18px 25px;
    border-top:1px solid #e5e9ee;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}
/* =========================
   PROJECT DETAILS WINDOW
========================= */

.project-details-modal{

    width:1100px;
    max-width:95%;
    height:85vh;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
}


.project-details-header{

    min-height:80px;

    padding:20px 25px;

    border-bottom:1px solid #e5e9ee;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.project-details-header h2{

    font-size:24px;

    color:#17243a;

}


.project-details-code{

    color:#708096;

    font-size:13px;

    margin-top:5px;

}


.project-details-layout{

    display:grid;

    grid-template-columns:230px 1fr;

    flex:1;

    min-height:0;

}


.project-details-menu{

    background:#f7f9fb;

    border-right:1px solid #e1e5ea;

    padding:15px;

    overflow-y:auto;

}


.project-menu-btn{

    width:100%;

    border:0;

    background:#e9eef5;

    color:#17243a;

    padding:15px 16px;

    margin-bottom:8px;

    border-radius:8px;

    text-align:left;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    min-height:48px;

    display:flex;

    align-items:center;

    gap:9px;

    transition:all 0.15s ease;

}
    .module-icon{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:32px;

    min-width:32px;

    font-size:24px;

    line-height:1;

}


.project-menu-btn:hover{

    background:#dfe7f1;

}

.project-menu-btn.active{

    background:#1976b8;

    color:white;

    font-weight:bold;

}


.project-details-content{

    padding:28px;

    overflow-y:auto;

}


.project-section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}


.project-section-header h3{

    font-size:22px;

    color:#17243a;

}


.project-section-header p{

    color:#708096;

    margin-top:5px;

    font-size:14px;

}
/* =====================================================
   BOQ PROFESSIONAL DESIGN
===================================================== */

.boq-page{
    background:#f8fafc;
    border-radius:18px;
    padding:28px;
    margin:0;
    box-sizing:border-box;
}


/* =========================
   HEADER
========================= */

.boq-page > div:first-child{
    background:linear-gradient(
        135deg,
        #17243a 0%,
        #263b5b 100%
    );
    border-radius:16px;
    padding:24px 28px;
   margin-bottom:14px;
    color:#ffffff;
    box-shadow:0 8px 24px rgba(15,23,42,.15);
}

.boq-page h2{
    color:#ffffff !important;
    font-size:25px !important;
    font-weight:700 !important;
    margin:0 !important;
}

.boq-page p{
    color:#dbe5f1 !important;
    margin:6px 0 0 !important;
    font-size:14px !important;
}


/* =========================
   HEADER BUTTON AREA
========================= */

.boq-page button{
    font-family:inherit;
    cursor:pointer;
}

.boq-page > div:first-child button{
    border:none !important;
    border-radius:8px !important;
    padding:9px 15px !important;
    font-size:13px !important;
    font-weight:600 !important;
    transition:all .2s ease !important;
}

.boq-page > div:first-child button:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(0,0,0,.18);
}


/* =========================
   SEARCH
========================= */

.boq-page input[type="text"]{
    width:100%;
    box-sizing:border-box;
    background:#ffffff !important;
    border:1px solid #d7e0ea !important;
    border-radius:10px !important;
    padding:13px 16px !important;
    font-size:14px !important;
    color:#17243a !important;
    outline:none;
    margin-bottom:24px;
}

.boq-page input[type="text"]:focus{
    border-color:#64748b !important;
    box-shadow:0 0 0 3px rgba(100,116,139,.12);
}


/* =========================
   FOLDER GRID
========================= */

.boq-page .boq-folder-card{
    background:#ffffff !important;
    border:1px solid #dce4ed !important;
    border-radius:16px !important;
    padding:22px !important;
    min-height:145px;
    box-shadow:
        0 3px 10px rgba(15,23,42,.06) !important;
    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease !important;
}

.boq-page .boq-folder-card:hover{
    transform:translateY(-4px) !important;
    border-color:#aebdce !important;
    box-shadow:
        0 10px 25px rgba(15,23,42,.12) !important;
}


/* =========================
   FOLDER ICON
========================= */

.boq-page .boq-folder-card .folder-icon{
    font-size:42px;
    margin-bottom:12px;
}


/* =========================
   FOLDER NAME
========================= */

.boq-page .boq-folder-card strong,
.boq-page .boq-folder-card h3{
    color:#17243a !important;
    font-size:16px !important;
    font-weight:700 !important;
}


/* =========================
   FOLDER BUTTONS
========================= */

.boq-page .boq-folder-card button{
    background:#ffffff !important;
    border-radius:7px !important;
    padding:6px 12px !important;
    font-size:12px !important;
    font-weight:600 !important;
    cursor:pointer !important;
    transition:all .2s ease !important;
}

/* Rename - Blue */
.boq-page .boq-folder-card button:first-of-type{
    color:#2563eb !important;
    border:1px solid #93c5fd !important;
    background:#eff6ff !important;
}

.boq-page .boq-folder-card button:first-of-type:hover{
    background:#dbeafe !important;
    border-color:#60a5fa !important;
}

/* Delete - Red */
.boq-page .boq-folder-card button:last-of-type{
    color:#dc2626 !important;
    border:1px solid #fca5a5 !important;
    background:#fef2f2 !important;
}

.boq-page .boq-folder-card button:last-of-type:hover{
    background:#fee2e2 !important;
    border-color:#f87171 !important;

    background:#ffffff !important;
    border-radius:7px !important;
    padding:6px 12px !important;
    font-size:12px !important;

    cursor:pointer !important;
    transition:all .2s ease !important;
}

/* Rename - Blue */

    color:#2563eb !important;
    border:1px solid #93c5fd !important;

}

    background:#dbeafe !important;

}

.boq-page .boq-folder-card button:last-of-type{
    color:#dc2626 !important;
    border:1px solid #fca5a5 !important;
    background:#fef2f2 !important;
}

.boq-page .boq-folder-card button:last-of-type:hover{
    background:#fee2e2 !important;
    border-color:#f87171 !important;
}


/* =========================
   BOQ TABLE
========================= */

.boq-page table{
    width:100%;
    border-collapse:separate !important;
    border-spacing:0 !important;
    background:#ffffff !important;
    border:1px solid #dce4ed !important;
    border-radius:14px !important;
    overflow:hidden;
    box-shadow:
        0 3px 12px rgba(15,23,42,.06);
}

.boq-page thead th{
    background:#f1f5f9 !important;
    color:#475569 !important;
    padding:14px 16px !important;
    font-size:12px !important;
    font-weight:700 !important;
    text-transform:uppercase;
    letter-spacing:.4px;
    border-bottom:1px solid #dce4ed !important;
}

.boq-page tbody td{
    padding:15px 16px !important;
    color:#334155 !important;
    font-size:13px !important;
    border-bottom:1px solid #edf1f5 !important;
}

.boq-page tbody tr:last-child td{
    border-bottom:none !important;
}

.boq-page tbody tr:hover{
    background:#f8fafc !important;
}


/* =========================
   ACTION BUTTONS
========================= */

.boq-page table button{
    background:#ffffff !important;
    color:#334155 !important;
    border:1px solid #cbd5e1 !important;
    border-radius:7px !important;
    padding:6px 10px !important;
    font-size:12px !important;
    font-weight:600 !important;
    margin-right:5px;
    transition:all .2s ease !important;
}

.boq-page table button:hover{
    background:#f1f5f9 !important;
    transform:translateY(-1px);
}


/* =========================
   EMPTY STATE
========================= */

.boq-page .boq-empty{
    background:#ffffff;
    border:1px dashed #cbd5e1;
    border-radius:14px;
    padding:45px 20px;
    text-align:center;
    color:#64748b;
}

.boq-page .boq-empty-icon{
    font-size:46px;
    margin-bottom:12px;
}

.project-info-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;

}


.project-info-card{

    border:1px solid #e1e5ea;

    border-radius:8px;

    padding:17px;

    background:#fafbfc;

}


.project-info-card span{

    display:block;

    color:#708096;

    font-size:12px;

    margin-bottom:7px;

}


.project-info-card strong{

    font-size:15px;

    color:#17243a;

}


.project-description{

    margin-top:22px;

    padding:20px;

    border:1px solid #e1e5ea;

    border-radius:8px;

}


.project-description h3{

    margin-bottom:10px;

}


.project-description p{

    color:#68788e;

    line-height:1.6;

}


.project-empty-section{

    min-height:350px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    border:2px dashed #dfe5ec;

    border-radius:10px;

    color:#708096;

}


.project-empty-icon{

    font-size:45px;

    margin-bottom:15px;

}


.project-empty-section h3{

    color:#17243a;

    margin-bottom:8px;

}


.project-empty-section p{

    max-width:450px;

    line-height:1.6;

}
/* RESPONSIVE */
@media(max-width:1000px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .sidebar{
        width:200px;
    }

    .main{
        margin-left:200px;
        width:calc(100% - 200px);
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    table{
        min-width:900px;
    }

    .panel{
        overflow-x:auto;
    }
}
    /* =========================
   DRAWINGS MODULE
========================= */

.project-link{
    cursor:pointer;
    color:#17243a;
}

.project-link:hover{
    color:#1976b8;
    text-decoration:underline;
}

.module-page{
    padding:0;
}

.module-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.module-toolbar-left h1{
    font-size:28px;
    margin-bottom:5px;
}

.module-toolbar-left p{
    color:#708096;
}

.back-btn{
    border:0;
    background:#e8edf3;
    color:#25344a;
    padding:11px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.back-btn:hover{
    background:#dce3eb;
}

.drawing-table-wrap{
    overflow-x:auto;
}

.drawing-number{
    font-weight:bold;
    color:#17243a;
}

.drawing-title{
    font-weight:bold;
}

.drawing-file{
    color:#1976b8;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
}

.drawing-file:hover{
    text-decoration:underline;
}

.revision-badge{
    display:inline-block;
    background:#eef3f8;
    color:#34495e;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status-review{
    background:#fff0c7;
    color:#a56a00;
}

.drawing-status-approved{
    background:#d9f7e5;
    color:#148344;
}

.drawing-status-rejected{
    background:#ffe0e3;
    color:#b42332;
}

.drawing-status-superseded{
    background:#eceff3;
    color:#657284;
}

.drawing-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.drawing-modal{
    width:760px;
}

.file-name{
    margin-top:6px;
    font-size:12px;
    color:#708096;
}

.info-box{
    background:#f7f9fb;
    border:1px solid #e1e5ea;
    border-radius:8px;
    padding:14px;
    margin-bottom:20px;
}

.info-box strong{
    color:#17243a;
}

.no-drawings{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}

@media(max-width:700px){
    .module-toolbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }
}
    /* =====================================================
   MANPOWER MODULE
===================================================== */
let manpowerFilters = {
    dateFrom: "",
    dateTo: "",
    workStage: "All",
    type: "All",
    trade: "All"
};
.manpower-dashboard{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.manpower-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.manpower-stat{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:20px;
}

.manpower-stat-label{
    color:#708096;
    font-size:13px;
    margin-bottom:8px;
}

.manpower-stat-value{
    font-size:30px;
    font-weight:bold;
    color:#17243a;
}

.manpower-stat-sub{
    margin-top:5px;
    color:#708096;
    font-size:12px;
}

.manpower-chart-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.manpower-chart{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:20px;
}

.manpower-chart h3{
    font-size:17px;
    color:#17243a;
    margin-bottom:5px;
}

.manpower-chart p{
    color:#708096;
    font-size:12px;
    margin-bottom:18px;
}

.manpower-bar-row{
    display:grid;
    grid-template-columns:145px 1fr 45px;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.manpower-bar-label{
    font-size:12px;
    color:#46566c;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

        onclick="openProject(${project.id})"

</td>

/* =========================
   PROJECT DETAILS
========================= */

function openProject(id){

    const project = projects.find(
    p => String(p.id) === String(id)
);

    if(!project) return;

    const oldModal = document.getElementById("projectDetailsModal");

    if(oldModal){
        oldModal.remove();
    }

    const modal = document.createElement("div");

    modal.id = "projectDetailsModal";

    modal.className = "modal-overlay";

    modal.style.display = "flex";

    modal.innerHTML = `

        <div class="project-details-modal">

            <div class="project-details-header">

                <div>
                    <h2>${escapeHTML(project.name)}</h2>

                    <div class="project-details-code">

/* =========================
   PROJECT SECTIONS
========================= */

window.showProjectSection = function(section, id, button){

    const project = projects.find(
    p => String(p.id) === String(id)
);
    if(!project) return;


    document
        .querySelectorAll(".project-menu-btn")
        .forEach(btn => btn.classList.remove("active"));


    if(button){
        button.classList.add("active");
    }



    let content = null;

if (button) {
    const modal = button.closest(".project-details-modal");
    if (modal) {
        content = modal.querySelector("#projectSectionContent");
    }
}

if (!content) {
    content = document.getElementById("projectSectionContent");
}

if (!content) {
    console.error("projectSectionContent not found.");
    return;
}


   const page = document.getElementById("pageContent");

const overviewPanel = Array.from(
    page.querySelectorAll(".panel")
).find(panel =>
    panel.querySelector(".panel-header h2") &&
    panel.querySelector(".panel-header h2")
        .textContent
        .trim() === "Project Overview"
);

const modulesPanel = Array.from(
    page.querySelectorAll(".panel")
).find(panel =>
    panel.querySelector(".panel-header h2") &&
    panel.querySelector(".panel-header h2")
        .textContent
        .trim() === "Project Modules"
);

const contentPanel =
    content.closest(".panel");


if(section === "overview"){

    if(contentPanel){
        contentPanel.style.display = "none";
    }

    if(overviewPanel){

        overviewPanel.style.display = "block";

        if(modulesPanel){
            modulesPanel.insertAdjacentElement(
                "afterend",
                overviewPanel
            );
        }

    }

    return;

}


/* Hide full Overview when another module is opened */

if(overviewPanel){
    overviewPanel.style.display = "none";
}

if(contentPanel){
    contentPanel.style.display = "block";
}

/* =========================
   DOCUMENTS
========================= */

if(section === "documents"){

    renderDocumentsSection(project);

    return;

}

   BOQ
========================= */
if(section === "boq"){
    renderBOQSection(project);
    return;
}

window.openBOQFolder = function(projectId, folderId){

    console.log("OPEN BOQ FOLDER:", {
        projectId: projectId,
        folderId: folderId
    });

    const project = projects.find(
        p => String(p.id) === String(projectId)
    );

    if(!project){
        console.error("PROJECT NOT FOUND:", projectId);
        return;
    }

    ensureBOQFolders(project);

    /* ROOT */
    if(folderId === null || folderId === undefined){

        window.boqCurrentFolder[projectId] = null;

        console.log("OPENING BOQ ROOT");

        showProjectSection(
            "boq",
            projectId
        );

        return;
    }

    /* FIND FOLDER */
    const folder = project.boqFolders.find(
        f => String(f.id) === String(folderId)
    );

    if(!folder){

        console.error(
            "BOQ FOLDER NOT FOUND:",
            folderId,
            project.boqFolders
        );

        return;
    }

    /* SAVE CURRENT FOLDER */
    window.boqCurrentFolder[projectId] = folder.id;

    console.log(
        "OPENING BOQ FOLDER:",
        folder.name,
        folder.id
    );

    /* REFRESH BOQ */
    showProjectSection(
        "boq",
        projectId
    );

};
/* =========================
   UPLOAD BOQ
========================= */

window.uploadBOQ = function(projectId){
const project = projects.find(
    p => String(p.id) === String(projectId)
);

    if(!project) return;

    if(!project.boqs){
        project.boqs = [];
    }

    const currentFolderId =
        window.boqCurrentFolder?.[projectId] || null;

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept =
        ".pdf,.xlsx,.xls,.csv";

    input.onchange = function(){

        const file = input.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload = function(e){

            project.boqs.push({

                fileName:
                    file.name,

                fileType:
                    file.type || "Unknown",

                fileData:
                    e.target.result,

                uploadedBy:
                    "Project Manager",

                date:
                    new Date()
                    .toISOString()
                    .split("T")[0],

                folderId:
                    currentFolderId

            });
            alert(
    "BOQ SAVED\n\n" +
    "File: " + file.name + "\n" +
    "Total BOQs: " + project.boqs.length + "\n" +
    "Folder: " + currentFolderId
);

            persist();

            showProjectSection(
                "boq",
                projectId
            );

        };

        reader.readAsDataURL(file);

    };

    input.click();

};

window.deleteEquipment = function(projectId, equipmentIndex){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project){
        return;
    }


    const equipment =
        (project.equipment || [])
        [equipmentIndex];


    if(!equipment){
        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this equipment?\n\n" +
            (equipment.name || "Equipment") +
            " (" +
            (equipment.id || "") +
            ")"
        );


    if(!confirmed){
        return;
    }


    project.equipment.splice(
        equipmentIndex,
        1
    );


    persist();


    renderEquipmentSection(
        project
    );

};

const equipmentSearch =
    document.getElementById(
        "equipmentSearch"
    );

const equipmentTypeFilter =
    document.getElementById(
        "equipmentTypeFilter"
    );

const equipmentStatusFilter =
    document.getElementById(
        "equipmentStatusFilter"
    );

const equipmentOwnershipFilter =
    document.getElementById(
        "equipmentOwnershipFilter"
    );


/* -----------------------------------------------------
   POPULATE TYPE FILTER
----------------------------------------------------- */

if(equipmentTypeFilter){

    const types = [
        ...new Set(
            equipment
                .map(
                    item =>
                        item.type
                )
                .filter(
                    type =>
                        type
                )
        )
    ];

    types.forEach(
        function(type){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                type;

            option.textContent =
                type;

            equipmentTypeFilter.appendChild(
                option
            );

        }
    );

}


/* -----------------------------------------------------
   APPLY ALL FILTERS TOGETHER
----------------------------------------------------- */

function applyEquipmentFilters(){

    const search =
        equipmentSearch
            ?
            equipmentSearch.value
                .trim()
                .toLowerCase()
            :
            "";

    const selectedType =
        equipmentTypeFilter
            ?
            equipmentTypeFilter.value
            :
            "";

    const selectedStatus =
        equipmentStatusFilter
            ?
            equipmentStatusFilter.value
            :
            "";

    const selectedOwnership =
        equipmentOwnershipFilter
            ?
            equipmentOwnershipFilter.value
            :
            "";


    const rows =
        document.querySelectorAll(
            "#equipmentRegisterBody tr"
        );


    rows.forEach(
        function(row, index){

            const item =
                equipment[index];


            if(!item){

                row.style.display =
                    "none";

                return;

            }


            const searchableText =
                [
                    item.id,
                    item.name,
                    item.type,
                    item.brandModel,
                    item.location
                ]
                .join(" ")
                .toLowerCase();


            const matchesSearch =
                !search ||
                searchableText.includes(
                    search
                );


            const matchesType =
                !selectedType ||
                item.type ===
                    selectedType;


            const matchesStatus =
                !selectedStatus ||
                item.status ===
                    selectedStatus;


            const matchesOwnership =
                !selectedOwnership ||
                item.ownership ===
                    selectedOwnership;


            const showRow =
                matchesSearch &&
                matchesType &&
                matchesStatus &&
                matchesOwnership;


            row.style.display =
                showRow
                    ? ""
                    : "none";

        }
    );

}


/* -----------------------------------------------------
   FILTER EVENTS
----------------------------------------------------- */

if(equipmentSearch){

    equipmentSearch.addEventListener(
        "input",
        applyEquipmentFilters
    );

}


if(equipmentTypeFilter){

    equipmentTypeFilter.addEventListener(
        "change",
        applyEquipmentFilters
    );

}


if(equipmentStatusFilter){

    equipmentStatusFilter.addEventListener(
        "change",
        applyEquipmentFilters
    );

}


if(equipmentOwnershipFilter){

    equipmentOwnershipFilter.addEventListener(
        "change",
        applyEquipmentFilters
    );

}
};

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project){
        return;
    }

    const equipment =
        project.equipment || [];

    const data =
        equipment.map(
            function(item, index){

                return {

                    "#":
                        index + 1,

                    "Equipment ID":
                        item.id || "",

                    "Equipment / Plant":
                        item.name || "",

                    "Type":
                        item.type || "",

                        item.brandModel || "",

                    "Ownership":
                        item.ownership || "",

                    "Site Location":
                        item.location || "",

                    "Status":
                        item.status || "",

                    "Mobilization Date":
                        item.mobilizationDate || "",

                    "Deployment Status":
                        item.deploymentStatus || "",

                    "Demobilization Date":
                        item.demobilizationDate || "",

                    "Notes":
                        item.notes || ""

                };

            }
        );

    const worksheet =
        XLSX.utils.json_to_sheet(
            data
        );

    worksheet["!cols"] = [

        {wch:6},
        {wch:16},
        {wch:24},
        {wch:20},
        {wch:20},
        {wch:18},
        {wch:20},
        {wch:20},
        {wch:20},
        {wch:20},
        {wch:22},
        {wch:40}

    ];

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Equipment"
    );

    const projectName =
        project.name ||
        project.projectName ||
        "Project";

    XLSX.writeFile(
        workbook,
        `${projectName}-Equipment.xlsx`

};

    /* =====================================================
   PROJECT OVERVIEW DASHBOARD
===================================================== */

function getProjectOverviewData(project){

    const payments =
        Array.isArray(project.payments)
            ? project.payments
            : [];

    const variations =
        Array.isArray(project.variations)
            ? project.variations
            : [];

    const equipment =
        Array.isArray(project.equipment)
            ? project.equipment
            : [];

    const manpowerRecords =
        Array.isArray(project.manpowerRecords)
            ? project.manpowerRecords
            : [];


    /* =================================================
       PAYMENTS
    ================================================= */

    let totalInvoiced = 0;
    let totalPaymentWHT = 0;
    let totalPayable = 0;
    let totalPaymentReceived = 0;

    payments.forEach(function(payment){

        const invoice =
            parsePaymentMoney(
                payment.invoiceValue
            );

        const wht =
            parsePaymentMoney(
                payment.whtAmount
            );

        const payable =
            Math.max(
                0,
                invoice - wht
            );

        const received =
            parsePaymentMoney(
                payment.paymentReceived
            );

        totalInvoiced += invoice;
        totalPaymentWHT += wht;
        totalPayable += payable;
        totalPaymentReceived += received;

    });

    const paymentOutstanding =
        totalPayable -
        totalPaymentReceived;


    /* =================================================
       VARIATIONS
    ================================================= */

    let totalVariationSubmitted = 0;
    let totalVariationWHT = 0;
    let totalVariationPayable = 0;
    let totalVariationReceived = 0;

    variations.forEach(function(variation){

        const submitted =
            parseVariationMoney(
                variation.submittedValue
            );

        const wht =
            parseVariationMoney(
                variation.whtAmount
            );

        const payable =
            Math.max(
                0,
                submitted - wht
            );

        const received =
            parseVariationMoney(
                variation.paymentReceived
            );

        totalVariationSubmitted +=
            submitted;

        totalVariationWHT +=
            wht;

        totalVariationPayable +=
            payable;

        totalVariationReceived +=
            received;

    });

    const variationOutstanding =
        totalVariationPayable -
        totalVariationReceived;


    /* =================================================
       EQUIPMENT
    ================================================= */

    const equipmentOperational =
        equipment.filter(function(item){

            return String(
                item.status || ""
            ).toLowerCase() === "operational";

        }).length;

    const equipmentMaintenance =
        equipment.filter(function(item){

            return String(
                item.status || ""
            ).toLowerCase() ===
            "under maintenance";

        }).length;

    const equipmentOutOfService =
        equipment.filter(function(item){

            return String(
                item.status || ""
            ).toLowerCase() ===
            "out of service";

        }).length;

    const equipmentAvailable =
        equipment.filter(function(item){

            return String(
                item.status || ""
            ).toLowerCase() ===
            "available";

        }).length;


    /* =================================================
       MANPOWER
    ================================================= */

    let manpowerTotal = 0;

    if(
        typeof almMP2GetCurrentStats ===
        "function"
    ){

        const selectedDate =
            project.manpowerAsOfDate ||
            new Date()
                .toISOString()
                .slice(0,10);

        const manpowerStats =
            almMP2GetCurrentStats(
                project,
                selectedDate
            );

        manpowerTotal =
            Number(
                manpowerStats.total || 0
            );

    }
    else{

        manpowerTotal =
            manpowerRecords.reduce(
                function(total,record){

                    return total +
                        Number(
                            record.manpower || 0
                        );

                },
                0
            );

    }


    /* =================================================
       PROJECT PROGRESS
    ================================================= */

    const progress =
        Number(
            project.progress || 0
        );


    /* =================================================
       RETURN OVERVIEW DATA
    ================================================= */

    return {

        contractValue:
            parsePaymentMoney(
                project.contractValue ||
                project.contractAmount ||
                project.value ||
                0
            ),

        progress,

        totalInvoiced,

        totalPaymentWHT,

        totalPayable,

        totalPaymentReceived,

        paymentOutstanding,

        totalVariationSubmitted,

        totalVariationWHT,

        totalVariationPayable,

        totalVariationReceived,

        variationOutstanding,

        equipmentTotal:
            equipment.length,

        equipmentOperational,

        equipmentMaintenance,

        equipmentOutOfService,

        equipmentAvailable,

        manpowerTotal,

        paymentCount:
            payments.length,

        variationCount:
            variations.length,

        equipmentCount:
            equipment.length,

        manpowerRecordCount:
            manpowerRecords.length

    };

}

/* =========================
   SAVE PROJECT
========================= */

function saveProject(event){

    event.preventDefault();

    const projectData = {

        name: document.getElementById("projectName").value.trim(),

        code: document.getElementById("projectCode").value.trim(),

        client: document.getElementById("client").value.trim(),

        manager: document.getElementById("manager").value.trim(),

        location: document.getElementById("location").value.trim(),

        contractValue: document.getElementById("contractValue").value,

        startDate: document.getElementById("startDate").value,

        completionDate: document.getElementById("completionDate").value,
        erpGoLiveDate: document.getElementById("erpGoLiveDate")?.value || "",
previousWeeklyReportsArchive:
    document.getElementById("previousWeeklyReportsArchive")?.value.trim() || "",

        status: document.getElementById("status").value,

       progress: Number(document.getElementById("progress").value) || 0,

description:
    document.getElementById("description").value.trim(),

erpGoLiveDate:
    document.getElementById("erpGoLiveDate").value || "",

previousWeeklyReportsArchive:
    document.getElementById("previousWeeklyReportsArchive").value.trim() || ""
    };


    if(editingId){

        const index = projects.findIndex(p => p.id === editingId);

        if(index !== -1){

            projects[index] = {
                ...projects[index],
                ...projectData
            };

        }

    }else{

        projects.push({

            id: Date.now(),

            ...projectData

        });

    }


    persist();

    closeModal();

    showDashboard();
}


/* =========================
   DELETE PROJECT
========================= */

function deleteProject(id){

    const project = projects.find(p => p.id === id);

    if(!project) return;

    const confirmed = confirm(
        `Are you sure you want to delete "${project.name}"?`
    );

    if(!confirmed) return;

    projects = projects.filter(p => p.id !== id);

    persist();

    showDashboard();
}


/* =========================
   SEARCH
========================= */

function searchProjects(){

    const search = document
        .getElementById("globalSearch")
        .value
        .toLowerCase()
        .trim();

    if(!search){

        showDashboard();

        return;
    }

    const results = projects.filter(p =>

        (p.name || "").toLowerCase().includes(search) ||
        (p.code || "").toLowerCase().includes(search) ||
        (p.client || "").toLowerCase().includes(search) ||
        (p.manager || "").toLowerCase().includes(search) ||
        (p.location || "").toLowerCase().includes(search)

    );

    document.getElementById("pageContent").innerHTML = `

        <div class="page-title">

            <div>
                <h1>Search Results</h1>
                <p>${results.length} project(s) found</p>
            </div>

            <button
                class="btn btn-primary"
                onclick="openNewProject()">
                + New Project
            </button>

        </div>

        <div class="panel">

            ${projectTable(results)}

        </div>

    `;
}

/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

document.getElementById("projectModal").addEventListener("click", function(e){

    if(e.target === this){
        closeModal();
    }

});

/* =====================================================
   ENSURE DOCUMENT FOLDERS
===================================================== */

function ensureDocumentsFolders(project){

    if(!Array.isArray(project.documentsFolders)){

        project.documentsFolders = [

            {
                id:"root",
                name:"Documents",
                parentId:null
            }

        ];

        persist();

    }

    if(
        !project.documentsFolders.some(
            folder =>
                String(folder.id) === "root"
        )
    ){

        project.documentsFolders.unshift({

            id:"root",
            name:"Documents",
            parentId:null

        });

        persist();

    }

    if(!Array.isArray(project.documents)){

        project.documents = [];

        persist();

    }

    return project.documentsFolders;

}


/* =====================================================
   INDEXEDDB
===================================================== */

let documentsFileDBPromise = null;


function getDocumentsFileDB(){

    if(documentsFileDBPromise){

        return documentsFileDBPromise;

    }

    documentsFileDBPromise =
        new Promise(
            function(resolve,reject){

                if(!window.indexedDB){

                    reject(
                        new Error(
                            "IndexedDB is not available in this browser."
                        )
                    );

                    return;
                }

                const request =
                    indexedDB.open(
                        "ALM_Documents_Files",
                        1
                    );

                request.onupgradeneeded =
                function(event){

                    const db =
                        event.target.result;

                    if(
                        !db.objectStoreNames.contains(
                            "files"
                        )
                    ){

                        db.createObjectStore(
                            "files",
                            {
                                keyPath:"id"
                            }
                        );

                    }

                };

                request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };

                request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

            }
        );

    return documentsFileDBPromise;

}


/* =====================================================
   SAVE FILE
===================================================== */

async function saveDocumentFile(
    fileId,
    file
){

    const db =
        await getDocumentsFileDB();

    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "files"
                );

            store.put({

                id:fileId,

                name:file.name,

                type:
                    file.type ||
                    "application/octet-stream",

                blob:file

            });

            transaction.oncomplete =
            function(){

                resolve();

            };

            transaction.onerror =
            function(){

                reject(
                    transaction.error
                );

            };

        }
    );

}


/* =====================================================
   GET FILE
===================================================== */

async function getDocumentFile(fileId){

    if(!fileId){

        return null;

    }

    const db =
        await getDocumentsFileDB();

    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    "files"
                );

            const request =
                store.get(
                    fileId
                );

            request.onsuccess =
            function(){

                resolve(
                    request.result || null
                );

            };

            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =====================================================
   DELETE FILE
===================================================== */

async function deleteDocumentFile(fileId){

    if(!fileId){

        return;

    }

    const db =
        await getDocumentsFileDB();

    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "files"
                );

            store.delete(
                fileId
            );

            transaction.oncomplete =
            function(){

                resolve();

            };

            transaction.onerror =
            function(){

                reject(
                    transaction.error
                );

            };

        }
    );

}

/* =====================================================

===================================================== */

window.filterDocumentsTable =
function(searchValue){

    const searchTerm =
        String(
            searchValue || ""
        )
        .toLowerCase()
        .trim();


    const table =
        document.querySelector(
            "#projectSectionContent table"
        );

    if(!table) return;


    const rows =
        table.querySelectorAll(
            "tbody tr"
        );


    rows.forEach(
        function(row){

            const cells =
                row.querySelectorAll(
                    "td"
                );

            if(cells.length < 2) return;


            const documentName =
                String(
                    cells[0].textContent || ""
                )
                .toLowerCase();


            const fileType =
                String(
                    cells[1].textContent || ""
                )
                .toLowerCase();


            const matches =
                !searchTerm ||
                documentName.includes(
                    searchTerm
                ) ||
                fileType.includes(
                    searchTerm
                );


            row.style.display =
                matches
                    ? ""
                    : "none";

        }
    );

};


/* =====================================================
   CREATE FOLDER
===================================================== */

window.createDocumentsFolder =
function(projectId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project) return;


    ensureDocumentsFolders(
        project
    );


    const currentFolderId =
        window.documentsCurrentFolder[
            project.id
        ] ?? null;


    const name =
        prompt(
            "Enter folder name:"
        );


    if(name === null) return;


    const cleanName =
        name.trim();


    if(!cleanName){

        alert(
            "Folder name cannot be empty."
        );

        return;

    }


    const duplicate =
        project.documentsFolders.some(
            folder =>

                String(
                    folder.parentId ?? null
                ) ===
                String(
                    currentFolderId ?? null
                )

                &&

                String(
                    folder.name || ""
                )
                .toLowerCase() ===
                cleanName.toLowerCase()
        );


    if(duplicate){

        alert(
            "A folder with this name already exists."
        );

        return;

    }


    project.documentsFolders.push({

        id:
            "document_folder_" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:
            cleanName,

        parentId:
            currentFolderId ?? null

    });


    persist();

    renderDocumentsSection(
        project
    );

};


/* =====================================================
   RENAME FOLDER
===================================================== */

window.renameDocumentsFolder =
function(
    projectId,
    folderId
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project) return;


    ensureDocumentsFolders(
        project
    );


    if(String(folderId) === "root"){

        alert(
            "The main Documents folder cannot be renamed."
        );

        return;

    }


    const folder =
        project.documentsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder){

        alert(
            "Folder not found."
        );

        return;

    }


    const newName =
        prompt(
            "Enter new folder name:",
            folder.name || ""
        );


    if(newName === null) return;


    const cleanName =

        );

window.deleteDocumentsFolder =
async function(
    projectId,
    folderId
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project) return;


    ensureDocumentsFolders(
        project
    );


    if(String(folderId) === "root"){

        alert(
            "The main Documents folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.documentsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder){

        alert(
            "Folder not found."
        );

        return;

    }


    const confirmed =
        confirm(
            `Delete folder "${folder.name}"?\n\n` +
            `All subfolders and documents inside it will also be deleted.`
        );


    if(!confirmed) return;


    const foldersToDelete =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.documentsFolders.forEach(
            function(child){

                if(

                    foldersToDelete.has(
                        String(
                            child.parentId
                        )
                    )

                    &&

                    !foldersToDelete.has(
                        String(
                            child.id
                        )
                    )

                ){

                    foldersToDelete.add(
                        String(
                            child.id
                        )
                    );

                    changed = true;

                }

            }
        );

    }


    const documentsToDelete =
        (project.documents || [])
        .filter(
            document =>
                foldersToDelete.has(
                    String(
                        document.folderId
                    )
                )
        );


    try{

        for(
            const document
            of documentsToDelete
        ){

            if(document.fileId){

                await deleteDocumentFile(
                    document.fileId
                );

            }

        }


        project.documents =
            (project.documents || [])
            .filter(
                document =>
                    !foldersToDelete.has(
                        String(
                            document.folderId
                        )
                    )
            );


        project.documentsFolders =
            project.documentsFolders.filter(
                folder =>
                    !foldersToDelete.has(
                        String(
                            folder.id
                        )
                    )
            );


        window.documentsCurrentFolder[
            project.id
        ] =
            folder.parentId ?? null;


        window.documentsSearchTerm[
            project.id
        ] = "";


        persist();

        renderDocumentsSection(
            project
        );

    }
    catch(error){

        console.error(
            "Document folder deletion error:",
            error
        );

        alert(
            "The folder could not be deleted.\n\n" +
            error.message
        );

    }

};

window.renameDrawingsFolder = function(projectId, folderId){

    const project = projects.find(
        p => String(p.id) === String(projectId)
    );

    if(!project) return;

    ensureDrawingsFolders(project);

    if(String(folderId) === "root"){
        alert("The main Drawings folder cannot be renamed.");
        return;
    }

    const folder = project.drawingsFolders.find(
        f => String(f.id) === String(folderId)
    );

    if(!folder){
        alert("Folder not found.");
        return;
    }

    const newName = prompt(
        "Enter new folder name:",
        folder.name || ""
    );

    if(newName === null) return;

    const cleanName = newName.trim();

    if(!cleanName){

        alert("Folder name cannot be empty.");

        return;
    }

    const duplicate = project.drawingsFolders.some(
        other =>
            String(other.id) !== String(folder.id) &&
            String(other.parentId ?? null) ===
            String(folder.parentId ?? null) &&
            String(other.name || "").toLowerCase() ===
            cleanName.toLowerCase()
    );

    if(duplicate){

        alert(
            "A folder with this name already exists."
        );

        return;
    }

    folder.name = cleanName;

    persist();

    renderDrawingsSection(project);

};

let drawingsFileDBPromise = null;


function getDrawingsFileDB(){

    if(drawingsFileDBPromise){

        return drawingsFileDBPromise;

    }


    drawingsFileDBPromise =
        new Promise(
            function(resolve,reject){

                if(!window.indexedDB){

                    reject(
                        new Error(
                            "IndexedDB is not available in this browser."
                        )
                    );

                    return;

                }


                const request =
                    indexedDB.open(
                        "ALM_Drawings_Files",
                        1
                    );


                request.onupgradeneeded =
                function(event){

                    const db =
                        event.target.result;


                    if(
                        !db.objectStoreNames.contains(
                            "files"
                        )
                    ){

                        db.createObjectStore(
                            "files",
                            {
                                keyPath:"id"
                            }
                        );

                    }

                };


                request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };


                request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

            }
        );


    return drawingsFileDBPromise;

}


/* =========================
   SAVE DRAWING FILE
========================= */

async function saveDrawingFile(
    fileId,
    file
){

    const db =
        await getDrawingsFileDB();


    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    "files"
                );


            store.put({

                id:fileId,

                name:file.name,

                type:
                    file.type ||
                    "application/octet-stream",

                blob:file

            });


            transaction.oncomplete =
            function(){

                resolve();

            };


            transaction.onerror =
            function(){

                reject(
                    transaction.error
                );

            };

        }
    );

}
    /* =========================
   GET DRAWING FILE
========================= */

async function getDrawingFile(fileId){

    if(!fileId){
        return null;
    }

    const db =
        await getDrawingsFileDB();

    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    "files"
                );

            const request =
                store.get(
                    fileId
                );

            request.onsuccess =
            function(){

                resolve(
                    request.result || null
                );

            };

            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}

    async function deleteDrawingFile(fileId){

                db.transaction(

            const store =
                transaction.objectStore(

            store.delete(fileId);

            function(){

            function(){
                reject(transaction.error);

    );

window.uploadDrawingFile = async function(
    projectId,
    drawingId,
    file
){

    if(!file){
        return;
    }

    const project = projects.find(
        p => String(p.id) === String(projectId)
    );

    if(!project){
        return;
    }

    const drawing = (project.drawings || []).find(
        d => String(d.id) === String(drawingId)
    );

    if(!drawing){

        alert("Drawing not found.");

        return;
    }


    /* =========================
       ALLOWED FILE TYPES
    ========================= */

    const fileName =
        String(file.name || "").toLowerCase();

    const allowed =
        fileName.endsWith(".pdf") ||
        fileName.endsWith(".dwg") ||
        fileName.endsWith(".dxf");

    if(!allowed){

        alert(
            "Please select a PDF, DWG, or DXF file."
        );

        return;
    }


    try{

        const fileId =
            "drawing-file-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,10);


        await saveDrawingFile(
            fileId,
            file
        );


        drawing.fileId =
            fileId;

        drawing.fileName =

/* =====================================================
   WEEKLY REPORT ESCAPE
===================================================== */

function weeklyReportEscape(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   WEEKLY REPORT DATE FORMAT
===================================================== */

function weeklyReportDate(value){

    if(!value){
        return "-";
    }

    const parts =
        String(value).split("-");

    if(parts.length !== 3){
        return value;
    }

    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* =====================================================
   GET SATURDAY OF WEEK
===================================================== */

function getWeeklyReportSaturday(dateValue){

    const date =
        new Date(
            dateValue + "T00:00:00"
        );

    const day =
        date.getDay();

    /*
       JavaScript:
       Sunday = 0
       Monday = 1
       ...
       Saturday = 6
    */

    const difference =
        day === 6
            ? 0
            : day + 1;

    date.setDate(
        date.getDate() - difference
    );

    return weeklyReportDateISO(date);

}


/* =====================================================
   GET FRIDAY OF WEEK
===================================================== */

function getWeeklyReportFriday(dateValue){

    const saturday =
        new Date(
            dateValue + "T00:00:00"
        );

    saturday.setDate(
        saturday.getDate() + 6
    );

    return weeklyReportDateISO(
        saturday
    );

}


/* =====================================================
   DATE TO ISO
===================================================== */

function weeklyReportDateISO(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =====================================================
   NEXT WEEK NUMBER
===================================================== */

function getNextWeeklyReportNumber(project){

    const reports =
        project.weeklyReports || [];

    if(!reports.length){

        return 1;

    }

    const numbers =
        reports
            .map(report =>
                Number(
                    report.weekNumber || 0
                )
            )
            .filter(number =>
                Number.isFinite(number)
            );

    if(!numbers.length){

        return 1;

    }

    return Math.max(...numbers) + 1;

}

/* =====================================================
   CALCULATE OVERALL WEATHER
===================================================== */

function updateWeeklyOverallWeather(){

    const days = [
        "Saturday",
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday"
    ];

    const weatherCounts = {};
    const weatherOrder = [];

    days.forEach(day => {

        const input =
            document.getElementById(
                "weeklyWeather_" + day
            );

        if(!input || !input.value){
            return;
        }

        const weather =
            input.value;

        if(!weatherCounts[weather]){

            weatherCounts[weather] = 0;

            weatherOrder.push(
                weather
            );
        }

        weatherCounts[weather]++;
    });


    let overallWeather = "";

    let highestCount = 0;


    weatherOrder.forEach(weather => {

        if(
            weatherCounts[weather] >
            highestCount
        ){

            highestCount =
                weatherCounts[weather];

            overallWeather =
                weather;
        }

    });


    const overallInput =
        document.getElementById(
            "weeklyReportOverallWeather"
        );

    if(overallInput){

        overallInput.value =
            overallWeather;

    }

}

/* =====================================================
   WEATHER DAYS
===================================================== */

function getWeeklyWeatherDays(startDate){

    const saturday =
        new Date(
            startDate + "T00:00:00"
        );

    const days = [

        {
            name:"Saturday",
            offset:0
        },

        {
            name:"Sunday",
            offset:1
        },

        {
            name:"Monday",
            offset:2
        },

        {
            name:"Tuesday",
            offset:3
        },

        {
            name:"Wednesday",
            offset:4
        },

        {
            name:"Thursday",
            offset:5
        },

        {
            name:"Friday",
            offset:6
        }

    ];

    return days.map(day => {

        const date =
            new Date(saturday);

        date.setDate(
            saturday.getDate() +
            day.offset
        );

        return {

            name:day.name,

            date:
                weeklyReportDateISO(
                    date
                )

        };

    });

}

            .sort(

                    ) -

                    ),

            })
        )
        :
        [];


    openWeeklyReportForm(

materials:

/* =====================================================
   WEEKLY MANPOWER INTEGRATION
   MASTER SOURCE = MANPOWER MODULE
   ACTUAL = ACTIVE MANPOWER LIMIT
===================================================== */

window.getWeeklyManpowerOptions =
function(project, report){

    if(!project){
        return [];
    }

    const reportDate =
        (
            report &&
            report.reportDate
        )
        ||
        document.getElementById(
            "weeklyReportDate"
        )?.value
        ||
        almMP2Today();

    const records =
        project.manpowerRecords || [];

    const totals = {};

    records
        .filter(
            record =>
                almMP2IsActive(
                    record,
                    reportDate
                )
        )
        .forEach(
            record => {

                const trade =
                    String(
                        record.trade || ""
                    ).trim();

                if(!trade){
                    return;
                }

                totals[trade] =
                    (
                        totals[trade] || 0
                    ) +
                    Number(
                        record.manpower || 0
                    );

            }
        );

    return Object.keys(totals)
        .sort()
        .map(
            trade => ({
                trade,
                available:
                    totals[trade]
            })
        );

};


/* =====================================================
   WEEKLY MANPOWER ACTUAL VALIDATION
===================================================== */

window.validateWeeklyManpowerActual =
function(input){

    if(!input){
        return;
    }

    const row =
        input.closest("tr");

    if(!row){
        return;
    }

    const tradeSelect =
        row.querySelector(
            'select[id^="weeklyManpowerTrade_"]'
        );

    const trade =
        tradeSelect
        ? tradeSelect.value.trim()
        : "";

    let error =
        row.querySelector(
            ".weekly-manpower-actual-error"
        );

    if(!error){

        error =
            document.createElement(
                "div"
            );

        error.className =
            "weekly-manpower-actual-error";

        error.style.cssText = `
            color:#dc2626;
            font-size:12px;
            margin-top:5px;
            font-weight:600;
        `;

        input.parentElement.appendChild(
            error
        );

    }

    error.textContent = "";

    input.style.borderColor =
        "#d4dae2";

    if(
        !trade ||
        input.value === ""
    ){
        return;
    }

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(currentProjectId)
        );

    if(!project){
        return;
    }

    const reportDate =
        document.getElementById(
            "weeklyReportDate"
        )?.value ||
        almMP2Today();

    const available =
        (project.manpowerRecords || [])
            .filter(
                record =>
                    String(
                        record.trade || ""
                    ).trim() === trade &&
                    almMP2IsActive(
                        record,
                        reportDate
                    )
            )
            .reduce(
                (
                    total,
                    record
                ) =>
                    total +
                    Number(
                        record.manpower || 0
                    ),
                0
            );

    let otherActual = 0;

    document
        .querySelectorAll(
            '#weeklyManpowerRows input[id^="weeklyManpowerActual_"]'
        )
        .forEach(
            otherInput => {

                if(
                    otherInput === input
                ){
                    return;
                }

                const otherRow =
                    otherInput.closest(
                        "tr"
                    );

                if(!otherRow){
                    return;
                }

                const otherTradeSelect =
                    otherRow.querySelector(
                        'select[id^="weeklyManpowerTrade_"]'
                    );

                const otherTrade =
                    otherTradeSelect
                    ? otherTradeSelect.value.trim()
                    : "";

                if(
                    otherTrade === trade
                ){

                    otherActual +=
                        Number(
                            otherInput.value || 0
                        );

                }

            }
        );

    const maxAllowed =
        Math.max(
            0,
            available -
            otherActual
        );

    const entered =
        Number(
            input.value || 0
        );

    if(
        entered >
        maxAllowed
    ){

        input.value =
            maxAllowed;

        input.style.borderColor =
            "#dc2626";

        error.textContent =
            "You have exceeded the available manpower number.";

    }

};

window.validateWeeklyEquipmentActual =
function(input){

    if(!input){
        return;
    }

    const row =
        input.closest("tr");

    if(!row){
        return;
    }

    const nameSelect =
        row.querySelector(
            'select[id^="weeklyEquipmentName_"]'
        );

    const name =
        nameSelect
        ? nameSelect.value.trim()
        : "";

    let error =
        row.querySelector(
            ".weekly-equipment-actual-error"
        );

    if(!error){

        error =
            document.createElement("div");

        error.className =
            "weekly-equipment-actual-error";

        error.style.cssText = `
            color:#dc2626;
            font-size:12px;
            margin-top:5px;
            font-weight:600;
        `;

        input.parentElement.appendChild(
            error
        );
    }

    error.textContent = "";

    input.style.borderColor =
        "#d4dae2";

    if(!name || input.value === ""){
        return;
    }

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(currentProjectId)
        );

    if(!project){
        return;
    }

    const available =
        (project.equipment || [])
            .filter(item =>
                String(item.name || "").trim() === name &&
                String(
                    item.deploymentStatus || ""
                ).toLowerCase() === "on site"
            )
            .length;

    let otherActual = 0;

    document
        .querySelectorAll(
            '#weeklyEquipmentRows input[id^="weeklyEquipmentActual_"]'
        )
        .forEach(otherInput => {

            if(otherInput === input){
                return;
            }

            const otherRow =
                otherInput.closest("tr");

            if(!otherRow){
                return;
            }

            const otherNameSelect =
                otherRow.querySelector(
                    'select[id^="weeklyEquipmentName_"]'
                );

            const otherName =
                otherNameSelect
                ? otherNameSelect.value.trim()
                : "";

            if(otherName === name){

                otherActual +=
                    Number(
                        otherInput.value || 0
                    );
            }

        });

    const maxAllowed =
        Math.max(
            0,
            available - otherActual
        );

    const entered =
        Number(input.value || 0);

    if(entered > maxAllowed){

        input.value =
            maxAllowed;

        input.style.borderColor =
            "#dc2626";

        error.textContent =
            "You have exceeded the available equipment number.";

    }

};

window.updateWeeklyEquipmentDeploymentSummary =
function(){

    const summaryBody =
        document.getElementById(
            "weeklyEquipmentDeploymentSummaryBody"
        );

    if(!summaryBody){
        return;
    }

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(currentProjectId)
        );

    if(!project){
        return;
    }

    const totals = {};

    document
        .querySelectorAll(
            "#weeklyEquipmentRows tr"
        )
        .forEach(row => {

            const nameSelect =
                row.querySelector(
                    'select[id^="weeklyEquipmentName_"]'
                );

            const actualInput =
                row.querySelector(
                    'input[id^="weeklyEquipmentActual_"]'
                );

            const name =
                nameSelect
                ? nameSelect.value.trim()
                : "";

            if(!name){
                return;
            }

            const actual =
                actualInput
                ? Number(actualInput.value || 0)
                : 0;

            if(!totals[name]){
                totals[name] = 0;
            }

            totals[name] += actual;

        });

    const equipmentOnSite =
        project.equipment || [];

    const availableMap = {};

    equipmentOnSite
        .filter(
            item =>
                String(
                    item.deploymentStatus || ""
                ).toLowerCase() === "on site"
        )
        .forEach(item => {

            const name =
                String(
                    item.name || ""
                ).trim();

            if(!name){
                return;
            }

            availableMap[name] =
                (availableMap[name] || 0) + 1;

        });

    const names =
        Object.keys(totals);

    if(names.length === 0){

        summaryBody.innerHTML =
            "No equipment selected.";

        return;
    }

    summaryBody.innerHTML =
        names
            .map(
                name => `
                    <div
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            padding:9px 0;
                            border-bottom:1px solid #e5e7eb;
                        "
                    >
                        <strong>
                            ${weeklyReportEscape(name)}
                        </strong>

                        <span>
                            ${totals[name]}
                            /
                            ${availableMap[name] || 0}
                        </span>
                    </div>
                `
            )
            .join("");

};

window.handleWeeklyProgressPhotoFiles =
async function(input){

    if(!input || !input.files){ return; }

    if(!Array.isArray(window.weeklyProgressPhotosDraft)){
        window.weeklyProgressPhotosDraft = [];
    }

    const files = Array.from(input.files);

    for(const file of files){

        if(!file.type.startsWith("image/")){ continue; }

        try{
            const image = await compressWeeklyProgressPhoto(file);
            window.weeklyProgressPhotosDraft.push({
                image, activity:"", location:"", date:"", remarks:""
            });
        }catch(error){
            console.error("Unable to process progress photograph:", error);
        }

    }

    input.value = "";
    renderWeeklyProgressPhotoCards();

};

function compressWeeklyProgressPhoto(file){

    return new Promise((resolve,reject) => {

        const reader = new FileReader();

        reader.onload = function(event){

            const img = new Image();

            img.onload = function(){

                const maxWidth = 1400;
                const maxHeight = 1000;
                let width = img.width;
                let height = img.height;
                const scale = Math.min(1, maxWidth / width, maxHeight / height);
                width = Math.round(width * scale);
                height = Math.round(height * scale);

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const context = canvas.getContext("2d");
                context.drawImage(img, 0, 0, width, height);

                resolve(canvas.toDataURL("image/jpeg", 0.78));
            };

            img.onerror = reject;
            img.src = event.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
    });

}

window.removeWeeklyProgressPhoto =
function(index){

    if(!Array.isArray(window.weeklyProgressPhotosDraft)){ return; }

    window.weeklyProgressPhotosDraft.splice(index, 1);
