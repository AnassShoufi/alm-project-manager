window.refreshWeeklyHSEReferences =
function(){

    const selects =
        document.querySelectorAll(
            '#weeklyHSECorrectiveActionRows select[id^="weeklyHSECorrectiveRelated_"]'
        );

    if(!selects.length){
        return;
    }

    const references = [];

    document
        .querySelectorAll(
            "#weeklyHSEIncidentRows tr"
        )
        .forEach((row, index) => {

            const name =
                row.querySelector(
                    'input[id^="weeklyHSEIncidentName_"]'
                )?.value.trim() || "";

            references.push({
                value: "incident:" + index,
                label:
                    "Incident " +
                    (index + 1) +
                    (name ? " - " + name : "")
            });

        });

    document
        .querySelectorAll(
            "#weeklyHSEObservationRows tr"
        )
        .forEach((row, index) => {

            const name =
                row.querySelector(
                    'input[id^="weeklyHSEObservationName_"]'
                )?.value.trim() || "";

            references.push({
                value: "observation:" + index,
                label:
                    "Observation " +
                    (index + 1) +
                    (name ? " - " + name : "")
            });

        });

    selects.forEach(select => {

        const currentValue = select.value;

        select.innerHTML =
            '<option value="">Select Incident / Observation</option>' +
            references.map(ref =>
                `<option value="${ref.value}">${weeklyReportEscape(ref.label)}</option>`
            ).join("");

        if(
            references.some(
                ref => ref.value === currentValue
            )
        ){
            select.value = currentValue;
        }

    });

};

window.saveWeeklyReport =
function(
    event,
    projectId,
    editIndex
){

    event.preventDefault();


    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        return;

    }


    ensureWeeklyReports(project);


    const weekNumber =
        Number(
            document.getElementById(
                "weeklyReportWeekNumber"
            ).value || 0
        );


    const reportDate =
        document.getElementById(
            "weeklyReportDate"
        ).value;


    const startDate =
        document.getElementById(
            "weeklyReportStartDate"
        ).value;


    const endDate =
        document.getElementById(
            "weeklyReportEndDate"
        ).value;


    if(!weekNumber){

        alert(
            "Please enter the Week Number."
        );

        return;

    }


    if(!startDate || !endDate){

        alert(
            "Please enter the reporting period."
        );

        return;

    }


    /*
       Prevent duplicate week numbers
    */

    const duplicate =
        project.weeklyReports.some(
            (item,index) =>
                Number(item.weekNumber) ===
                weekNumber &&
                index !== editIndex
        );


    if(duplicate){

        alert(
            "This Week Number already exists."
        );

        return;

    }


    const weather = {};


    [
        "Saturday",
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday"
    ]
    .forEach(day => {

        const input =
            document.getElementById(
                "weeklyWeather_" + day
            );

        weather[day] =
            input
                ? input.value
                : "";

    });


   const workProgress = [];

[
    1,

]
.forEach(i => {

    const activity =

    const location =

            "weeklyWorkLocation_" + i

    const remarks =

        )?.value.trim() || "";


    if(
        activity ||

        remarks
    ){

        workProgress.push({

window.handleWeeklyCompanyLogoUpload =
function(input){

    if(!input || !input.files || !input.files[0]){
        return;
    }

    const file = input.files[0];

    if(!file.type.startsWith("image/")){
        alert("Please select a valid image file for the company logo.");
        input.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        const source = e.target.result;
        const image = new Image();

        image.onload = function(){

            const maxWidth = 700;
            const maxHeight = 220;

            const scale = Math.min(
                1,
                maxWidth / image.naturalWidth,
                maxHeight / image.naturalHeight
            );

            const canvas = document.createElement("canvas");

            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            let logo = canvas.toDataURL("image/png");

            try{

                localStorage.setItem(
                    "alm_company_logo",
                    logo
                );

            }catch(error){

                /*
                    If the PNG is still too large for localStorage,
                    use a compressed JPEG fallback. This keeps the
                    logo small enough for browser storage.
                */

                const fallbackCanvas = document.createElement("canvas");
                fallbackCanvas.width = canvas.width;
                fallbackCanvas.height = canvas.height;

                const fallbackCtx = fallbackCanvas.getContext("2d");
                fallbackCtx.fillStyle = "#ffffff";
                fallbackCtx.fillRect(0, 0, fallbackCanvas.width, fallbackCanvas.height);
                fallbackCtx.drawImage(canvas, 0, 0);

                logo = fallbackCanvas.toDataURL(
                    "image/jpeg",
                    0.82
                );

                try{
                    localStorage.setItem(
                        "alm_company_logo",
                        logo
                    );
                }catch(secondError){
                    alert(
                        "The logo could not be saved. Please use a smaller logo image."
                    );
                    input.value = "";
                    return;
                }

            }

            const preview =
                document.getElementById(
                    "weeklyCompanyLogoPreview"
                );

            const placeholder =
                document.getElementById(
                    "weeklyCompanyLogoPlaceholder"
                );

            if(preview){
                preview.src = logo;
                preview.style.display = "block";
            }

            if(placeholder){
                placeholder.style.display = "none";
            }

        };

        image.onerror = function(){
            alert("The selected logo image could not be loaded.");
            input.value = "";
        };

        image.src = source;

    };

    reader.onerror = function(){
        alert("The logo file could not be read.");
        input.value = "";
    };

    reader.readAsDataURL(file);
};

/* =====================================================

===================================================== */

function ensureReportsFolders(project){

    if(!Array.isArray(project.reportsFolders)){

        project.reportsFolders = [

            {
                id: "root",
                name: "Reports",
                parentId: null
            }

        ];

        persist();

    }

    if(
        !project.reportsFolders.some(
            folder =>
                String(folder.id) === "root"
        )
    ){

        project.reportsFolders.unshift({

            id: "root",
            name: "Reports",
            parentId: null

        });

        persist();

    }

    return project.reportsFolders;

}


/* =====================================================
   ENSURE REPORTS

function ensureReports(project){

    if(!Array.isArray(project.reports)){

        project.reports = [];

        persist();

    }

    return project.reports;

}


/* =====================================================
   REPORTS INDEXED DB
===================================================== */

function getReportsFileDB(){

    return new Promise(function(resolve,reject){

        const request =
            indexedDB.open(
                "ALM_Reports_Files",
                1
            );


        request.onupgradeneeded = function(){

            const db = request.result;


            if(
                !db.objectStoreNames.contains(
                    "files"
                )
            ){

                db.createObjectStore(
                    "files"
                );

            }

        };


        request.onsuccess = function(){

            resolve(
                request.result
            );

        };


        request.onerror = function(){

            reject(
                request.error
            );

        };

    });

}


/* =====================================================
   SAVE REPORT FILE
===================================================== */

async function saveReportFile(
    fileId,
    file
){

    const db =
        await getReportsFileDB();


    return new Promise(function(resolve,reject){

        const transaction =
            db.transaction(
                "files",
                "readwrite"
            );


        const store =
            transaction.objectStore(
                "files"
            );


        const request =
            store.put(
                file,
                fileId
            );


        request.onsuccess =
            function(){

                resolve(true);

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* =====================================================
   GET REPORT FILE
===================================================== */

async function getReportFile(
    fileId
){

    if(!fileId){

        return null;

    }


    const db =
        await getReportsFileDB();


    return new Promise(function(resolve,reject){

        const transaction =
            db.transaction(
                "files",
                "readonly"
            );


        const store =
            transaction.objectStore(
                "files"
            );


        const request =
            store.get(
                fileId
            );


        request.onsuccess =
            function(){

                resolve(
                    request.result || null
                );

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* =====================================================
   DELETE REPORT FILE
===================================================== */

async function deleteReportFile(
    fileId
){

    if(!fileId){

        return;

    }


    const db =
        await getReportsFileDB();


    return new Promise(function(resolve,reject){

        const transaction =
            db.transaction(
                "files",
                "readwrite"
            );


        const store =
            transaction.objectStore(
                "files"
            );


        const request =

            );


        request.onsuccess =
            function(){

                resolve(true);

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}

window.boqCurrentFolder = window.boqCurrentFolder || {};

function ensureBOQFolders(project){

    if(!project.boqFolders){

        project.boqFolders = [
            {
                id: "root",
                name: "BOQ",
                parentId: null
            }
        ];

        persist();
    }

    if(!project.boqFolders.find(function(folder){
        return folder.id === "root";
    })){

        project.boqFolders.unshift({
            id: "root",
            name: "BOQ",
            parentId: null
        });

        persist();
    }

    return project.boqFolders;
}


function createBOQFolder(projectId){

   const project = projects.find(
    p => String(p.id) === String(projectId)
);

    if(!project){
        alert("Project not found");
        return;
    }

    ensureBOQFolders(project);

    const folderName = prompt("Enter folder name:");

    if(!folderName || !folderName.trim()){
        return;
    }

    const currentFolderId =
        window.boqCurrentFolder[projectId] || "root";

    project.boqFolders.push({

        id: "boq_folder_" + Date.now(),

        name: folderName.trim(),

        parentId: currentFolderId

    });

    persist();

    renderBOQSection(project);
}

function openBOQFolder(projectId, folderId){

    const project = projects.find(function(p){
        return p.id === projectId;
    });

    if(!project) return;

    window.boqCurrentFolder[projectId] = folderId;

    renderBOQSection(project);
}


function goBackBOQFolder(projectId){

   const project = projects.find(function(p){
    return String(p.id) === String(projectId);
});

    if(!project) return;

    ensureBOQFolders(project);

    const currentFolderId =
        window.boqCurrentFolder[projectId] || "root";

    const currentFolder =
        project.boqFolders.find(function(folder){
            return folder.id === currentFolderId;
        });

    if(!currentFolder || !currentFolder.parentId){

        window.boqCurrentFolder[projectId] = "root";

    }else{

        window.boqCurrentFolder[projectId] =
            currentFolder.parentId;
    }

    renderBOQSection(project);
}

    const project = projects.find(function(p){
        return String(p.id) === String(projectId);
    });

    if(!project) return;

    ensureBOQFolders(project);

    const folder = project.boqFolders.find(function(f){

    });

    const newName = prompt(

    folder.name = newName.trim();

    persist();

    showProjectSection("boq", projectId);
};


/* =========================
   DELETE BOQ FOLDER
========================= */

window.deleteBOQFolder = function(projectId, folderId){

    const project = projects.find(function(p){
        return String(p.id) === String(projectId);
    });

    if(!project) return;

    ensureBOQFolders(project);

    if(String(folderId) === "root"){
        alert("The main BOQ folder cannot be deleted.");
        return;
    }

    const folder = project.boqFolders.find(function(f){
        return String(f.id) === String(folderId);
    });

    if(!folder) return;

    const confirmed = confirm(
        'Are you sure you want to delete "' +
        folder.name +
        '"?'
    );

    if(!confirmed) return;

    project.boqFolders =
        project.boqFolders.filter(function(f){
            return String(f.id) !== String(folderId);
        });

    persist();

    window.boqCurrentFolder[projectId] = "root";

    showProjectSection("boq", projectId);
};
    /* =========================

========================= */

window.downloadBOQ = function(projectId, index){

    const project = projects.find(function(p){
        return String(p.id) === String(projectId);
    });

    if(!project || !project.boqs) return;

    const boq = project.boqs[index];

    if(!boq || !boq.fileData){
        alert("No file is attached to this BOQ.");
        return;
    }

    const link = document.createElement("a");

    link.href = boq.fileData;
    link.download = boq.fileName || "BOQ";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

/* =====================================================
   FILTER REPORTS TABLE
   FAST DOM SEARCH
===================================================== */

window.filterReportsTable = function(
    searchValue
){

    const searchTerm =
        String(
            searchValue || ""
        )
        .toLowerCase()
        .trim();


    const table =
        document.querySelector(
            "#projectSectionContent table"
        );


    if(!table){

        return;

    }


    const rows =
        table.querySelectorAll(
            "tbody tr"
        );


    rows.forEach(function(row){

        const cells =
            row.querySelectorAll(
                "td"
            );


        if(cells.length < 2){

            return;

        }


        const reportName =
            String(
                cells[0].textContent || ""
            )
            .toLowerCase();


        const fileType =
            String(
                cells[1].textContent || ""
            )
            .toLowerCase();


        const matches =
            !searchTerm ||

            reportName.includes(
                searchTerm
            ) ||

            fileType.includes(
                searchTerm
            );


        row.style.display =
            matches
            ? ""
            : "none";

    });

};

window.createReportsFolder =
function(
    projectId,
    parentId
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        return;

    }


    ensureReportsFolders(project);


    const folderName =
        prompt(
            parentId === null
            ? "Enter main folder name:"
            : "Enter subfolder name:"
        );


    if(folderName === null){

        return;

    }


    const cleanName =
        folderName.trim();


    if(!cleanName){

        alert(
            "Folder name is required."
        );

        return;

    }


    const duplicate =
        project.reportsFolders.some(
            folder =>

                String(
                    folder.parentId || null
                ) ===

                String(
                    parentId || null
                )

                &&

                String(
                    folder.name
                )
                .trim()
                .toLowerCase() ===

                cleanName.toLowerCase()
        );


    if(duplicate){

        alert(
            "A folder with this name already exists in this location."
        );

        return;

    }


    project.reportsFolders.push({

        id:
            "report_folder_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:
            cleanName,

        parentId:
            parentId === null
            ? null
            : parentId

    });


    persist();


    renderReportsSection(
        project
    );

};


/* =====================================================
   RENAME REPORTS FOLDER
===================================================== */

window.renameReportsFolder =
function(
    projectId,
    folderId
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        return;

    }


    ensureReportsFolders(project);


    if(String(folderId) === "root"){

        alert(
            "The root Reports folder cannot be renamed."
        );

        return;

    }


    const folder =
        project.reportsFolders.find(
            item =>
                String(item.id) ===
                String(folderId)
        );


    if(!folder){

        return;

    }


    const newName =
        prompt(
            "Enter new folder name:",
            folder.name
        );


    if(newName === null){

        return;

    }


    const cleanName =
        newName.trim();


    if(!cleanName){

        alert(
            "Folder name is required."
        );

        return;

    }


    const duplicate =
        project.reportsFolders.some(
            item =>

                String(item.id) !==
                String(folder.id)

                &&

                String(
                    item.parentId || null
                ) ===

                String(
                    folder.parentId || null
                )

                &&

                String(item.name)
                    .trim()
                    .toLowerCase() ===
                cleanName.toLowerCase()
        );


    if(duplicate){

        alert(
            "A folder with this name already exists in this location."
        );

        return;

    }


    folder.name =
        cleanName;


    persist();


    renderReportsSection(
        project
    );

};

/* =====================================================
   DELETE REPORTS FOLDER
===================================================== */

window.deleteReportsFolder =
async function(
    projectId,
    folderId
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        return;

    }


    ensureReportsFolders(project);

    ensureReports(project);


    if(String(folderId) === "root"){

        alert(
            "The root Reports folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.reportsFolders.find(
            item =>
                String(item.id) ===
                String(folderId)
        );


    if(!folder){

        return;

    }


    const confirmed =
        confirm(
            `Delete folder "${folder.name}" and all its subfolders and reports?`
        );


    if(!confirmed){

        return;

    }


    /* =========================
       FIND ALL DESCENDANTS
    ========================= */

    const folderIds =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.reportsFolders.forEach(
            child => {

                if(
                    child.parentId !== null
                    &&
                    folderIds.has(
                        String(child.parentId)
                    )
                    &&
                    !folderIds.has(
                        String(child.id)
                    )
                ){

                    folderIds.add(
                        String(child.id)
                    );

                    changed = true;

                }

            }
        );

    }


    /* =========================
       DELETE ASSOCIATED FILES
    ========================= */

    const reportsToDelete =
        project.reports.filter(
            report =>
                folderIds.has(
                    String(
                        report.folderId
                    )
                )
        );


    for(
        const report
        of reportsToDelete
    ){

        if(report.fileId){

            try{

                await deleteReportFile(
                    report.fileId
                );

            }catch(error){

                console.error(
                    "Failed to delete report file:",
                    error
                );

            }

        }

    }


    /* =========================
       DELETE REPORT RECORDS
    ========================= */

    project.reports =
        project.reports.filter(
            report =>
                !folderIds.has(
                    String(
                        report.folderId
                    )
                )
        );


    /* =========================
       DELETE FOLDERS
    ========================= */

    project.reportsFolders =
        project.reportsFolders.filter(
            item =>
                !folderIds.has(
                    String(item.id)
                )
        );


    /* =========================
       RETURN TO PARENT
    ========================= */

    if(
        folderIds.has(
            String(
                window.reportsCurrentFolder[
                    projectId
                ]
            )
        )
    ){

        window.reportsCurrentFolder[
            projectId
        ] =

            folder.parentId === null
            ? null
            : folder.parentId;

    }


    persist();


    renderReportsSection(
        project
    );

};

/* =====================================================
   PROCESS REPORT UPLOAD
===================================================== */

async function processReportUpload(
    projectId,
    folderId,
    file
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        return;

    }


    const title =
        prompt(
            "Enter report title:",
            file.name
        );


    if(title === null){

        return;

    }


    const cleanTitle =
        title.trim();


    if(!cleanTitle){

        alert(
            "Report title is required."
        );

        return;

    }


    const uploadedBy =
        prompt(
            "Uploaded by:"
        );


    if(uploadedBy === null){

        return;

    }


    const cleanUploadedBy =
        uploadedBy.trim();


    const fileId =
        "report_file_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,8);


    try{

        await saveReportFile(
            fileId,
            file
        );

    }catch(error){

        console.error(
            error
        );

        alert(
            "Failed to save the report file."
        );

        return;

    }


    project.reports =
        Array.isArray(project.reports)
        ? project.reports
        : [];


    project.reports.push({

        id:
            "report_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8),

        folderId:
            folderId === null
            ? null
            : folderId,

        title:
            cleanTitle,

        fileName:
            file.name,

        fileType:
            file.type ||
            "Unknown",

        uploadedBy:
            cleanUploadedBy,

        date:
            new Date()
                .toISOString()
                .split("T")[0],

        fileId:
            fileId,

        createdAt:
            new Date()
                .toISOString()

    });


    persist();


    renderReportsSection(
        project
    );

}

function ensureTodoList(project){

    if(!Array.isArray(project.todoList)){
        project.todoList = [];
        persist();
    }

    return project.todoList;
}


/* =====================================================
   TODO DATE STATUS
===================================================== */

function getTodoStatus(item){

    if(
        String(item.status || "").toLowerCase() ===
        "completed"
    ){
        return "Done";
    }

    if(!item.dueDate){
        return "Upcoming";
    }

    const today = new Date();
    today.setHours(0,0,0,0);

    const dueDate = new Date(item.dueDate);
    dueDate.setHours(0,0,0,0);

    const diffMs =
        dueDate.getTime() -
        today.getTime();

    const daysLeft =
        Math.ceil(
            diffMs /
            (1000 * 60 * 60 * 24)
        );

    if(daysLeft < 0){
        return "Overdue";
    }

    if(daysLeft <= 2){
        return "Urgent";
    }

    if(daysLeft <= 7){
        return "Reminder";
    }

    return "Upcoming";
}


/* =====================================================
   TODO DAYS LEFT
===================================================== */

function getTodoDaysLeft(item){

    if(
        String(item.status || "").toLowerCase() ===
        "completed"
    ){
        return "Done";
    }

    if(!item.dueDate){
        return "-";
    }

    const today = new Date();
    today.setHours(0,0,0,0);

    const dueDate = new Date(item.dueDate);
    dueDate.setHours(0,0,0,0);

    const diffMs =
        dueDate.getTime() -
        today.getTime();

    const daysLeft =
        Math.ceil(
            diffMs /
            (1000 * 60 * 60 * 24)
        );

    if(daysLeft < 0){
        return `${Math.abs(daysLeft)} day(s) overdue`;
    }

    if(daysLeft === 0){
        return "Due today";
    }

    if(daysLeft === 1){
        return "1 day left";
    }

    return `${daysLeft} days left`;
}


/* =====================================================
   TODO STATUS BADGE
===================================================== */

function todoStatusBadge(item){

    const status =
        getTodoStatus(item);

    let style =
        "background:#e9ecef;color:#495057;";

    if(status === "Overdue"){
        style =
            "background:#f8d7da;color:#842029;";
    }

    if(status === "Urgent"){
        style =
            "background:#fde2e2;color:#b42318;";
    }

    if(status === "Reminder"){
        style =
            "background:#fff3cd;color:#856404;";
    }

    if(status === "Upcoming"){
        style =
            "background:#dbeafe;color:#1d4ed8;";
    }

    if(status === "Done"){
        style =
            "background:#d1e7dd;color:#0f5132;";
    }

    return `
        <span
            style="
                display:inline-block;
                padding:5px 10px;
                border-radius:20px;
                font-size:12px;
                font-weight:700;
                ${style}
            "
        >
            ${status}
        </span>
    `;
}


/* =====================================================
   TODO SORT
===================================================== */

function sortTodoList(items){

    const order = {
        "Overdue": 1,
        "Urgent": 2,
        "Reminder": 3,
        "Upcoming": 4,
        "Done": 5
    };

    return [...items].sort(function(a,b){

        const statusA =
            getTodoStatus(a);

        const statusB =
            getTodoStatus(b);

        const orderA =
            order[statusA] || 99;

        const orderB =
            order[statusB] || 99;

        if(orderA !== orderB){
            return orderA - orderB;
        }

        if(statusA === "Done"){
            return String(
                b.completedAt || ""
            ).localeCompare(
                String(a.completedAt || "")
            );
        }

        if(!a.dueDate) return 1;
        if(!b.dueDate) return -1;

        return String(
            a.dueDate
        ).localeCompare(
            String(b.dueDate)
        );

    });
}

window.saveTodoItem =
function(event, projectId){

    event.preventDefault();


    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project){
        return;
    }


    ensureTodoList(project);


    const status =
        document.getElementById(
            "todoStatus"
        ).value;


    const todo = {

        id:
            "TODO-" +
            Date.now(),

        title:
            document.getElementById(
                "todoTitle"
            ).value.trim(),

        description:
            document.getElementById(
                "todoDescription"
            ).value.trim(),

        assignedTo:
            document.getElementById(
                "todoAssignedTo"
            ).value.trim(),

        dueDate:
            document.getElementById(
                "todoDueDate"
            ).value,

        status,

        notes:
            document.getElementById(
                "todoNotes"
            ).value.trim(),

        createdAt:
            new Date().toISOString(),

        completedAt:
            status === "Completed"
                ? new Date().toISOString()
                : ""

/* =====================================================
   MONEY HELPERS
===================================================== */

function parsePaymentMoney(value){
    if(value === null || value === undefined || value === ""){
        return 0;
    }

    const cleaned = String(value)
        .replace(/,/g, "")
        .replace(/[^\d.-]/g, "");

    return Number(cleaned) || 0;
}


function formatPaymentMoney(value){
    return Number(value || 0).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function getPaymentContractValue(project){
    return parsePaymentMoney(
        project.contractValue ||
        project.contractAmount ||
        project.value ||
        0
    );
}


/* =====================================================
   PAYMENT STATUS
===================================================== */
/* =====================================================
   PAYMENT PAYABLE AMOUNT
   Payable = Invoice - WHT
===================================================== */

function getPaymentPayableAmount(payment){

    const invoice =
        parsePaymentMoney(
            payment.invoiceValue
        );

    const wht =
        parsePaymentMoney(
            payment.whtAmount
        );

    return Math.max(
        0,
        invoice - wht
    );

}

/* =====================================================
   PAYMENT STATUS
   PAYMENT IS COMPARED AGAINST PAYABLE AMOUNT
===================================================== */

function getPaymentStatus(payment){

    const payable =
        getPaymentPayableAmount(
            payment
        );

    const received =
        parsePaymentMoney(
            payment.paymentReceived
        );

    if(
        received > payable &&
        payable > 0
    ){

        return "Overpaid";

    }

    if(
        payable > 0 &&
        received >= payable
    ){

        return "Fully Paid";

    }

    if(
        received > 0 &&
        received < payable
    ){

        return "Partially Paid";

    }

    if(
        parsePaymentMoney(
            payment.invoiceValue
        ) > 0
    ){

        return "Invoiced";

    }

    return "Not Paid";

}
function getPaymentStatusColor(status){

    if(status === "Fully Paid"){
        return "#198754";
    }

    if(status === "Partially Paid"){
        return "#d39e00";
    }

    if(status === "Overpaid"){
        return "#dc3545";
    }

    return "#6c757d";
}


/* =====================================================
   PAYMENT STATUS BADGE
===================================================== */

function paymentStatusBadge(status){

    const color = getPaymentStatusColor(status);

    return `
        <span
            style="
                display:inline-block;
                padding:4px 9px;
                border-radius:12px;
                font-size:12px;
                font-weight:600;
                color:white;
                background:${color};
                white-space:nowrap;
            "
        >
            ${status}
        </span>
    `;
}

/* =====================================================
   UPDATE MONEY FIELD - LIVE
===================================================== */

window.updatePaymentAmount = function(
    projectId,
    index,
    field,
    value
){

    const project = getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }

    project.payments[index][field] =
        parsePaymentMoney(value);

    persist();

    /*
       IMPORTANT:
       We DO NOT call renderPaymentsSection() here.
       Only the affected row + summary are updated.
    */

    updatePaymentRowCalculations(
        projectId,
        index
    );

    updatePaymentSummary(project);

};


/* =====================================================
   UPDATE ROW CALCULATIONS
===================================================== */

function updatePaymentRowCalculations(
    projectId,
    index
){

    const project =
        getPaymentsProject(projectId);

    if(!project || !project.payments[index]){
        return;
    }

    const payment =
        project.payments[index];

  const invoice =
    parsePaymentMoney(
        payment.invoiceValue
    );

const wht =
    parsePaymentMoney(
        payment.whtAmount
    );

const payable =
    Math.max(
        0,
        invoice - wht
    );

const received =
    parsePaymentMoney(
        payment.paymentReceived
    );

const balance =
    payable - received;
    const payableCell =
    document.getElementById(
        `payment-payable-${index}`
    );

if(payableCell){

    payableCell.textContent =
        formatPaymentMoney(
            payable
        );

}

    const status =
        getPaymentStatus(payment);


    const balanceCell =
        document.getElementById(
            `payment-balance-${index}`
        );

    if(balanceCell){

        balanceCell.textContent =
            formatPaymentMoney(balance);

        balanceCell.style.color =
            balance < 0
            ? "#dc3545"
            : "#333";
    }


    const statusCell =
        document.getElementById(
            `payment-status-${index}`
        );

    if(statusCell){

        statusCell.innerHTML =
            paymentStatusBadge(status);
    }

}


/* =====================================================
   UPDATE SUMMARY - LIVE
===================================================== */

function updatePaymentSummary(project){

    if(!project){
        return;
    }

    let totalInvoiced = 0;
    let totalReceived = 0;

    (project.payments || []).forEach(payment => {

        totalInvoiced +=
            parsePaymentMoney(
                payment.invoiceValue
            );

        totalReceived +=
            parsePaymentMoney(
                payment.paymentReceived
            );

    });


    const contractValue =
        getPaymentContractValue(project);

    const outstanding =
        totalInvoiced - totalReceived;

    const invoicedPercent =
        contractValue > 0
        ? (totalInvoiced / contractValue) * 100
        : 0;

    const paidPercent =
        contractValue > 0
        ? (totalReceived / contractValue) * 100
        : 0;


    const totalInvoiceElement =
        document.getElementById(
            "payments-total-invoice"
        );

    if(totalInvoiceElement){

        totalInvoiceElement.textContent =
            formatPaymentMoney(totalInvoiced);

    }


    const totalReceivedElement =
        document.getElementById(
            "payments-total-received"
        );

    if(totalReceivedElement){

        totalReceivedElement.textContent =
            formatPaymentMoney(totalReceived);

    }


    const totalBalanceElement =
        document.getElementById(
            "payments-total-balance"
        );

    if(totalBalanceElement){

        totalBalanceElement.textContent =
            formatPaymentMoney(outstanding);

        totalBalanceElement.style.color =
            outstanding < 0
            ? "#dc3545"
            : "#333";
    }


    const invoicedPercentElement =
        document.getElementById(
            "payments-invoiced-percent"
        );

    if(invoicedPercentElement){

        invoicedPercentElement.textContent =
            `${invoicedPercent.toFixed(2)}% of Contract`;

    }


    const paidPercentElement =
        document.getElementById(
            "payments-paid-percent"
        );

    if(paidPercentElement){

        paidPercentElement.textContent =
            `${paidPercent.toFixed(2)}% of Contract`;

    }


    const contractPaidElement =
        document.getElementById(
            "payments-contract-paid"
        );

    if(contractPaidElement){

        contractPaidElement.textContent =
            `${paidPercent.toFixed(2)}%`;

    }

}

/* =====================================================
   VIEW INVOICE
===================================================== */

window.viewPaymentInvoice = function(
    projectId,
    index
){

    const project =
        getPaymentsProject(projectId);

    if(
        !project ||
        !project.payments ||
        !project.payments[index]
    ){
        return;
    }

    const payment =
        project.payments[index];

    const fileData =
        payment.fileData ||
        payment.invoiceFileData;

    if(!fileData){

        alert("No Invoice PDF is attached.");

        return;
    }


    try{

        const base64 =
            fileData.split(",")[1];

        if(!base64){

            alert("Invalid Invoice PDF data.");

            return;
        }


        const byteCharacters =
            atob(base64);

        const byteNumbers =
            new Array(
                byteCharacters.length
            );

        for(
            let i = 0;
            i < byteCharacters.length;
            i++
        ){

            byteNumbers[i] =
                byteCharacters.charCodeAt(i);

        }


        const byteArray =
            new Uint8Array(
                byteNumbers
            );


        const blob =
            new Blob(
                [byteArray],
                {
                    type:"application/pdf"
                }
            );


        const url =
            URL.createObjectURL(blob);


        window.open(
            url,
            "_blank"
        );


    }catch(error){

        console.error(
            "Invoice PDF error:",
            error
        );

        alert(
            "Unable to open the Invoice PDF."
        );

    }

};

/* =====================================================
   VARIATIONS MODULE
   REDESIGNED - FINANCIAL + PAYMENT STAGES

   Main Variation:
   Submitted Value
   WHT Amount
   Payable Amount = Submitted - WHT
   Payment Received = SUM(Payment Stages)
   Outstanding = Payable - Payment Received

   Payment Stage:
   Stage
   Invoice Value
   WHT Amount
   Payable Amount = Invoice - WHT
   Payment Received
   Balance = Payable - Payment Received
   Invoice Date
   Date Received
   Status
   Invoice PDF
===================================================== */


/* =====================================================
   VARIATION HELPERS
===================================================== */

function getVariationsProject(projectId){

    return projects.find(
        p =>
            String(p.id) ===
            String(projectId)
    );

}


function parseVariationMoney(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return 0;
    }

    if(typeof value === "number"){
        return isNaN(value) ? 0 : value;
    }

    const cleaned =
        String(value)
            .replace(/,/g,"")
            .replace(/[^\d.-]/g,"");

    const number =
        parseFloat(cleaned);

    return isNaN(number)
        ? 0
        : number;

}


function formatVariationMoney(value){

    const number =
        parseVariationMoney(value);

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


function variationEscape(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatVariationInput(input){

    if(!input){
        return;
    }

    const value =
        parseVariationMoney(
            input.value
        );

    if(
        input.value !== "" &&
        !isNaN(value)
    ){
        input.value =
            formatVariationMoney(value);
    }

}

/* =====================================================
   PAYMENT TOTALS
===================================================== */

function getVariationPaymentTotals(
    variation
){

    let invoiced = 0;

    let wht = 0;

    let payable = 0;

    let received = 0;

    (
        variation.paymentStages ||
        []
    )
    .forEach(
        function(stage){

            const invoice =
                parseVariationMoney(
                    stage.invoiceValue
                );

            const stageWHT =
                parseVariationMoney(
                    stage.whtAmount
                );

            const stagePayable =
                Math.max(
                    0,
                    invoice - stageWHT
                );

            const stageReceived =
                parseVariationMoney(
                    stage.paymentReceived !== undefined
                    ? stage.paymentReceived
                    : stage.receivedValue
                );

            invoiced +=
                invoice;

            wht +=
                stageWHT;

            payable +=
                stagePayable;

            received +=
                stageReceived;

        }
    );

    return {

        invoiced,

        wht,

        payable,

        received,

        outstanding:
            payable - received

    };

}


/* =====================================================
   FINANCIAL STATUS
===================================================== */

function getVariationFinancialStatus(
    variation
){

    const submitted =
        parseVariationMoney(
            variation.submittedValue
        );

    const wht =
        parseVariationMoney(
            variation.whtAmount
        );

    const payable =
        Math.max(
            0,
            submitted - wht
        );

    const totals =
        getVariationPaymentTotals(
            variation
        );

    const received =
        totals.received;

    if(payable <= 0){

        if(submitted > 0){
            return "Payable Not Set";
        }

        return "Not Paid";

    }

    if(received <= 0){

        if(totals.invoiced > 0){
            return "Invoiced";
        }

        return "Not Paid";

    }

    if(received > payable){
        return "Overpaid";
    }

    if(received >= payable){
        return "Fully Paid";
    }

    return "Partially Paid";

}


/* =====================================================
   UPDATE VARIATION SUMMARY
===================================================== */

function updateVariationSummary(project){

    if(!project){
        return;
    }

    let totalSubmitted = 0;
    let totalWHT = 0;
    let totalPayable = 0;
    let totalReceived = 0;
    let totalOutstanding = 0;

    (
        project.variations ||
        []
    )
    .forEach(
        function(variation){

            const submitted =
                parseVariationMoney(
                    variation.submittedValue
                );

            const wht =
                parseVariationMoney(
                    variation.whtAmount
                );

            const payable =
                Math.max(
                    0,
                    submitted - wht
                );

            const totals =
                getVariationPaymentTotals(
                    variation
                );

            variation.payableAmount =
                payable;

            variation.paymentReceived =
                totals.received;

            totalSubmitted +=
                submitted;

            totalWHT +=
                wht;

            totalPayable +=
                payable;

            totalReceived +=
                totals.received;

            totalOutstanding +=
                payable -
                totals.received;

        }
    );

    const submittedEl =
        document.getElementById(
            "variations-total-submitted"
        );

    const whtEl =
        document.getElementById(
            "variations-total-wht"
        );

    const payableEl =
        document.getElementById(
            "variations-total-payable"
        );

    const receivedEl =
        document.getElementById(
            "variations-total-received"

/* =====================================================
   ADD VARIATION
===================================================== */

window.addVariationRow =
function(projectId){

    const project =
        getVariationsProject(
            projectId
        );

    if(!project){
        return;
    }

    if(!project.variations){
        project.variations = [];
    }

    let nextNumber = 1;

    project.variations.forEach(
        function(variation){

            const match =
                String(
                    variation.variationNumber ||
                    ""
                )
                .match(
                    /(\d+)$/
                );

            if(match){

                nextNumber =
                    Math.max(
                        nextNumber,
                        Number(match[1]) + 1
                    );

            }

        }
    );

    project.variations.push({

        variationNumber:
            "V-" +
            String(nextNumber)
                .padStart(3,"0"),

        variationType:
            "",

        description:
            "",

        contractor:
            "",

        submittedValue:
            "",

        whtAmount:
            "",

        payableAmount:
            "",

        paymentReceived:
            "",

        status:
            "Draft",

        paymentStages:
            []

    });

    persist();

    renderVariationsSection(
        project
    );

};

   UPDATE VARIATION FIELD
===================================================== */

window.updateVariationField =
function(
    projectId,
    index,
    field,
    value
){

        getVariationsProject(
            projectId
        );

    if(
        !project ||
        !project.variations ||
        !project.variations[index]
    ){
        return;
    }

    project.variations[index][field] =
        value;

    persist();

    renderVariationsSection(
        project
    );

};

function(

        getVariationsProject(

    if(

    const variation =

    variation[field] =
        value;

    const submitted =
        parseVariationMoney(
            variation.submittedValue
        );

    const wht =
        parseVariationMoney(
            variation.whtAmount
        );

    variation.payableAmount =

        );

    const totals =
        getVariationPaymentTotals(

    variation.paymentReceived =
        totals.received;

    persist();

    updateVariationSummary(
        project
    );

    refreshVariationFinancialDisplays(
        project,
        index
    );

    updateVariationStageSummaryInPlace(
        project,

/* =====================================================
   PAYMENT STAGES vs MAIN VARIATION VALIDATION
===================================================== */

function validateVariationPaymentStages(
    project,
    variationIndex
){

    const variation =
        project.variations[
            variationIndex
        ];

    if(!variation){
        return;
    }

    const stages =
        Array.isArray(
            variation.paymentStages
        )
        ? variation.paymentStages
        : [];

    /*
       MAIN VARIATION VALUES
    */

    const variationWHT =
        parseVariationMoney(
            variation.whtAmount
        );

    const variationPayable =
        Math.max(
            0,
            parseVariationMoney(
                variation.submittedValue
            ) -
            variationWHT
        );

    const variationPaymentReceived =
        stages.reduce(
            function(total, stage){

                return total +
                    parseVariationMoney(
                        stage.paymentReceived !== undefined
                            ? stage.paymentReceived
                            : stage.receivedValue
                    );

            },
            0
        );

    const variationOutstanding =
        variationPayable -
        variationPaymentReceived;

    /*
       STAGE TOTALS
    */

    let totalStageInvoice = 0;

    let totalStageWHT = 0;

    let totalStagePayable = 0;

    let totalStageReceived = 0;

    let totalStageBalance = 0;

    stages.forEach(
        function(stage){

            const invoice =
                parseVariationMoney(
                    stage.invoiceValue
                );

            const wht =
                parseVariationMoney(
                    stage.whtAmount
                );

            const payable =
                Math.max(
                    0,
                    invoice - wht
                );

            const received =
                parseVariationMoney(
                    stage.paymentReceived !== undefined
                        ? stage.paymentReceived
                        : stage.receivedValue
                );

            const balance =
                payable - received;

            totalStageInvoice +=
                invoice;

            totalStageWHT +=
                wht;

            totalStagePayable +=
                payable;

            totalStageReceived +=
                received;

            totalStageBalance +=
                balance;

        }
    );

    /*
       DIFFERENCES
    */

    const payableDifference =
        totalStagePayable -
        variationPayable;

    const whtDifference =
        totalStageWHT -
        variationWHT;

    const balanceDifference =
        totalStageBalance -
        variationOutstanding;

    const hasPayableDifference =
        Math.abs(
            payableDifference
        ) > 0.01;

    const hasWHTDifference =
        Math.abs(
            whtDifference
        ) > 0.01;

    const hasBalanceDifference =
        Math.abs(
            balanceDifference
        ) > 0.01;

    /*
       FIND VALIDATION CONTAINER
    */

    const stagesRow =
        document.getElementById(
            `variation-stages-${variationIndex}`
        );

    if(!stagesRow){
        return;
    }

    const container =
        stagesRow.querySelector(
            "td"
        );

    if(!container){
        return;
    }

    let validationBox =
        document.getElementById(
            `variation-stage-validation-${variationIndex}`
        );

    /*
       CREATE VALIDATION BOX
    */

    if(!validationBox){

        validationBox =
            document.createElement(
                "div"
            );

        validationBox.id =
            `variation-stage-validation-${variationIndex}`;

        validationBox.style.margin =
            "10px 0";

        container.insertBefore(
            validationBox,
            container.firstChild
        );

    }

    /*
       NO DIFFERENCE
    */

    if(
        !hasPayableDifference &&
        !hasWHTDifference &&
        !hasBalanceDifference
    ){

        validationBox.innerHTML =
            "";

        validationBox.style.display =
            "none";

        return;

    }

    /*
       BUILD WARNINGS
    */

    let warnings = [];

    if(hasPayableDifference){

        warnings.push(`
            <div style="margin-bottom:5px;">
                <strong>Payable Mismatch:</strong>
                Stage Payable =
                ${formatVariationMoney(totalStagePayable)}
                |
                Variation Payable =
                ${formatVariationMoney(variationPayable)}
            </div>
        `);

    }

    if(hasWHTDifference){

        warnings.push(`
            <div style="margin-bottom:5px;">
                <strong>WHT Mismatch:</strong>
                Stage WHT =
                ${formatVariationMoney(totalStageWHT)}
                |
                Variation WHT =
                ${formatVariationMoney(variationWHT)}
            </div>
        `);

    }

    if(hasBalanceDifference){

        warnings.push(`
            <div>
                <strong>Outstanding Mismatch:</strong>
                Stage Balance =
                ${formatVariationMoney(totalStageBalance)}
                |
                Variation Outstanding =
                ${formatVariationMoney(variationOutstanding)}
            </div>
        `);

    }

    /*
       DISPLAY WARNING
       NON-BLOCKING
    */

    validationBox.innerHTML = `
        <div style="
            background:#fff3cd;
            border:1px solid #ffc107;
            color:#856404;
            border-radius:6px;
            padding:10px 12px;
            font-size:12px;
            line-height:1.5;
        ">

            <strong>
                ⚠ Payment Stage Validation Warning
            </strong>

            <div style="
                margin-top:6px;
            ">

                ${warnings.join("")}

            </div>

            <div style="
                margin-top:7px;
                font-size:11px;
                color:#6c757d;
            ">

                You may continue working. This warning does not
                prevent payment stage entry or submission.

            </div>

        </div>
    `;

    validationBox.style.display =
        "block";

}

/* =====================================================
   VARIATION PDF DATABASE
===================================================== */

let variationFileDBPromise = null;


function getVariationFileDB(){

    if(variationFileDBPromise){
        return variationFileDBPromise;
    }

    variationFileDBPromise =
        new Promise(
            function(resolve,reject){

                const request =
                    indexedDB.open(
                        "ALM_Variation_Files",
                        1
                    );

                request.onupgradeneeded =
                function(event){

                    const db =
                        event.target.result;

                    if(
                        !db.objectStoreNames.contains(
                            "files"
                        )
                    ){

                        db.createObjectStore(
                            "files",
                            {
                                keyPath:"id"
                            }
                        );

                    }

                };

                request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };

                request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

            }
        );

    return variationFileDBPromise;

}


/* =====================================================
   SAVE PDF
===================================================== */

async function saveVariationPDF(
    fileId,
    file
){

    const db =
        await getVariationFileDB();

    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "files"
                );

            store.put({

                id:fileId,

                name:file.name,

                type:
                    file.type ||
                    "application/pdf",

                blob:file

            });

            transaction.oncomplete =
            function(){

                resolve();

            };

            transaction.onerror =
            function(){

                reject(
                    transaction.error
                );

            };

        }
    );

}


/* =====================================================
   GET PDF
===================================================== */

async function getVariationPDF(
    fileId
){

    if(!fileId){
        return null;
    }

    const db =
        await getVariationFileDB();

    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    "files",
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    "files"
                );

            const request =
                store.get(
                    fileId
                );

            request.onsuccess =
            function(){

                resolve(
                    request.result ||
                    null
                );

            };

            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =====================================================
   DELETE PDF
===================================================== */

async function deleteVariationPDF(
    fileId
){

    if(!fileId){
        return;
    }

    try{

        const db =
            await getVariationFileDB();

        await new Promise(
            function(resolve,reject){

                const transaction =
                    db.transaction(
                        "files",
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        "files"
                    );

                store.delete(
                    fileId
                );

                transaction.oncomplete =
                function(){

                    resolve();

                };

                transaction.onerror =
                function(){

                    reject(
                        transaction.error
                    );

                };

            }
        );

    }
    catch(error){

        console.error(
            "PDF delete error:",
            error
        );

    }

}

function almMP2Today(){

    const d = new Date();

    const year =
        d.getFullYear();

    const month =
        String(d.getMonth() + 1)
        .padStart(2,"0");

    const day =
        String(d.getDate())
        .padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =====================================================
   CHECK ACTIVE MANPOWER
===================================================== */

function almMP2IsActive(
    record,
    selectedDate
){

    if(!record.startDate || !record.endDate){
        return false;
    }

    return (
        record.startDate <= selectedDate &&
        selectedDate <= record.endDate
    );

}

===================================================== */

            );

                    record.type === "Subcontractor"
            )

            );

                        ).trim()

                .map(

                        ).trim()
                )
                .filter(Boolean)
        );


    return {

        total,

        direct,

        subcontractor,

        activeDeployments:

/* =====================================================

window.almUpdateManpowerField = function(
    projectId,
    index,
    field,
    value
){

    const project =
        projects.find(
            p => String(p.id) === String(projectId)
        );

    if(!project){
        return;
    }

    almEnsureManpower(project);

    if(!project.manpowerRecords[index]){
        return;
    }


    if(field === "manpower"){

        project.manpowerRecords[index][field] =
            Math.max(
                0,
                Number(value || 0)
            );

    }else{

        project.manpowerRecords[index][field] =
            value;

    }


    persist();

};

===================================================== */

window.almDeleteManpower = function(
    projectId,
    index
){

    const project =
        projects.find(
            p => String(p.id) === String(projectId)

    if(!project){

    if(!project.manpowerRecords[index]){

    project.manpowerRecords.splice(

    );

/* =====================================================
   GET PROJECT DATE RANGE
===================================================== */

function almMP3GetProjectDateRange(project){

    const records =
        project.manpowerRecords || [];


    const validRecords =
        records.filter(
            record =>
                record.startDate &&
                record.endDate
        );


    if(!validRecords.length){

        return null;

    }


    let startDate =
        validRecords[0].startDate;

    let endDate =
        validRecords[0].endDate;


    validRecords.forEach(
        record => {

            if(
                record.startDate <
                startDate
            ){

                startDate =
                    record.startDate;

            }


            if(
                record.endDate >
                endDate
            ){

                endDate =
                    record.endDate;

            }

        }
    );


    return {

        startDate,

        endDate

    };

}


/* =====================================================
   MONTHLY MANPOWER CALCULATION
===================================================== */

function almMP3GetMonthlyData(project){

    const records =
        project.manpowerRecords || [];


    const range =
        almMP3GetProjectDateRange(project);


    if(!range){

        return [];

    }


    const start =
        new Date(
            range.startDate + "T00:00:00"
        );


    const end =
        new Date(
            range.endDate + "T00:00:00"
        );


    start.setDate(1);

    end.setDate(1);


    const months = [];


    let cursor =
        new Date(start);


    while(cursor <= end){

        const year =
            cursor.getFullYear();

        const month =
            cursor.getMonth();


        const monthStart =
            new Date(
                year,
                month,
                1
            );


        const monthEnd =
            new Date(
                year,
                month + 1,
                0
            );


        const monthStartString =
            almMP3DateString(
                monthStart
            );


        const monthEndString =
            almMP3DateString(
                monthEnd
            );


        const dailyValues = [];

        const dailyDirect = [];

        const dailySubcontractor = [];


        let day =
            new Date(monthStart);


        while(day <= monthEnd){

            const dayString =
                almMP3DateString(day);


            const active =
                records.filter(
                    record =>
                        record.startDate &&
                        record.endDate &&
                        record.startDate <= dayString &&
                        dayString <= record.endDate
                );


            let total = 0;

            let direct = 0;

            let subcontractor = 0;


            active.forEach(
                record => {

                    const manpower =
                        Number(
                            record.manpower || 0
                        );


                    total += manpower;


                    if(
                        record.type ===
                        "Subcontractor"
                    ){

                        subcontractor +=
                            manpower;

                    }else{

                        direct +=
                            manpower;

                    }

                }
            );


            dailyValues.push(total);

            dailyDirect.push(direct);

            dailySubcontractor.push(
                subcontractor
            );


            day.setDate(
                day.getDate() + 1
            );

        }


        const average =
            dailyValues.length
            ?
            dailyValues.reduce(
                (a,b) => a + b,
                0
            ) / dailyValues.length
            :
            0;


        const peak =
            dailyValues.length
            ?
            Math.max(
                ...dailyValues
            )
            :
            0;


        const monthEndValue =
            dailyValues.length
            ?
            dailyValues[
                dailyValues.length - 1
            ]
            :
            0;


        const directAverage =
            dailyDirect.length
            ?
            dailyDirect.reduce(
                (a,b) => a + b,
                0
            ) / dailyDirect.length
            :
            0;


        const subcontractorAverage =
            dailySubcontractor.length
            ?
            dailySubcontractor.reduce(
                (a,b) => a + b,
                0
            ) / dailySubcontractor.length
            :
            0;


        months.push({

            year,

            month,

            label:
                cursor.toLocaleDateString(
                    "en-GB",
                    {
                        month:"short",
                        year:"numeric"
                    }
                ),

            average,

            peak,

            monthEnd:
                monthEndValue,

            directAverage,

            subcontractorAverage

        });


        cursor.setMonth(
            cursor.getMonth() + 1
        );

    }


    return months;

}


/* =====================================================
   DATE FORMAT
===================================================== */

function almMP3DateString(date){

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");


    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}


/* =====================================================
   MONTHLY FLOW GRAPH
===================================================== */

function almMP3BuildChart(months){

    if(!months.length){

        return `
            <div style="
                padding:40px;
                text-align:center;
                color:#64748b;
            ">
                No dated manpower records available.
            </div>
        `;

    }


    const width = 1000;

    const height = 330;

    const left = 60;

    const right = 25;

    const top = 25;

    const bottom = 55;


    const chartWidth =
        width - left - right;


    const chartHeight =
        height - top - bottom;

        months.map(

                    left + chartWidth / 2

                        index /
                        (months.length - 1)
                    ) *
                    chartWidth;


                const y =
                    top +
                    chartHeight -
                    (
                        item.average /
                        maxValue
                    ) *
                    chartHeight;


                return `${x},${y}`;

    const peakPoints =
        months.map(

/* =====================================================
   GET WORK STAGE DATA
===================================================== */

function almMP4GetWorkStageData(project){

    const records =
        project.manpowerRecords || [];


    const selectedDate =
        project.manpowerAsOfDate ||
        almMP2Today();


    const activeRecords =
        records.filter(
            record =>
                almMP2IsActive(
                    record,
                    selectedDate
                )
        );


    const stageMap = {};


    activeRecords.forEach(
        record => {

            const stage =
                String(
                    record.workStage || ""
                ).trim();


            if(!stage){
                return;
            }


            if(!stageMap[stage]){

                stageMap[stage] = {

                    stage,

                    total: 0,

                    direct: 0,

                    subcontractor: 0,

                    deployments: 0

                };

            }


            const manpower =
                Number(
                    record.manpower || 0
                );


            stageMap[stage].total +=
                manpower;


            stageMap[stage].deployments +=
                1;


            if(
                record.type ===
                "Subcontractor"
            ){

                stageMap[stage].subcontractor +=
                    manpower;

            }else{

                stageMap[stage].direct +=
                    manpower;

            }

        }
    );


    return Object.values(stageMap)
        .sort(
            (a,b) =>
                b.total - a.total
        );

}

/* =====================================================

function almMP5GetTradeData(project){

    const records =
        project.manpowerRecords || [];

    const selectedDate =
        project.manpowerAsOfDate ||
        almMP2Today();

    const activeRecords =
        records.filter(
            record =>
                almMP2IsActive(
                    record,
                    selectedDate
                )
        );

    const tradeMap = {};

    activeRecords.forEach(
        record => {

            const trade =
                String(
                    record.trade || ""
                ).trim();

            if(!trade){
                return;
            }

            if(!tradeMap[trade]){

                tradeMap[trade] = {

                    trade,

                    total: 0,

                    direct: 0,

                    subcontractor: 0,

                    deployments: 0

                };

            }

            const manpower =
                Number(
                    record.manpower || 0
                );

            tradeMap[trade].total +=
                manpower;

            tradeMap[trade].deployments +=
                1;

            if(
                record.type ===
                "Subcontractor"
            ){

                tradeMap[trade].subcontractor +=
                    manpower;

            }else{

                tradeMap[trade].direct +=
                    manpower;

            }

        }
    );

    return Object.values(tradeMap)
        .sort(
            (a,b) =>
                b.total - a.total
        );

}

/* =====================================================

===================================================== */

function almMP5BuildTypeChart(
    tradeData
){

    const direct =
        tradeData.reduce(
            (sum,item) =>
                sum + item.direct,
            0
        );

    const subcontractor =
        tradeData.reduce(
            (sum,item) =>
                sum + item.subcontractor,
            0
        );

    const total =
        direct +
        subcontractor;

    if(total === 0){

        return `
            <div style="
                padding:40px;
                text-align:center;
                color:#64748b;
            ">
                No current manpower available.
            </div>
        `;

    }

    const directPercent =
        (
            direct /
