/* =====================================================
   GET TIMELINE RANGE
===================================================== */

function almMP6GetTimelineRange(project){

    const records =
        project.manpowerRecords || [];

    const validRecords =
        records.filter(
            record =>
                record.startDate &&
                record.endDate &&
                record.endDate >= record.startDate
        );

    if(!validRecords.length){

        return null;

    }

    let startDate =
        validRecords[0].startDate;

    let endDate =
        validRecords[0].endDate;


    validRecords.forEach(
        record => {

            if(record.startDate < startDate){

                startDate =
                    record.startDate;

            }

            if(record.endDate > endDate){

                endDate =
                    record.endDate;

            }

        }
    );


    return {

        startDate,

        endDate

    };

}


/* =====================================================
   BUILD TIMELINE
===================================================== */

function almMP6BuildTimeline(project){

    const records =
        (project.manpowerRecords || [])
            .filter(
                record =>
                    record.startDate &&
                    record.endDate &&
                    record.endDate >= record.startDate
            );


    if(!records.length){

        return `
            <div style="
                padding:40px;
                text-align:center;
                color:#64748b;
            ">
                No dated manpower deployments
                available for the timeline.
            </div>
        `;

    }


    const range =
        almMP6GetTimelineRange(project);


    if(!range){

        return "";

    }


    const start =
        new Date(
            range.startDate + "T00:00:00"
        );


    const end =
        new Date(
            range.endDate + "T00:00:00"
        );


    const totalDays =
        Math.max(
            1,
            Math.ceil(
                (
                    end - start
                ) /
                86400000
            ) + 1
        );


    /*
       Timeline width.
       More days = wider timeline.
    */

    const dayWidth = 9;

    const timelineWidth =
        Math.max(
            850,
            totalDays * dayWidth
        );


    const labelWidth = 280;

    const manpowerWidth = 90;

    const rowHeight = 52;

    const headerHeight = 65;


    const height =
        headerHeight +
        records.length *
        rowHeight +
        20;


    /* ---------------------------------------------
       MONTH HEADERS
    --------------------------------------------- */

    let monthHeaders = "";

    let cursor =
        new Date(
            start.getFullYear(),
            start.getMonth(),
            1
        );


    while(cursor <= end){

        const monthStart =
            new Date(cursor);


        const nextMonth =
            new Date(
                cursor.getFullYear(),
                cursor.getMonth() + 1,
                1
            );


        const visibleStart =
            monthStart < start
            ? start
            : monthStart;


        const visibleEnd =
            nextMonth > end
            ? end
            : new Date(
                nextMonth.getTime() - 86400000
            );


        const offsetStart =
            Math.max(
                0,
                Math.round(
                    (
                        visibleStart - start
                    ) /
                    86400000
                )
            );


        const days =
            Math.round(
                (
                    visibleEnd -
                    visibleStart
                ) /
                86400000
            ) + 1;


        const x =
            offsetStart *
            dayWidth;


        const width =
            days *
            dayWidth;


        const label =
            cursor.toLocaleDateString(
                "en-GB",
                {
                    month:"short",
                    year:"numeric"
                }
            );


        monthHeaders += `

            <rect
                x="${x}"
                y="0"
                width="${width}"
                height="32"
                fill="#f3f6fa"
                stroke="#e5e7eb"
            />

            <text
                x="${x + width / 2}"
                y="20"
                text-anchor="middle"
                font-size="11"
                font-weight="600"
                fill="#374151"
            >
                ${label}
            </text>

        `;


        cursor.setMonth(
            cursor.getMonth() + 1
        );

    }


    /* ---------------------------------------------
       DATE GRID
    --------------------------------------------- */

    let grid = "";


    let gridDate =
        new Date(start);


    while(gridDate <= end){

        const dayIndex =
            Math.round(
                (
                    gridDate - start
                ) /
                86400000
            );


        const x =
            dayIndex *
            dayWidth;


        const isMonthStart =
            gridDate.getDate() === 1;


        if(
            isMonthStart ||
            gridDate.getDate() === 15
        ){

            grid += `

                <line
                    x1="${x}"
                    y1="32"
                    x2="${x}"
                    y2="${height}"
                    stroke="#e5e7eb"
                    stroke-width="1"
                />

                <text
                    x="${x + 3}"
                    y="50"
                    font-size="9"
                    fill="#64748b"
                >
                    ${String(
                        gridDate.getDate()
                    ).padStart(2,"0")}
                </text>

            `;

        }


        gridDate.setDate(
            gridDate.getDate() + 1
        );

    }


    /* ---------------------------------------------
       DEPLOYMENT ROWS
    --------------------------------------------- */

    let rows = "";


    records.forEach(
        (record,index) => {

            const recordStart =
                new Date(
                    record.startDate +
                    "T00:00:00"
                );


            const recordEnd =
                new Date(
                    record.endDate +
                    "T00:00:00"
                );


            const startOffset =
                Math.max(
                    0,
                    Math.round(
                        (
                            recordStart -
                            start
                        ) /
                        86400000
                    )
                );


            const duration =
                Math.round(
                    (
                        recordEnd -
                        recordStart
                    ) /
                    86400000
                ) + 1;


            const barX =
                startOffset *
                dayWidth;


            const barWidth =
                Math.max(
                    dayWidth,
                    duration *
                    dayWidth
                );


            const rowY =
                headerHeight +
                index *
                rowHeight;


            const typeLabel =
                record.type ===
                "Subcontractor"
                ?
                "Subcontractor"
                :
                "Direct";


            rows += `

                <!-- ROW BACKGROUND -->

                <rect
                    x="0"
                    y="${rowY}"
                    width="${timelineWidth}"
                    height="${rowHeight}"
                    fill="${
                        index % 2 === 0
                        ? "#ffffff"
                        : "#fafbfc"
                    }"
                    stroke="#eef0f3"
                />


                <!-- BAR -->

                <rect
                    x="${barX}"
                    y="${rowY + 14}"
                    width="${barWidth}"
                    height="24"
                    rx="5"
                    fill="#17243a"
                />


                <!-- MANPOWER ON BAR -->

                <text
                    x="${barX + barWidth / 2}"
                    y="${rowY + 30}"
                    text-anchor="middle"
                    font-size="10"
                    font-weight="700"
                    fill="white"
                >
                    ${Number(
                        record.manpower || 0
                    )}
                </text>


                <!-- LEFT LABEL -->

                <text
                    x="${-labelWidth + 10}"
                    y="${rowY + 19}"
                    font-size="11"
                    font-weight="600"
                    fill="#374151"
                >
                    ${almManpowerEscape(
                        record.workStage ||
                        "Unspecified"
                    )}
                </text>


                <text
                    x="${-labelWidth + 10}"
                    y="${rowY + 35}"
                    font-size="9"
                    fill="#64748b"
                >
                    ${almManpowerEscape(
                        record.trade || ""
                    )}
                    ${
                        record.company
                        ?
                        " • " +
                        almManpowerEscape(
                            record.company
                        )
                        :
                        ""
                    }
                </text>


                <!-- RIGHT MANPOWER -->

                <text
                    x="${timelineWidth + 15}"
                    y="${rowY + 29}"
                    font-size="11"
                    font-weight="700"
                    fill="#17243a"
                >
                    ${Number(
                        record.manpower || 0
                    )}
                </text>

            `;

        }
    );


    /*
       SVG uses a negative left area for labels.
       Wrap everything in a translated group.
    */

    return `

        <div style="
            overflow-x:auto;
            width:100%;
            padding-bottom:8px;
        ">

            <svg
                viewBox="
                    ${-labelWidth}
                    0
                    ${timelineWidth +
                      labelWidth +
                      manpowerWidth}
                    ${height}
                "
                style="
                    width:100%;
                    min-width:1100px;
                    height:auto;
                    display:block;
                "
            >

                <!-- HEADER LABEL -->

                <text
                    x="${-labelWidth + 10}"
                    y="20"
                    font-size="11"
                    font-weight="700"
                    fill="#374151"
                >
                    WORK STAGE / TRADE
                </text>


                <!-- HEADER MANPOWER -->

                <text
                    x="${timelineWidth + 15}"
                    y="20"
                    font-size="11"
                    font-weight="700"
                    fill="#374151"
                >
                    No.
                </text>


                <!-- MONTH HEADERS -->

                ${monthHeaders}


                <!-- GRID -->

                ${grid}


                <!-- ROWS -->

                ${rows}

            </svg>

        </div>

    `;

}

        almMP2GetCurrentStats(

            selectedDate
        );

        almMP3GetMonthlyData(project);

        almMP4GetWorkStageData(project);


    const tradeData =
        almMP5GetTradeData(project);


    /* =================================================
       BASIC ANALYSIS
    ================================================= */

    const projectName =
        project.name ||
        project.projectName ||
        "Project";


    const clientName =
        project.client ||
        project.clientName ||
        "Client";


    const projectManager =
        project.projectManager ||
        project.manager ||
        "ALM Project Management";


    const sortedRecords =
        [...records].sort(
            (a,b) =>
                String(a.startDate || "")
                    .localeCompare(
                        String(b.startDate || "")
                    )
        );


    const firstDate =
        sortedRecords.length
        ?
        sortedRecords[0].startDate
        :
        "";


    const lastDate =
        sortedRecords.length
        ?
        sortedRecords.reduce(
            (latest,record) =>
                String(record.endDate || "") >
                String(latest || "")
                    ? record.endDate
                    : latest,
            ""
        )
        :
        "";


    const averageManpower =
        months.length
        ?
        months.reduce(
            (sum,item) =>
                sum +
                Number(item.average || 0),
            0
        ) / months.length
        :
        0;


    const peakMonth =
        months.length
        ?
        months.reduce(
            (best,item) =>
                Number(item.peak || 0) >
                Number(best.peak || 0)
                    ? item
                    : best,
            months[0]
        )
        :
        null;


    const activeRecords =
        records.filter(
            record =>
                almMP2IsActive(
                    record,
                    selectedDate
                )
        );


    const upcomingRecords =
        records.filter(
            record =>
                record.startDate &&
                record.startDate >
                selectedDate
        );


    const completedRecords =
        records.filter(
            record =>
                record.endDate &&
                record.endDate <
                selectedDate
        );


    const direct =
        activeRecords.reduce(
            (sum,record) =>
                record.type === "Direct"
                ?
                sum + Number(
                    record.manpower || 0
                )
                :
                sum,
            0
        );


    const subcontractor =
        activeRecords.reduce(
            (sum,record) =>
                record.type === "Subcontractor"
                ?
                sum + Number(
                    record.manpower || 0
                )
                :
                sum,
            0
        );


    const directPercent =
        stats.total > 0
        ?
        direct / stats.total * 100
        :
        0;


    const subcontractorPercent =
        stats.total > 0
        ?
        subcontractor /
        stats.total * 100
        :
        0;


    const dominantStage =
        stageData.length
        ?
        stageData.reduce(
            (best,item) =>
                Number(item.total || 0) >
                Number(best.total || 0)
                    ? item
                    : best,
            stageData[0]
        )
        :
        null;


    const dominantTrade =
        tradeData.length

    <script>

function loadSidebarCompanyLogo(){

    const logo =
        localStorage.getItem(
            "alm_company_logo"
        );

    const image =
        document.getElementById(
            "sidebarCompanyLogo"
        );

    if(!image){
        return;
    }

    if(logo){

        image.src = logo;

    }else{

        image.style.display = "none";

        const fallback =
            document.createElement("div");

        fallback.className = "logo-box";

        fallback.textContent = "ALM";

        image.parentNode.insertBefore(
            fallback,
            image
        );

    }

}

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadSidebarCompanyLogo();

    }
);

</script>
