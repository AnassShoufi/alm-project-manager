<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALM Project Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}

body{
    background:#f4f6f8;
    color:#172033;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:255px;
    background:#17243a;
    color:white;
    padding:25px 16px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:35px;
}

.logo-box{
    background:#f5a400;
    color:white;
    width:40px;
    height:40px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu button{
    border:0;
    background:transparent;
    color:#e7edf7;
    padding:13px 12px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#2b405f;
}

/* MAIN */
.main{
    margin-left:255px;
    width:calc(100% - 255px);
}

.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid #e1e5ea;
    display:flex;
    align-items:center;
    padding:0 32px;
}

.search{
    width:430px;
    padding:13px 16px;
    border:1px solid #d5dbe3;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.content{
    padding:30px 34px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#708096;
}

/* BUTTONS */
.btn{
    border:0;
    padding:12px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#1976b8;
    color:white;
}

.btn-primary:hover{
    background:#125e94;
}

.btn-secondary{
    background:#e8edf3;
    color:#25344a;
}

.btn-danger{
    background:#dc3545;
    color:white;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:22px;
}

.stat-card .label{
    color:#708096;
    margin-bottom:12px;
}

.stat-card .number{
    font-size:32px;
    font-weight:bold;
}

/* TABLE */
.panel{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    overflow:hidden;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 22px;
    border-bottom:1px solid #e5e9ee;
}

.panel-header h2{
    font-size:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:16px 18px;
    text-align:left;
    border-bottom:1px solid #edf0f3;
    font-size:14px;
}

th{
    color:#68788e;
    background:#fafbfc;
}

tr:hover td{
    background:#fafcff;
}

.project-name{
    font-weight:bold;
    color:#17243a;
}

.progress-wrap{
    width:120px;
}

.progress-bar{
    height:7px;
    background:#e5e9ee;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.progress-fill{
    height:100%;
    background:#1976b8;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-active{
    background:#d9f7e5;
    color:#148344;
}

.badge-delayed{
    background:#fff0c7;
    color:#a56a00;
}

.badge-completed{
    background:#dce8ff;
    color:#2459a6;
}

.badge-onhold{
    background:#eceff3;
    color:#657284;
}

.actions{
    display:flex;
    gap:7px;
}

.action-btn{
    border:1px solid #d8dee6;
    background:white;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
}

.action-btn:hover{
    background:#f0f4f8;
}

/* MODAL */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal{
    width:700px;
    max-width:94%;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
    padding:22px 25px;
    border-bottom:1px solid #e5e9ee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:21px;
}

.close{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    color:#68788e;
}

.modal-body{
    padding:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:13px;
    font-weight:bold;
    color:#4d5d73;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #d4dae2;
    border-radius:6px;
    outline:none;
    font-size:14px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#1976b8;
}

.modal-footer{
    padding:18px 25px;
    border-top:1px solid #e5e9ee;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}
/* =========================
   PROJECT DETAILS WINDOW
========================= */

.project-details-modal{

    width:1100px;
    max-width:95%;
    height:85vh;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
}


.project-details-header{

    min-height:80px;

    padding:20px 25px;

    border-bottom:1px solid #e5e9ee;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.project-details-header h2{

    font-size:24px;

    color:#17243a;

}


.project-details-code{

    color:#708096;

    font-size:13px;

    margin-top:5px;

}


.project-details-layout{

    display:grid;

    grid-template-columns:230px 1fr;

    flex:1;

    min-height:0;

}


.project-details-menu{

    background:#f7f9fb;

    border-right:1px solid #e1e5ea;

    padding:15px;

    overflow-y:auto;

}


.project-menu-btn{

    width:100%;

    border:0;

    background:transparent;

    color:#46566c;

    padding:12px 14px;

    margin-bottom:5px;

    border-radius:7px;

    text-align:left;

    cursor:pointer;

    font-size:14px;

}


.project-menu-btn:hover{

    background:#e8edf3;

}


.project-menu-btn.active{

    background:#1976b8;

    color:white;

    font-weight:bold;

}


.project-details-content{

    padding:28px;

    overflow-y:auto;

}


.project-section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}


.project-section-header h3{

    font-size:22px;

    color:#17243a;

}


.project-section-header p{

    color:#708096;

    margin-top:5px;

    font-size:14px;

}


.project-info-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;

}


.project-info-card{

    border:1px solid #e1e5ea;

    border-radius:8px;

    padding:17px;

    background:#fafbfc;

}


.project-info-card span{

    display:block;

    color:#708096;

    font-size:12px;

    margin-bottom:7px;

}


.project-info-card strong{

    font-size:15px;

    color:#17243a;

}


.project-description{

    margin-top:22px;

    padding:20px;

    border:1px solid #e1e5ea;

    border-radius:8px;

}


.project-description h3{

    margin-bottom:10px;

}


.project-description p{

    color:#68788e;

    line-height:1.6;

}


.project-empty-section{

    min-height:350px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    border:2px dashed #dfe5ec;

    border-radius:10px;

    color:#708096;

}


.project-empty-icon{

    font-size:45px;

    margin-bottom:15px;

}


.project-empty-section h3{

    color:#17243a;

    margin-bottom:8px;

}


.project-empty-section p{

    max-width:450px;

    line-height:1.6;

}
/* RESPONSIVE */
@media(max-width:1000px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .sidebar{
        width:200px;
    }

    .main{
        margin-left:200px;
        width:calc(100% - 200px);
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    table{
        min-width:900px;
    }

    .panel{
        overflow-x:auto;
    }
}
    /* =========================
   DRAWINGS MODULE
========================= */

.project-link{
    cursor:pointer;
    color:#17243a;
}

.project-link:hover{
    color:#1976b8;
    text-decoration:underline;
}

.module-page{
    padding:0;
}

.module-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.module-toolbar-left h1{
    font-size:28px;
    margin-bottom:5px;
}

.module-toolbar-left p{
    color:#708096;
}

.back-btn{
    border:0;
    background:#e8edf3;
    color:#25344a;
    padding:11px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.back-btn:hover{
    background:#dce3eb;
}

.drawing-table-wrap{
    overflow-x:auto;
}

.drawing-number{
    font-weight:bold;
    color:#17243a;
}

.drawing-title{
    font-weight:bold;
}

.drawing-file{
    color:#1976b8;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
}

.drawing-file:hover{
    text-decoration:underline;
}

.revision-badge{
    display:inline-block;
    background:#eef3f8;
    color:#34495e;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status-review{
    background:#fff0c7;
    color:#a56a00;
}

.drawing-status-approved{
    background:#d9f7e5;
    color:#148344;
}

.drawing-status-rejected{
    background:#ffe0e3;
    color:#b42332;
}

.drawing-status-superseded{
    background:#eceff3;
    color:#657284;
}

.drawing-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.drawing-modal{
    width:760px;
}

.file-name{
    margin-top:6px;
    font-size:12px;
    color:#708096;
}

.info-box{
    background:#f7f9fb;
    border:1px solid #e1e5ea;
    border-radius:8px;
    padding:14px;
    margin-bottom:20px;
}

.info-box strong{
    color:#17243a;
}

.no-drawings{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}

@media(max-width:700px){
    .module-toolbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-box">ALM</div>
            <div>ALM<br>Project Manager</div>
        </div>

        <nav class="menu">
            <button class="active" onclick="showDashboard()">▦ Dashboard</button>
            <button onclick="showProjects()">▣ Projects</button>
            <button>☑ Tasks</button>
            <button>▤ Documents</button>
            <button>🛒 Procurement</button>
            <button>▣ Payments</button>
            <button>⚒ Variations</button>
            <button>♟ Manpower</button>
            <button>▣ Equipment</button>
            <button>▤ Reports</button>
            <button>⚙ Settings</button>
        </nav>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <input
                id="globalSearch"
                class="search"
                type="text"
                placeholder="Search projects, tasks, documents..."
                oninput="searchProjects()"
            >
        </header>

        <section class="content" id="pageContent"></section>

    </main>

</div>

<!-- DRAWING MODAL -->
<div class="modal-overlay" id="drawingModal">

    <div class="modal drawing-modal">

        <div class="modal-header">

            <h2 id="drawingModalTitle">
                Upload Drawing
            </h2>

            <button
                class="close"
                onclick="closeDrawingModal()">
                ×
            </button>

        </div>


        <form
            id="drawingForm"
            onsubmit="saveDrawing(event)">

            <div class="modal-body">

                <div class="info-box">
                    Project:
                    <strong id="drawingProjectName">
                        -
                    </strong>
                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Drawing Number *
                        </label>

                        <input
                            id="drawingNumber"
                            required
                            placeholder="e.g. STR-001">

                    </div>


                    <div class="form-group">

                        <label>
                            Drawing Title *
                        </label>

                        <input
                            id="drawingTitle"
                            required
                            placeholder="e.g. Foundation Layout">

                    </div>


                    <div class="form-group">

                        <label>
                            Discipline
                        </label>

                        <select id="drawingDiscipline">

                            <option value="Architectural">
                                Architectural
                            </option>

                            <option value="Structural">
                                Structural
                            </option>

                            <option value="Civil">
                                Civil
                            </option>

                            <option value="MEP">
                                MEP
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Revision
                        </label>

                        <input
                            id="drawingRevision"
                            placeholder="Rev.00">

                    </div>


                    <div class="form-group">

                        <label>
                            Drawing Date
                        </label>

                        <input
                            id="drawingDate"
                            type="date">

                    </div>


                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="drawingStatus">

                            <option value="For Review">
                                For Review
                            </option>

                            <option value="Approved">
                                Approved
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                            <option value="Superseded">
                                Superseded
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            Drawing File *
                        </label>

                        <input
                            id="drawingFile"
                            type="file"
                            accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png"
                            required>

                        <div
                            class="file-name"
                            id="selectedDrawingFile">
                            No file selected
                        </div>

                    </div>


                    <div class="form-group full">

                        <label>
                            Remarks
                        </label>

                        <textarea
                            id="drawingRemarks"
                            placeholder="Additional remarks...">
                        </textarea>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeDrawingModal()">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Drawing

                </button>

            </div>

        </form>

    </div>

</div>
<!-- PROJECT MODAL -->
<div class="modal-overlay" id="projectModal">

    <div class="modal">

        <div class="modal-header">
            <h2 id="modalTitle">New Project</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <form id="projectForm" onsubmit="saveProject(event)">

            <div class="modal-body">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Project Name *</label>
                        <input id="projectName" required>
                    </div>

                    <div class="form-group">
                        <label>Project Code</label>
                        <input id="projectCode">
                    </div>

                    <div class="form-group">
                        <label>Client</label>
                        <input id="client">
                    </div>

                    <div class="form-group">
                        <label>Project Manager</label>
                        <input id="manager">
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input id="location">
                    </div>

                    <div class="form-group">
                        <label>Contract Value</label>
                        <input id="contractValue" type="number" min="0">
                    </div>

                    <div class="form-group">
                        <label>Start Date</label>
                        <input id="startDate" type="date">
                    </div>

                    <div class="form-group">
                        <label>Planned Completion</label>
                        <input id="completionDate" type="date">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="Active">Active</option>
                            <option value="Delayed">Delayed</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Progress %</label>
                        <input id="progress" type="number" min="0" max="100" value="0">
                    </div>

                    <div class="form-group full">
                        <label>Description</label>
                        <textarea id="description"></textarea>
                    </div>

                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">
                    Cancel
                </button>

                <button type="submit" class="btn btn-primary">
                    Save Project
                </button>
            </div>

        </form>

    </div>

</div>


<script>

/* =========================
   PROJECT DATA
========================= */

const defaultProjects = [
    {
        id: 1,
        name: "Manhattan",
        code: "MAN-001",
        client: "Client A",
        manager: "Project Manager",
        location: "",
        contractValue: "",
        startDate: "",
        completionDate: "",
        status: "Active",
        progress: 65,
        description: ""
    },
    {
        id: 2,
        name: "Beverly",
        code: "BEV-001",
        client: "Client B",
        manager: "Project Manager",
        location: "",
        contractValue: "",
        startDate: "",
        completionDate: "",
        status: "Delayed",
        progress: 42,
        description: ""
    },
    {
        id: 3,
        name: "Zilco Project",
        code: "ZIL-001",
        client: "Client C",
        manager: "Project Manager",
        location: "",
        contractValue: "",
        startDate: "",
        completionDate: "",
        status: "Active",
        progress: 78,
        description: ""
    }
];

let projects = JSON.parse(localStorage.getItem("alm_projects"));

if (!projects) {
    projects = defaultProjects;
    localStorage.setItem("alm_projects", JSON.stringify(projects));
}

let editingId = null;


/* =========================
   SAVE DATA
========================= */

function persist(){
    localStorage.setItem("alm_projects", JSON.stringify(projects));
}


/* =========================
   DASHBOARD
========================= */

function showDashboard(){

    const active = projects.filter(p => p.status === "Active").length;

    const delayed = projects.filter(p => p.status === "Delayed").length;

    document.getElementById("pageContent").innerHTML = `

        <div class="page-title">
            <div>
                <h1>Dashboard</h1>
                <p>ALM Engineering & Contracting</p>
            </div>

            <button class="btn btn-primary" onclick="openNewProject()">
                + New Project
            </button>
        </div>

        <div class="stats">

            <div class="stat-card">
                <div class="label">Active Projects</div>
                <div class="number">${active}</div>
            </div>

            <div class="stat-card">
                <div class="label">Open Tasks</div>
                <div class="number">18</div>
            </div>

            <div class="stat-card">
                <div class="label">Pending Documents</div>
                <div class="number">7</div>
            </div>

            <div class="stat-card">
                <div class="label">Delayed Items</div>
                <div class="number">${delayed}</div>
            </div>

        </div>

        <div class="panel">

            <div class="panel-header">

                <h2>Projects</h2>

                <button class="btn btn-primary" onclick="openNewProject()">
                    + Add Project
                </button>

            </div>

            ${projectTable()}

        </div>
    `;
}


/* =========================
   PROJECTS PAGE
========================= */

function showProjects(){

    document.getElementById("pageContent").innerHTML = `

        <div class="page-title">

            <div>
                <h1>Projects</h1>
                <p>Manage all ALM projects</p>
            </div>

            <button class="btn btn-primary" onclick="openNewProject()">
                + New Project
            </button>

        </div>

        <div class="panel">

            <div class="panel-header">
                <h2>All Projects</h2>
            </div>

            ${projectTable()}

/* =========================

========================= */

window.uploadDocument = function(projectId){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project) return;

    const input = document.createElement("input");

    input.type = "file";

    input.accept =
        ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.dwg,.zip";

    input.onchange = function(){

        const file = input.files[0];

        if(!file) return;

        const title = prompt(
            "Document Title:",
            file.name
        );

        if(title === null) return;

        const uploadedBy = prompt(
            "Uploaded By:",
            "Project Manager"
        );

        if(uploadedBy === null) return;

        const reader = new FileReader();

        reader.onload = function(e){

            if(!project.documents){
                project.documents = [];
            }

            project.documents.push({

                id: Date.now(),

                title: title || file.name,

                fileName: file.name,

                fileType: file.type || "Unknown",

                fileData: e.target.result,

                uploadedBy:
                    uploadedBy || "Project Manager",

                date:
                    new Date()
                    .toISOString()
                    .split("T")[0]

            });

            persist();

            showProjectSection(
                "documents",
                projectId
            );
        };

        reader.readAsDataURL(file);
    };

    input.click();
};


/* =========================
   VIEW DOCUMENT
========================= */

function viewDocument(projectId,index){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project || !project.documents) return;

    const doc = project.documents[index];

    if(!doc || !doc.fileData){

        alert("No file is attached to this document.");

        return;
    }


    const newWindow = window.open(
        "",
        "_blank"
    );

    if(!newWindow){

        alert(
            "Please allow pop-ups to view the document."
        );

        return;

    }


    newWindow.document.write(`

        <html>

        <head>

            <title>
                ${escapeHTML(doc.fileName || "Document")}
            </title>

        </head>

        <body style="
            margin:0;
            background:#f1f5f9;
        ">

            <iframe
                src="${doc.fileData}"
                style="
                    width:100%;
                    height:100vh;
                    border:0;
                    background:white;
                ">
            </iframe>

        </body>

        </html>

    `);

}


/* =========================
   DELETE DOCUMENT
========================= */

function deleteDocument(projectId,index){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project || !project.documents) return;


    const doc = project.documents[index];

    if(!doc) return;


    const confirmed = confirm(
        `Are you sure you want to delete "${doc.fileName}"?`
    );

    if(!confirmed) return;


    project.documents.splice(
        index,
        1
    );


    persist();


    showProjectSection(
        "documents",
        projectId
    );

}

function saveProject(event){

    event.preventDefault();

    const projectData = {

        name: document.getElementById("projectName").value.trim(),

        code: document.getElementById("projectCode").value.trim(),

        client: document.getElementById("client").value.trim(),

        manager: document.getElementById("manager").value.trim(),

        location: document.getElementById("location").value.trim(),

        contractValue: document.getElementById("contractValue").value,

        startDate: document.getElementById("startDate").value,

        completionDate: document.getElementById("completionDate").value,

        status: document.getElementById("status").value,

        progress: Number(document.getElementById("progress").value) || 0,

        description: document.getElementById("description").value.trim()
    };


    if(editingId){

        const index = projects.findIndex(p => p.id === editingId);

        if(index !== -1){

            projects[index] = {
                ...projects[index],
                ...projectData
            };

        }

    }else{

        projects.push({

            id: Date.now(),

            ...projectData

        });

    }


    persist();

    closeModal();

    showDashboard();
}

    const confirmed = confirm(
        `Are you sure you want to delete "${project.name}"?`
    );

    if(!confirmed) return;

    projects = projects.filter(p => p.id !== id);

    persist();

    showDashboard();
}


/* =========================
   SEARCH
========================= */

function searchProjects(){

    const search = document
        .getElementById("globalSearch")
        .value
        .toLowerCase()
        .trim();

    if(!search){

        showDashboard();

        return;
    }

    const results = projects.filter(p =>

        (p.name || "").toLowerCase().includes(search) ||
        (p.code || "").toLowerCase().includes(search) ||
        (p.client || "").toLowerCase().includes(search) ||
        (p.manager || "").toLowerCase().includes(search) ||
        (p.location || "").toLowerCase().includes(search)

    );

    document.getElementById("pageContent").innerHTML = `

        <div class="page-title">

            <div>
                <h1>Search Results</h1>
                <p>${results.length} project(s) found</p>
            </div>

            <button
                class="btn btn-primary"
                onclick="openNewProject()">
                + New Project
            </button>

        </div>

        <div class="panel">

            ${projectTable(results)}

        </div>

    `;
}

   MODAL
========================= */

function closeModal(){

    document.getElementById("projectModal").style.display = "none";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

document.getElementById("projectModal").addEventListener("click", function(e){

    if(e.target === this){
        closeModal();
    }

});

/* =========================

========================= */

let currentDrawingsProjectId = null;
let editingDrawingId = null;


/* =========================
   DRAWING DATA
========================= */

function getDrawings(){

    return JSON.parse(
        localStorage.getItem("alm_drawings") || "[]"
    );

}


function persistDrawings(drawings){

    localStorage.setItem(
        "alm_drawings",
        JSON.stringify(drawings)
    );

}

/* =========================
   DRAWING STATUS
========================= */

function drawingStatusBadge(status){

    let cls = "drawing-status-review";


    if(status === "Approved"){
        cls = "drawing-status-approved";
    }

    if(status === "Rejected"){
        cls = "drawing-status-rejected";
    }

    if(status === "Superseded"){
        cls = "drawing-status-superseded";
    }


    return `

        <span class="drawing-status ${cls}">

            ${escapeHTML(status || "For Review")}

        </span>

    `;

}


/* =========================
   OPEN UPLOAD DRAWING
========================= */

function openDrawingUpload(projectId){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project) return;


    currentDrawingsProjectId = projectId;

    editingDrawingId = null;


    document.getElementById(
        "drawingModalTitle"
    ).textContent = "Upload Drawing";


    document.getElementById(
        "drawingProjectName"
    ).textContent = project.name;


    document.getElementById(
        "drawingForm"
    ).reset();


    document.getElementById(
        "selectedDrawingFile"
    ).textContent = "No file selected";


    document.getElementById(
        "drawingModal"
    ).style.display = "flex";

}


/* =========================
   FILE NAME PREVIEW
========================= */

document.addEventListener("change", function(e){

    if(e.target.id !== "drawingFile") return;


    const file = e.target.files[0];


    document.getElementById(
        "selectedDrawingFile"
    ).textContent = file
        ? file.name
        : "No file selected";

});


/* =========================
   SAVE DRAWING
========================= */

function saveDrawing(event){

    event.preventDefault();


    const fileInput =
        document.getElementById("drawingFile");


    const file = fileInput.files[0];


    if(!file && !editingDrawingId){

        alert("Please select a drawing file.");

        return;

    }


    const drawings = getDrawings();


    const saveData = (fileData = null) => {

        const drawingData = {

            projectId: currentDrawingsProjectId,

            number:
                document.getElementById(
                    "drawingNumber"
                ).value.trim(),

            title:
                document.getElementById(
                    "drawingTitle"
                ).value.trim(),

            discipline:
                document.getElementById(
                    "drawingDiscipline"
                ).value,

            revision:
                document.getElementById(
                    "drawingRevision"
                ).value.trim(),

            drawingDate:
                document.getElementById(
                    "drawingDate"
                ).value,

            status:
                document.getElementById(
                    "drawingStatus"
                ).value,

            remarks:
                document.getElementById(
                    "drawingRemarks"
                ).value.trim(),

            uploadedBy:
                currentUser.name,

            uploadDate:
                new Date().toLocaleDateString(),

            fileName:
                file
                    ? file.name
                    : null,

            fileType:
                file
                    ? file.type
                    : null,

            fileData:
                fileData

        };


        if(editingDrawingId){

            const index =
                drawings.findIndex(
                    d => d.id === editingDrawingId
                );


            if(index !== -1){

                drawings[index] = {

                    ...drawings[index],

                    ...drawingData,

                    /*
                       Keep old file if no new
                       file was selected.
                    */

                    fileName:
                        file
                            ? file.name
                            : drawings[index].fileName,

                    fileType:
                        file
                            ? file.type
                            : drawings[index].fileType,

                    fileData:
                        fileData
                            ? fileData
                            : drawings[index].fileData

                };

            }

        }else{

            drawings.push({

                id: Date.now(),

                ...drawingData

            });

        }


        persistDrawings(drawings);

        closeDrawingModal();


        const project =
            projects.find(
                p => p.id === currentDrawingsProjectId
            );


        if(project){

            renderDrawingsPage(project);

        }

    };


    /*
       Read uploaded file as Data URL.
       This is suitable for our first prototype.
    */

    if(file){

        const reader = new FileReader();


        reader.onload = function(){

            saveData(reader.result);

        };


        reader.readAsDataURL(file);

    }else{

        saveData();

    }

}


/* =========================
   VIEW DRAWING
========================= */

function viewDrawing(id){

    const drawing =
        getDrawings().find(
            d => d.id === id
        );


    if(!drawing) return;


    if(!drawing.fileData){

        alert("No file is attached to this drawing.");

        return;

    }


    const newWindow =
        window.open();


    if(newWindow){

        newWindow.document.write(`

            <html>

                <head>

                    <title>
                        ${escapeHTML(drawing.fileName || "Drawing")}
                    </title>

                </head>

                <body style="
                    margin:0;
                    background:#222;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    min-height:100vh;
                ">

                    <iframe
                        src="${drawing.fileData}"
                        style="
                            width:100%;
                            height:100vh;
                            border:0;
                            background:white;
                        ">
                    </iframe>

                </body>

            </html>

        `);

        newWindow.document.close();

    }

}


/* =========================
   EDIT DRAWING
========================= */

function editDrawing(id){

    const drawing =
        getDrawings().find(
            d => d.id === id
        );


    if(!drawing) return;


    const project =
        projects.find(
            p => p.id === drawing.projectId
        );


    if(!project) return;


    currentDrawingsProjectId =
        drawing.projectId;


    editingDrawingId = id;


    document.getElementById(
        "drawingModalTitle"
    ).textContent = "Edit Drawing";


    document.getElementById(
        "drawingProjectName"
    ).textContent = project.name;


    document.getElementById(
        "drawingNumber"
    ).value = drawing.number || "";


    document.getElementById(
        "drawingTitle"
    ).value = drawing.title || "";


    document.getElementById(
        "drawingDiscipline"
    ).value =
        drawing.discipline || "Structural";


    document.getElementById(
        "drawingRevision"
    ).value = drawing.revision || "";


    document.getElementById(
        "drawingDate"
    ).value = drawing.drawingDate || "";


    document.getElementById(
        "drawingStatus"
    ).value =
        drawing.status || "For Review";


    document.getElementById(
        "drawingRemarks"
    ).value = drawing.remarks || "";


    document.getElementById(
        "drawingFile"
    ).required = false;


    document.getElementById(
        "selectedDrawingFile"
    ).textContent =
        drawing.fileName
        ? `Current file: ${drawing.fileName}`
        : "No file selected";


    document.getElementById(
        "drawingModal"
    ).style.display = "flex";

}


/* =========================
   DELETE DRAWING
========================= */

function deleteDrawing(id){

    if(currentUser.role !== "Admin"){

        alert(
            "Only Admin can delete drawings."
        );

        return;

    }


    const drawings = getDrawings();


    const drawing =
        drawings.find(
            d => d.id === id
        );


    if(!drawing) return;


    const confirmed =
        confirm(
            `Are you sure you want to delete "${drawing.number} - ${drawing.title}"?`
        );


    if(!confirmed) return;


    const updated =
        drawings.filter(
            d => d.id !== id
        );


    persistDrawings(updated);


    const project =
        projects.find(
            p => p.id === currentDrawingsProjectId
        );


    if(project){

        renderDrawingsPage(project);

    }

}


/* =========================
   CLOSE DRAWING MODAL
========================= */

function closeDrawingModal(){

    document.getElementById(
        "drawingModal"
    ).style.display = "none";


    editingDrawingId = null;


    /*
       Reset required state for
       new uploads.
    */

    document.getElementById(

}

showDashboard();
/* =========================
   DRAWINGS
========================= */

function uploadDrawing(projectId){

    const project = projects.find(p => p.id === projectId);

    if(!project) return;

    const drawingNumber = prompt("Drawing Number:");

    if(!drawingNumber) return;

    const drawingTitle = prompt("Drawing Title:");

    if(!drawingTitle) return;

    const revision = prompt("Revision:", "A");

    const discipline = prompt(
        "Discipline:",
        "Architectural / Structural / MEP"
    );

    const uploadedBy = prompt(
        "Uploaded By:",
        "Project Manager"
    );

    const date = new Date().toISOString().split("T")[0];

    if(!project.drawings){
        project.drawings = [];
    }

    project.drawings.push({

        id: Date.now(),

        number: drawingNumber,

        title: drawingTitle,

        revision: revision || "",

        discipline: discipline || "",

        uploadedBy: uploadedBy || "Project Manager",

        date: date

    });

    persist();

    showProjectSection("drawings", projectId);

}


/* =========================
   VIEW DRAWING
========================= */

function viewDrawing(projectId, index){

    const project = projects.find(p => p.id === projectId);

    if(!project || !project.drawings) return;

    const drawing = project.drawings[index];

    if(!drawing) return;

    alert(

        "DRAWING DETAILS\n\n" +

        "Drawing No.: " + drawing.number + "\n" +

        "Title: " + drawing.title + "\n" +

        "Revision: " + drawing.revision + "\n" +

        "Discipline: " + drawing.discipline + "\n" +

        "Uploaded By: " + drawing.uploadedBy + "\n" +

        "Date: " + drawing.date

    );

}


/* =========================
   EDIT DRAWING
========================= */

function editDrawing(projectId, index){

    const project = projects.find(p => p.id === projectId);

    if(!project || !project.drawings) return;

    const drawing = project.drawings[index];

    if(!drawing) return;


    const number = prompt(
        "Drawing Number:",
        drawing.number
    );

    if(!number) return;


    const title = prompt(
        "Drawing Title:",
        drawing.title
    );

    if(!title) return;


    const revision = prompt(
        "Revision:",
        drawing.revision
    );


    const discipline = prompt(
        "Discipline:",
        drawing.discipline
    );


    drawing.number = number;

    drawing.title = title;

    drawing.revision = revision || "";

    drawing.discipline = discipline || "";


    persist();

    showProjectSection("drawings", projectId);

}


/* =========================
   DELETE DRAWING
========================= */

function deleteDrawing(projectId, index){

    const project = projects.find(p => p.id === projectId);

    if(!project || !project.drawings) return;

    const drawing = project.drawings[index];

    if(!drawing) return;


    const confirmed = confirm(

        `Are you sure you want to delete drawing "${drawing.number}"?`

    );

    if(!confirmed) return;


    project.drawings.splice(index, 1);

    persist();

    showProjectSection("drawings", projectId);

}
