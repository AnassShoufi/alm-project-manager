window.almOpenManpowerClientReview = function(projectId){

    const project =
        projects.find(
            p => String(p.id) === String(projectId)
        );

    if(!project){
        return;
    }


    const selectedDate =
        project.manpowerAsOfDate ||
        almMP2Today();


    const records =
        project.manpowerRecords || [];


    const stats =
        almMP2GetCurrentStats(
            project,
            selectedDate
        );


    const months =
        almMP3GetMonthlyData(project);


    const stageData =
        almMP4GetWorkStageData(project);


    const tradeData =
        almMP5GetTradeData(project);


    /* =================================================
       BASIC ANALYSIS
    ================================================= */

    const projectName =
        project.name ||
        project.projectName ||
        "Project";


    const clientName =
        project.client ||
        project.clientName ||
        "Client";


    const projectManager =
        project.projectManager ||
        project.manager ||
        "ALM Project Management";


    const sortedRecords =
        [...records].sort(
            (a,b) =>
                String(a.startDate || "")
                    .localeCompare(
                        String(b.startDate || "")
                    )
        );


    const firstDate =
        sortedRecords.length
        ?
        sortedRecords[0].startDate
        :
        "";


    const lastDate =
        sortedRecords.length
        ?
        sortedRecords.reduce(
            (latest,record) =>
                String(record.endDate || "") >
                String(latest || "")
                    ? record.endDate
                    : latest,
            ""
        )
        :
        "";


    const averageManpower =
        months.length
        ?
        months.reduce(
            (sum,item) =>
                sum +
                Number(item.average || 0),
            0
        ) / months.length
        :
        0;


    const peakMonth =
        months.length
        ?
        months.reduce(
            (best,item) =>
                Number(item.peak || 0) >
                Number(best.peak || 0)
                    ? item
                    : best,
            months[0]
        )
        :
        null;


    const activeRecords =
        records.filter(
            record =>
                almMP2IsActive(
                    record,
                    selectedDate
                )
        );


    const upcomingRecords =
        records.filter(
            record =>
                record.startDate &&
                record.startDate >
                selectedDate
        );


    const completedRecords =
        records.filter(
            record =>
                record.endDate &&
                record.endDate <
                selectedDate
        );


    const direct =
        activeRecords.reduce(
            (sum,record) =>
                record.type === "Direct"
                ?
                sum + Number(
                    record.manpower || 0
                )
                :
                sum,
            0
        );


    const subcontractor =
        activeRecords.reduce(
            (sum,record) =>
                record.type === "Subcontractor"
                ?
                sum + Number(
                    record.manpower || 0
                )
                :
                sum,
            0
        );


    const directPercent =
        stats.total > 0
        ?
        direct / stats.total * 100
        :
        0;


    const subcontractorPercent =
        stats.total > 0
        ?
        subcontractor /
        stats.total * 100
        :
        0;


    const dominantStage =
        stageData.length
        ?
        stageData.reduce(
            (best,item) =>
                Number(item.total || 0) >
                Number(best.total || 0)
                    ? item
                    : best,
            stageData[0]
        )
        :
        null;


    const dominantTrade =
        tradeData.length
        ?
        tradeData.reduce(
            (best,item) =>
                Number(item.total || 0) >
                Number(best.total || 0)
                    ? item
                    : best,
            tradeData[0]
        )
        :
        null;


    /* =================================================
       ESCAPE
    ================================================= */

    function esc(value){

        return almManpowerEscape(
            value == null ? "" : value
        );

    }


    /* =================================================
       MONTHLY TABLE
    ================================================= */

    const monthlyRows =
        months.length
        ?
        months.map(
            item => `

                <tr>

                    <td>
                        ${esc(item.label)}
                    </td>

                    <td class="right">
                        ${Number(
                            item.average || 0
                        ).toFixed(1)}
                    </td>

                    <td class="right">
                        ${Number(
                            item.peak || 0
                        )}
                    </td>

                    <td class="right">
                        ${Number(
                            item.monthEnd || 0
                        )}
                    </td>

                    <td class="right">
                        ${Number(
                            item.directAverage || 0
                        ).toFixed(1)}
                    </td>

                    <td class="right">
                        ${Number(
                            item.subcontractorAverage || 0
                        ).toFixed(1)}
                    </td>

                </tr>

            `
        ).join("")
        :
        `
            <tr>
                <td colspan="6"
                    class="empty">
                    No monthly data available.
                </td>
            </tr>
        `;


    /* =================================================
       STAGE TABLE
    ================================================= */

    const stageTotal =
        stageData.reduce(
            (sum,item) =>
                sum + Number(item.total || 0),
            0
        );


    const stageRows =
        stageData.length
        ?
        stageData.map(
            item => {

                const pct =
                    stageTotal > 0
                    ?
                    Number(item.total || 0) /
                    stageTotal * 100
                    :
                    0;


                return `

                    <tr>

                        <td>
                            ${esc(item.stage)}
                        </td>

                        <td class="right">
                            ${Number(
                                item.total || 0
                            )}
                        </td>

                        <td class="right">
                            ${Number(
                                item.direct || 0
                            )}
                        </td>

                        <td class="right">
                            ${Number(
                                item.subcontractor || 0
                            )}
                        </td>

                        <td class="right">
                            ${pct.toFixed(1)}%
                        </td>

                    </tr>

                `;

            }
        ).join("")
        :
        `
            <tr>
                <td colspan="5"
                    class="empty">
                    No work-stage data available.
                </td>
            </tr>
        `;


    /* =================================================
       TRADE TABLE
    ================================================= */

    const tradeTotal =
        tradeData.reduce(
            (sum,item) =>
                sum + Number(item.total || 0),
            0
        );


    const tradeRows =
        tradeData.length
        ?
        tradeData.map(
            item => {

                const pct =
                    tradeTotal > 0
                    ?
                    Number(item.total || 0) /
                    tradeTotal * 100
                    :
                    0;


                return `

                    <tr>

                        <td>
                            ${esc(item.trade)}
                        </td>

                        <td class="right">
                            ${Number(
                                item.total || 0
                            )}
                        </td>

                        <td class="right">
                            ${Number(
                                item.direct || 0
                            )}
                        </td>

                        <td class="right">
                            ${Number(
                                item.subcontractor || 0
                            )}
                        </td>

                        <td class="right">
                            ${pct.toFixed(1)}%
                        </td>

                    </tr>

                `;

            }
        ).join("")
        :
        `
            <tr>
                <td colspan="5"
                    class="empty">
                    No trade data available.
                </td>
            </tr>
        `;


    /* =================================================
       REGISTER
    ================================================= */

    const registerRows =
        activeRecords.length
        ?
        activeRecords.map(
            record => `

                <tr>

                    <td>
                        ${esc(record.workStage)}
                    </td>

                    <td>
                        ${esc(record.scope)}
                    </td>

                    <td>
                        ${esc(record.type)}
                    </td>

                    <td>
                        ${esc(record.trade)}
                    </td>

                    <td>
                        ${esc(record.company)}
                    </td>

                    <td>
                        ${esc(record.startDate)}
                    </td>

                    <td>
                        ${esc(record.endDate)}
                    </td>

                    <td class="right bold">
                        ${Number(
                            record.manpower || 0
                        )}
                    </td>

                </tr>

            `
        ).join("")
        :
        `
            <tr>
                <td colspan="8"
                    class="empty">
                    No active manpower deployments.
                </td>
            </tr>
        `;


    /* =================================================
       MANAGEMENT OBSERVATIONS
    ================================================= */

    const observation1 =
        stats.total > 0
        ?
        `Current manpower stands at
        <strong>${stats.total}</strong>
        personnel across
        <strong>${stats.activeDeployments}</strong>
        active deployment records.`
        :
        `No active manpower deployment
        is recorded as of ${selectedDate}.`;


    const observation2 =
        dominantStage
        ?
        `<strong>${esc(
            dominantStage.stage
        )}</strong> represents the largest
        current manpower concentration,
        with <strong>${
            Number(
                dominantStage.total || 0
            )
        }</strong> personnel deployed.`
        :
        `No dominant work stage can
        currently be identified.`;


    const observation3 =
        dominantTrade
        ?
        `<strong>${esc(
            dominantTrade.trade
        )}</strong> is currently the largest
        manpower trade, representing
        <strong>${
            Number(
                dominantTrade.total || 0
            )
        }</strong> personnel.`
        :
        `No dominant trade can currently
        be identified.`;


    const observation4 =
        peakMonth
        ?
        `The recorded manpower programme
        reaches a peak of
        <strong>${
            Number(peakMonth.peak || 0)
        }</strong> personnel during
        <strong>${esc(
            peakMonth.label
        )}</strong>.`
        :
        `No project peak can currently
        be established.`;


    const observation5 =
        upcomingRecords.length > 0
        ?
        `<strong>${
            upcomingRecords.length
        }</strong> future deployment
        record${
            upcomingRecords.length === 1
            ? ""
            : "s"
        } are recorded beyond the
        reporting date.`
        :
        `No future manpower deployment
        is currently recorded beyond
        the reporting date.`;


    /* =================================================
       OPEN WINDOW
    ================================================= */

    const reportWindow =
        window.open(
            "",
            "_blank"
        );


    if(!reportWindow){

        alert(
            "Please allow pop-ups for Client Review."
        );

        return;

    }


    reportWindow.document.open();


    reportWindow.document.write(`
