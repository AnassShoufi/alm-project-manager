<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALM Project Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}

body{
    background:#f4f6f8;
    color:#172033;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:255px;
    background:#17243a;
    color:white;
    padding:25px 16px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:35px;
}

.logo-box{
    background:#f5a400;
    color:white;
    width:40px;
    height:40px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu button{
    border:0;
    background:transparent;
    color:#e7edf7;
    padding:13px 12px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#2b405f;
}

/* MAIN */
.main{
    margin-left:255px;
    width:calc(100% - 255px);
}

.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid #e1e5ea;
    display:flex;
    align-items:center;
    padding:0 32px;
}

.search{
    width:430px;
    padding:13px 16px;
    border:1px solid #d5dbe3;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.content{
    padding:30px 34px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#708096;
}

/* BUTTONS */
.btn{
    border:0;
    padding:12px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#1976b8;
    color:white;
}

.btn-primary:hover{
    background:#125e94;
}

.btn-secondary{
    background:#e8edf3;
    color:#25344a;
}

.btn-danger{
    background:#dc3545;
    color:white;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    padding:22px;
}

.stat-card .label{
    color:#708096;
    margin-bottom:12px;
}

.stat-card .number{
    font-size:32px;
    font-weight:bold;
}

/* TABLE */
.panel{
    background:white;
    border:1px solid #e1e5ea;
    border-radius:10px;
    overflow:hidden;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 22px;
    border-bottom:1px solid #e5e9ee;
}

.panel-header h2{
    font-size:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:16px 18px;
    text-align:left;
    border-bottom:1px solid #edf0f3;
    font-size:14px;
}

th{
    color:#68788e;
    background:#fafbfc;
}

tr:hover td{
    background:#fafcff;
}

.project-name{
    font-weight:bold;
    color:#17243a;
}

.progress-wrap{
    width:120px;
}

.progress-bar{
    height:7px;
    background:#e5e9ee;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.progress-fill{
    height:100%;
    background:#1976b8;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-active{
    background:#d9f7e5;
    color:#148344;
}

.badge-delayed{
    background:#fff0c7;
    color:#a56a00;
}

.badge-completed{
    background:#dce8ff;
    color:#2459a6;
}

.badge-onhold{
    background:#eceff3;
    color:#657284;
}

.actions{
    display:flex;
    gap:7px;
}

.action-btn{
    border:1px solid #d8dee6;
    background:white;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
}

.action-btn:hover{
    background:#f0f4f8;
}

/* MODAL */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal{
    width:700px;
    max-width:94%;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
    padding:22px 25px;
    border-bottom:1px solid #e5e9ee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:21px;
}

.close{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    color:#68788e;
}

.modal-body{
    padding:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:13px;
    font-weight:bold;
    color:#4d5d73;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #d4dae2;
    border-radius:6px;
    outline:none;
    font-size:14px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#1976b8;
}

.modal-footer{
    padding:18px 25px;
    border-top:1px solid #e5e9ee;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}
/* =========================
   PROJECT DETAILS WINDOW
========================= */

.project-details-modal{

    width:1100px;
    max-width:95%;
    height:85vh;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
}


.project-details-header{

    min-height:80px;

    padding:20px 25px;

    border-bottom:1px solid #e5e9ee;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.project-details-header h2{

    font-size:24px;

    color:#17243a;

}


.project-details-code{

    color:#708096;

    font-size:13px;

    margin-top:5px;

}


.project-details-layout{

    display:grid;

    grid-template-columns:230px 1fr;

    flex:1;

    min-height:0;

}


.project-details-menu{

    background:#f7f9fb;

    border-right:1px solid #e1e5ea;

    padding:15px;

    overflow-y:auto;

}


.project-menu-btn{

    width:100%;

    border:0;

    background:transparent;

    color:#46566c;

    padding:12px 14px;

    margin-bottom:5px;

    border-radius:7px;

    text-align:left;

    cursor:pointer;

    font-size:14px;

}


.project-menu-btn:hover{

    background:#e8edf3;

}


.project-menu-btn.active{

    background:#1976b8;

    color:white;

    font-weight:bold;

}


.project-details-content{

    padding:28px;

    overflow-y:auto;

}


.project-section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}


.project-section-header h3{

    font-size:22px;

    color:#17243a;

}


.project-section-header p{

    color:#708096;

    margin-top:5px;

    font-size:14px;

}


.project-info-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;

}


.project-info-card{

    border:1px solid #e1e5ea;

    border-radius:8px;

    padding:17px;

    background:#fafbfc;

}


.project-info-card span{

    display:block;

    color:#708096;

    font-size:12px;

    margin-bottom:7px;

}


.project-info-card strong{

    font-size:15px;

    color:#17243a;

}


.project-description{

    margin-top:22px;

    padding:20px;

    border:1px solid #e1e5ea;

    border-radius:8px;

}


.project-description h3{

    margin-bottom:10px;

}


.project-description p{

    color:#68788e;

    line-height:1.6;

}


.project-empty-section{

    min-height:350px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    border:2px dashed #dfe5ec;

    border-radius:10px;

    color:#708096;

}


.project-empty-icon{

    font-size:45px;

    margin-bottom:15px;

}


.project-empty-section h3{

    color:#17243a;

    margin-bottom:8px;

}


.project-empty-section p{

    max-width:450px;

    line-height:1.6;

}
/* RESPONSIVE */
@media(max-width:1000px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .sidebar{
        width:200px;
    }

    .main{
        margin-left:200px;
        width:calc(100% - 200px);
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    table{
        min-width:900px;
    }

    .panel{
        overflow-x:auto;
    }
}
    /* =========================
   DRAWINGS MODULE
========================= */

.project-link{
    cursor:pointer;
    color:#17243a;
}

.project-link:hover{
    color:#1976b8;
    text-decoration:underline;
}

.module-page{
    padding:0;
}

.module-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.module-toolbar-left h1{
    font-size:28px;
    margin-bottom:5px;
}

.module-toolbar-left p{
    color:#708096;
}

.back-btn{
    border:0;
    background:#e8edf3;
    color:#25344a;
    padding:11px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.back-btn:hover{
    background:#dce3eb;
}

.drawing-table-wrap{
    overflow-x:auto;
}

.drawing-number{
    font-weight:bold;
    color:#17243a;
}

.drawing-title{
    font-weight:bold;
}

.drawing-file{
    color:#1976b8;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
}

.drawing-file:hover{
    text-decoration:underline;
}

.revision-badge{
    display:inline-block;
    background:#eef3f8;
    color:#34495e;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.drawing-status-review{
    background:#fff0c7;
    color:#a56a00;
}

.drawing-status-approved{
    background:#d9f7e5;
    color:#148344;
}

.drawing-status-rejected{
    background:#ffe0e3;
    color:#b42332;
}

.drawing-status-superseded{
    background:#eceff3;
    color:#657284;
}

.drawing-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.drawing-modal{
    width:760px;
}

.file-name{
    margin-top:6px;
    font-size:12px;
    color:#708096;
}

.info-box{
    background:#f7f9fb;
    border:1px solid #e1e5ea;
    border-radius:8px;
    padding:14px;
    margin-bottom:20px;
}

.info-box strong{
    color:#17243a;
}

.no-drawings{
    text-align:center;
    padding:60px 20px;
    color:#718096;
}

@media(max-width:700px){
    .module-toolbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-box">ALM</div>
            <div>ALM<br>Project Manager</div>
        </div>

        <nav class="menu">
            <button class="active" onclick="showDashboard()">▦ Dashboard</button>
            <button onclick="showProjects()">▣ Projects</button>
            <button>☑ Tasks</button>
            <button>▤ Documents</button>
            <button>🛒 Procurement</button>
            <button>▣ Payments</button>
            <button>⚒ Variations</button>
            <button>♟ Manpower</button>
            <button>▣ Equipment</button>
            <button>▤ Reports</button>
            <button>⚙ Settings</button>
        </nav>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <input
                id="globalSearch"
                class="search"
                type="text"
                placeholder="Search projects, tasks, documents..."
                oninput="searchProjects()"
            >
        </header>

        <section class="content" id="pageContent"></section>

    </main>

</div>

<!-- DRAWING MODAL -->
<div class="modal-overlay" id="drawingModal">

    <div class="modal drawing-modal">

        <div class="modal-header">

            <h2 id="drawingModalTitle">
                Upload Drawing
            </h2>

            <button
                class="close"
                onclick="closeDrawingModal()">
                ×
            </button>

        </div>


        <form
            id="drawingForm"
            onsubmit="saveDrawing(event)">

            <div class="modal-body">

                <div class="info-box">
                    Project:
                    <strong id="drawingProjectName">
                        -
                    </strong>
                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Drawing Number *
                        </label>

                        <input
                            id="drawingNumber"
                            required
                            placeholder="e.g. STR-001">

                    </div>


                    <div class="form-group">

                        <label>
                            Drawing Title *
                        </label>

                        <input
                            id="drawingTitle"
                            required
                            placeholder="e.g. Foundation Layout">

                    </div>


                    <div class="form-group">

                        <label>
                            Discipline
                        </label>

                        <select id="drawingDiscipline">

                            <option value="Architectural">
                                Architectural
                            </option>

                            <option value="Structural">
                                Structural
                            </option>

                            <option value="Civil">
                                Civil
                            </option>

                            <option value="MEP">
                                MEP
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Revision
                        </label>

                        <input
                            id="drawingRevision"
                            placeholder="Rev.00">

                    </div>


                    <div class="form-group">

                        <label>
                            Drawing Date
                        </label>

                        <input
                            id="drawingDate"
                            type="date">

                    </div>


                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="drawingStatus">

                            <option value="For Review">
                                For Review
                            </option>

                            <option value="Approved">
                                Approved
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                            <option value="Superseded">
                                Superseded
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            Drawing File *
                        </label>

                        <input
                            id="drawingFile"
                            type="file"
                            accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png"
                            required>

                        <div
                            class="file-name"
                            id="selectedDrawingFile">
                            No file selected
                        </div>

                    </div>


                    <div class="form-group full">

                        <label>
                            Remarks
                        </label>

                        <textarea
                            id="drawingRemarks"
                            placeholder="Additional remarks...">
                        </textarea>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeDrawingModal()">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Drawing

                </button>

            </div>

        </form>

    </div>

</div>
<!-- PROJECT MODAL -->
<div class="modal-overlay" id="projectModal">

    <div class="modal">

        <div class="modal-header">
            <h2 id="modalTitle">New Project</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <form id="projectForm" onsubmit="saveProject(event)">

            <div class="modal-body">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Project Name *</label>
                        <input id="projectName" required>
                    </div>

                    <div class="form-group">
                        <label>Project Code</label>
                        <input id="projectCode">
                    </div>

                    <div class="form-group">
                        <label>Client</label>
                        <input id="client">
                    </div>

                    <div class="form-group">
                        <label>Project Manager</label>
                        <input id="manager">
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input id="location">
                    </div>

                    <div class="form-group">
                        <label>Contract Value</label>
                        <input id="contractValue" type="number" min="0">
                    </div>

                    <div class="form-group">
                        <label>Start Date</label>
                        <input id="startDate" type="date">
                    </div>

                    <div class="form-group">
                        <label>Planned Completion</label>
                        <input id="completionDate" type="date">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="Active">Active</option>
                            <option value="Delayed">Delayed</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Progress %</label>
                        <input id="progress" type="number" min="0" max="100" value="0">
                    </div>

                    <div class="form-group full">
                        <label>Description</label>
                        <textarea id="description"></textarea>
                    </div>

                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">
                    Cancel
                </button>

                <button type="submit" class="btn btn-primary">
                    Save Project
                </button>
            </div>

        </form>

    </div>

</div>


<script>

/* =========================
   PROJECT DATA
========================= */

const defaultProjects = [
    {
        id: 1,
        name: "Manhattan",
        code: "MAN-001",
        client: "Client A",
        manager: "Project Manager",
        location: "",
        contractValue: "",
        startDate: "",
        completionDate: "",
        status: "Active",
        progress: 65,
        description: ""
    },
    {
        id: 2,
        name: "Beverly",
        code: "BEV-001",
        client: "Client B",
        manager: "Project Manager",
        location: "",
        contractValue: "",
        startDate: "",
        completionDate: "",
        status: "Delayed",
        progress: 42,
        description: ""
    },
    {
        id: 3,
        name: "Zilco Project",
        code: "ZIL-001",
        client: "Client C",
        manager: "Project Manager",
        location: "",
        contractValue: "",
        startDate: "",
        completionDate: "",
        status: "Active",
        progress: 78,
        description: ""
    }
];

let projects = JSON.parse(localStorage.getItem("alm_projects"));

if (!projects) {
    projects = defaultProjects;
    localStorage.setItem("alm_projects", JSON.stringify(projects));
}
    window.projects = projects;

let editingId = null;


/* =========================
   SAVE DATA
========================= */

function persist(){
    localStorage.setItem("alm_projects", JSON.stringify(projects));
}


/* =========================
   DASHBOARD
========================= */

function showDashboard(){

    const active = projects.filter(p => p.status === "Active").length;

    const delayed = projects.filter(p => p.status === "Delayed").length;

    document.getElementById("pageContent").innerHTML = `

        <div class="page-title">
            <div>
                <h1>Dashboard</h1>
                <p>ALM Engineering & Contracting</p>
            </div>

            <button class="btn btn-primary" onclick="openNewProject()">
                + New Project
            </button>
        </div>

        <div class="stats">

            <div class="stat-card">
                <div class="label">Active Projects</div>
                <div class="number">${active}</div>
            </div>

            <div class="stat-card">
                <div class="label">Open Tasks</div>
                <div class="number">18</div>
            </div>

            <div class="stat-card">
                <div class="label">Pending Documents</div>
                <div class="number">7</div>
            </div>

            <div class="stat-card">
                <div class="label">Delayed Items</div>
                <div class="number">${delayed}</div>
            </div>

        </div>

        <div class="panel">

            <div class="panel-header">

                <h2>Projects</h2>

                <button class="btn btn-primary" onclick="openNewProject()">
                    + Add Project
                </button>

            </div>

            ${projectTable()}

        </div>
    `;
}


/* =========================
   PROJECTS PAGE
========================= */

function showProjects(){

    document.getElementById("pageContent").innerHTML = `

        <div class="page-title">

            <div>
                <h1>Projects</h1>
                <p>Manage all ALM projects</p>
            </div>

            <button class="btn btn-primary" onclick="openNewProject()">
                + New Project
            </button>

        </div>

        <div class="panel">

            <div class="panel-header">
                <h2>All Projects</h2>

window.openBOQFolder = function(projectId, folderId){

window.uploadBOQ = function(projectId){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project) return;

    if(!project.boqs){
        project.boqs = [];
    }

    const currentFolderId =
        window.boqCurrentFolder?.[projectId] || null;

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept =
        ".pdf,.xlsx,.xls,.csv";

    input.onchange = function(){

        const file = input.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload = function(e){

            project.boqs.push({

                fileName:
                    file.name,

                fileType:
                    file.type || "Unknown",

                fileData:
                    e.target.result,

                uploadedBy:
                    "Project Manager",

                date:
                    new Date()
                    .toISOString()
                    .split("T")[0],

                folderId:
                    currentFolderId

            });

            persist();

            showProjectSection(
                "boq",
                projectId
            );

        };

        reader.readAsDataURL(file);

    };

    input.click();

};

window.boqCurrentFolder = window.boqCurrentFolder || {};

function ensureBOQFolders(project){

    if(!project.boqFolders){

        project.boqFolders = [
            {
                id: "root",
                name: "BOQ",
                parentId: null,
                files: project.boqs || []
            }
        ];

        project.boqs = [];

        persist();
    }

    if(!project.boqFolders.find(f => f.id === "root")){

        project.boqFolders.unshift({
            id: "root",
            name: "BOQ",
            parentId: null,
            files: []
        });

        persist();
    }

    return project.boqFolders;
}


/* CREATE FOLDER */

window.createBOQFolder = function(projectId,parentId = null){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project) return;

    ensureBOQFolders(project);

    const folderName = prompt(
        "Enter folder name:"
    );

    if(!folderName) return;

    const cleanName = folderName.trim();

    if(!cleanName) return;

    const exists = project.boqFolders.some(
        folder =>
            folder.parentId === parentId &&
            folder.name.toLowerCase() === cleanName.toLowerCase()
    );

    if(exists){

        alert("A folder with this name already exists.");

        return;
    }

    project.boqFolders.push({

        id:
            "boq-folder-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name: cleanName,

        parentId: parentId,

        files: []

    });

    persist();

    boqCurrentFolder[projectId] = parentId;

    showProjectSection(
        "boq",
        projectId
    );

};

/* =========================
   DELETE BOQ FOLDER
========================= */

window.deleteBOQFolder = function(projectId, folderId){

    const project = projects.find(
        p => String(p.id) === String(projectId)
    );

    if(!project) return;

    ensureBOQFolders(project);

    /* NEVER DELETE ROOT */
    if(folderId === "root" || folderId === null){
        alert("The main BOQ folder cannot be deleted.");
        return;
    }

    const folder = project.boqFolders.find(
        f => String(f.id) === String(folderId)
    );

    if(!folder){
        console.error(
            "BOQ FOLDER NOT FOUND:",
            folderId
        );
        return;
    }

    /* CONFIRM */
    const confirmed = confirm(
        `Delete folder "${folder.name}"?\n\n` +
        `All subfolders and BOQ files inside this folder will also be deleted.`
    );

    if(!confirmed) return;

    /* FIND ALL FOLDERS TO DELETE */
    const foldersToDelete = new Set([
        String(folderId)
    ]);

    let changed = true;

    while(changed){

        changed = false;

        project.boqFolders.forEach(f => {

            if(
                f.parentId !== null &&
                foldersToDelete.has(String(f.parentId)) &&
                !foldersToDelete.has(String(f.id))
            ){

                foldersToDelete.add(String(f.id));

                changed = true;
            }

        });

    }

    /* DELETE BOQ FILES INSIDE THESE FOLDERS */

    if(project.boqs){

        project.boqs = project.boqs.filter(
            boq =>
                !foldersToDelete.has(
                    String(boq.folderId)
                )
        );

    }

    /* DELETE FOLDERS */

    project.boqFolders =
        project.boqFolders.filter(
            f =>
                !foldersToDelete.has(
                    String(f.id)
                )
        );

    /* GO BACK TO PARENT FOLDER */

    window.boqCurrentFolder[projectId] =
        folder.parentId ?? null;

    persist();

    showProjectSection(
        "boq",
        projectId
    );

};

/* GET CURRENT FOLDER */

function getCurrentBOQFolder(project){

    ensureBOQFolders(project);

    const currentId =
        boqCurrentFolder[project.id] || "root";

    return (
        project.boqFolders.find(
            f => f.id === currentId
        )
        ||
        project.boqFolders.find(
            f => f.id === "root"
        )
    );
}
/* =========================
   DOWNLOAD BOQ
========================= */

window.downloadBOQ = function(projectId, index){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project || !project.boqs) return;

    const boq = project.boqs[index];

    if(!boq || !boq.fileData){

        alert("No file is attached to this BOQ.");

        return;
    }

    const link = document.createElement("a");

    link.href = boq.fileData;

    link.download = boq.fileName || "BOQ";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

};

/* =========================
   DELETE BOQ
========================= */

window.deleteBOQ = function(projectId,index){

    const project = projects.find(
        p => p.id === projectId
    );

    if(!project || !project.boqs) return;

    const boq = project.boqs[index];

    if(!boq) return;

    const confirmed = confirm(
        `Are you sure you want to delete "${boq.fileName}"?`
    );

    if(!confirmed) return;

    project.boqs.splice(
        index,
        1
    );

    persist();

    showProjectSection(
        "boq",
        projectId
    );

};

function addProjectItem(section, id){

    const project = projects.find(p => p.id === id);

    if(!project) return;

    if(section === "documents"){
        showProjectSection("documents", id);
        return;
    }

    if(section === "drawings"){
        showProjectSection("drawings", id);
        return;
    }

    showProjectSection(section, id);
}

/* =========================
   STATUS
========================= */

function statusBadge(status){

    let cls = "badge-active";

    if(status === "Delayed") cls = "badge-delayed";
    if(status === "Completed") cls = "badge-completed";
    if(status === "On Hold") cls = "badge-onhold";

    return `<span class="badge ${cls}">${status}</span>`;
}

/* =========================
   SAVE PROJECT
========================= */

function saveProject(event){

    event.preventDefault();

    const projectData = {

        name: document.getElementById("projectName").value.trim(),

        code: document.getElementById("projectCode").value.trim(),

        client: document.getElementById("client").value.trim(),

        manager: document.getElementById("manager").value.trim(),

        location: document.getElementById("location").value.trim(),

        contractValue: document.getElementById("contractValue").value,

        startDate: document.getElementById("startDate").value,

        completionDate: document.getElementById("completionDate").value,

        status: document.getElementById("status").value,

        progress: Number(document.getElementById("progress").value) || 0,

        description: document.getElementById("description").value.trim()
    };


    if(editingId){

        const index = projects.findIndex(p => p.id === editingId);

        if(index !== -1){

            projects[index] = {
                ...projects[index],
                ...projectData
            };

        }

    }else{

        projects.push({

            id: Date.now(),

            ...projectData

        });

    }


    persist();

    closeModal();

    showDashboard();
}


/* =========================
   DELETE PROJECT
========================= */

function deleteProject(id){

    const project = projects.find(p => p.id === id);

    if(!project) return;

    const confirmed = confirm(
        `Are you sure you want to delete "${project.name}"?`
    );

    if(!confirmed) return;

    projects = projects.filter(p => p.id !== id);

    persist();

    showDashboard();
}

========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* =====================================================
   ENSURE DOCUMENT FOLDERS
===================================================== */

function ensureDocumentsFolders(project){

    if(!project.documentsFolders){

        project.documentsFolders = [
            {
                id: "root",
                name: "Documents",
                parentId: null,
                files: []
            }
        ];

        persist();

    }


    if(
        !project.documentsFolders.find(
            folder =>
                String(folder.id) === "root"
        )
    ){

        project.documentsFolders.unshift({

            id: "root",

            name: "Documents",

            parentId: null,

            files: []

        });

        persist();

    }


    return project.documentsFolders;

}

window.createDocumentsFolder =
function(projectId, parentId = null){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        console.error(
            "DOCUMENT PROJECT NOT FOUND:",
            projectId
        );

        return;

    }


    ensureDocumentsFolders(project);


    const folderName =
        prompt(
            "Enter folder name:"
        );


    if(!folderName) return;


    const cleanName =
        folderName.trim();


    if(!cleanName) return;


    const exists =
        project.documentsFolders.some(
            folder =>

                String(
                    folder.parentId ?? null
                ) ===
                String(
                    parentId ?? null
                )

                &&

                String(
                    folder.name
                ).toLowerCase() ===
                cleanName.toLowerCase()
        );


    if(exists){

        alert(
            "A folder with this name already exists."
        );

        return;

    }


    const newFolder = {

        id:
            "documents-folder-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:
            cleanName,

        parentId:
            parentId,

        files: []

    };


    project.documentsFolders.push(
        newFolder
    );


    persist();


    window.documentsCurrentFolder[
        project.id
    ] =
        parentId;


    showProjectSection(
        "documents",
        project.id
    );

};

/* =====================================================
   DELETE DOCUMENT FOLDER
===================================================== */

window.deleteDocumentsFolder =
function(projectId, folderId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureDocumentsFolders(project);


    if(
        String(folderId) === "root"
    ){

        alert(
            "The main Documents folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.documentsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder){

        console.error(
            "DOCUMENT FOLDER NOT FOUND:",
            folderId
        );

        return;

    }


    const confirmed =
        confirm(

            `Delete folder "${folder.name}"?\n\n` +

            `All subfolders and documents inside this folder will also be deleted.`

        );


    if(!confirmed) return;


    /* =========================
       FIND ALL DESCENDANTS
    ========================= */

    const foldersToDelete =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.documentsFolders.forEach(
            child => {

                if(

                    child.parentId !== null &&

                    foldersToDelete.has(
                        String(child.parentId)
                    ) &&

                    !foldersToDelete.has(
                        String(child.id)
                    )

                ){

                    foldersToDelete.add(
                        String(child.id)
                    );

                    changed = true;

                }

            }
        );

    }


    /* =========================
       DELETE DOCUMENTS
    ========================= */

    if(project.documents){

        project.documents =
            project.documents.filter(
                doc =>

                    !foldersToDelete.has(
                        String(
                            doc.folderId
                        )
                    )
            );

    }


    /* =========================
       DELETE FOLDERS
    ========================= */

    project.documentsFolders =
        project.documentsFolders.filter(
            folder =>

                !foldersToDelete.has(
                    String(folder.id)
                )
        );


    /* =========================
       GO TO PARENT
    ========================= */

    window.documentsCurrentFolder[
        project.id
    ] =
        folder.parentId ?? null;


    persist();


    showProjectSection(
        "documents",
        project.id
    );

};


/* =====================================================

===================================================== */

window.uploadDocument =
function(projectId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project){

        alert(
            "Project not found."
        );

        return;

    }


    ensureDocumentsFolders(project);


    const currentFolderId =
        window.documentsCurrentFolder[
            project.id
        ] ?? null;


    const input =
        document.createElement(
            "input"
        );


    input.type = "file";


    input.accept =
        ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.dwg,.zip";


    input.onchange =
    function(){

        const file =
            input.files[0];


        if(!file) return;


        const title =
            prompt(
                "Document Title:",
                file.name
            );


        if(title === null) return;


        const uploadedBy =
            prompt(
                "Uploaded By:",
                "Project Manager"
            );


        if(uploadedBy === null) return;


        const reader =
            new FileReader();


        reader.onload =
        function(e){

            if(!project.documents){

                project.documents = [];

            }


            project.documents.push({

                id:
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,8),

                title:
                    title || file.name,

                fileName:
                    file.name,

                fileType:
                    file.type ||
                    "Unknown",

                fileData:
                    e.target.result,

                uploadedBy:
                    uploadedBy ||
                    "Project Manager",

                date:
                    new Date()
                        .toISOString()
                        .split("T")[0],

                folderId:
                    currentFolderId

            });


            persist();


            showProjectSection(
                "documents",
                project.id
            );

        };


        reader.readAsDataURL(file);

    };


    input.click();

};

window.viewDocument =
function(projectId,index){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(
        !project ||
        !project.documents
    ){

        alert(
            "Project or documents not found."
        );

        return;

    }


    const doc =
        project.documents[index];


    if(
        !doc ||
        !doc.fileData
    ){

        alert(
            "No file is attached to this document."
        );

        return;

    }


    const parts =
        doc.fileData.split(",");


    if(parts.length < 2){

        alert(
            "Invalid file data."
        );

        return;

    }


    const mimeType =

        parts[0]
            .match(
                /data:(.*?);base64/
            )?.[1]

        ||

        doc.fileType

        ||

        "application/octet-stream";


    const byteCharacters =
        atob(parts[1]);


    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for(
        let i = 0;
        i < byteCharacters.length;
        i++
    ){

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);

    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    const blob =
        new Blob(
            [byteArray],
            {
                type: mimeType
            }
        );


    const blobURL =
        URL.createObjectURL(
            blob
        );


    window.open(
        blobURL,
        "_blank"
    );

};

    ){

        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        doc.fileData;


    link.download =
        doc.fileName ||
        "Document";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

};

/* =====================================================

===================================================== */

function ensureDrawingsFolders(project){

    if(!project.drawingsFolders){

        project.drawingsFolders = [
            {
                id: "root",
                name: "Drawings",
                parentId: null,
                files: []
            }
        ];

        persist();

    }


    if(
        !project.drawingsFolders.find(
            folder =>
                String(folder.id) === "root"
        )
    ){

        project.drawingsFolders.unshift({

            id: "root",

            name: "Drawings",

            parentId: null,

            files: []

        });

        persist();

    }


    return project.drawingsFolders;

}

/* =====================================================

===================================================== */

window.deleteDrawingsFolder =
function(projectId, folderId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureDrawingsFolders(project);


    if(
        String(folderId) === "root"
    ){

        alert(
            "The main Drawings folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.drawingsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder) return;


    const confirmed =
        confirm(

            `Delete folder "${folder.name}"?\n\n` +

            `All subfolders and drawings inside this folder will also be deleted.`

        );


    if(!confirmed) return;


    const foldersToDelete =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.drawingsFolders.forEach(
            child => {

                if(

                    child.parentId !== null &&

                    foldersToDelete.has(
                        String(child.parentId)
                    ) &&

                    !foldersToDelete.has(
                        String(child.id)
                    )

                ){

                    foldersToDelete.add(
                        String(child.id)
                    );

                    changed = true;

                }

            }
        );

    }


    if(project.drawings){

        project.drawings =
            project.drawings.filter(
                drawing =>

                    !foldersToDelete.has(
                        String(
                            drawing.folderId
                        )
                    )
            );

    }


    project.drawingsFolders =
        project.drawingsFolders.filter(
            folder =>

                !foldersToDelete.has(
                    String(folder.id)
                )
        );


    window.drawingsCurrentFolder[
        project.id
    ] =
        folder.parentId ?? null;


    persist();


    showProjectSection(
        "drawings",
        project.id
    );

};

window.viewDrawing =
function(projectId,index){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(
        !project ||
        !project.drawings
    ){

        alert(
            "Project or drawings not found."
        );

        return;

    }


    const drawing =
        project.drawings[index];


    if(
        !drawing ||
        !drawing.fileData
    ){

        alert(
            "No file is attached to this drawing."
        );

        return;

    }


    const parts =
        drawing.fileData.split(",");


    if(parts.length < 2){

        alert(
            "Invalid file data."
        );

        return;

    }


    const mimeType =
        parts[0]
            .match(
                /data:(.*?);base64/
            )?.[1]

        ||

        drawing.fileType

        ||

        "application/octet-stream";


    const byteCharacters =
        atob(parts[1]);


    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for(
        let i = 0;
        i < byteCharacters.length;
        i++
    ){

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);

    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    const blob =
        new Blob(
            [byteArray],
            {
                type: mimeType
            }
        );


    const blobURL =
        URL.createObjectURL(
            blob
        );


    window.open(
        blobURL,
        "_blank"
    );

};

window.createReportsFolder =
function(projectId, parentId = null){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureReportsFolders(project);


    const folderName =
        prompt(
            "Enter folder name:"
        );


    if(!folderName) return;


    const cleanName =
        folderName.trim();


    if(!cleanName) return;


    const exists =
        project.reportsFolders.some(
            folder =>

                String(
                    folder.parentId ?? null
                ) ===
                String(
                    parentId ?? null
                )

                &&

                String(
                    folder.name
                ).toLowerCase() ===
                cleanName.toLowerCase()
        );


    if(exists){

        alert(
            "A folder with this name already exists."
        );

        return;

    }


    project.reportsFolders.push({

        id:
            "reports-folder-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:
            cleanName,

        parentId:
            parentId,

        files: []

    });


    persist();


    window.reportsCurrentFolder[
        project.id
    ] =
        parentId;


    showProjectSection(
        "reports",
        project.id
    );

};

/* =====================================================
   DELETE REPORT FOLDER
===================================================== */

window.deleteReportsFolder =
function(projectId, folderId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(!project) return;


    ensureReportsFolders(project);


    if(
        String(folderId) === "root"
    ){

        alert(
            "The main Reports folder cannot be deleted."
        );

        return;

    }


    const folder =
        project.reportsFolders.find(
            f =>
                String(f.id) ===
                String(folderId)
        );


    if(!folder) return;


    const confirmed =
        confirm(

            `Delete folder "${folder.name}"?\n\n` +

            `All subfolders and reports inside this folder will also be deleted.`

        );


    if(!confirmed) return;


    const foldersToDelete =
        new Set([
            String(folderId)
        ]);


    let changed = true;


    while(changed){

        changed = false;


        project.reportsFolders.forEach(
            child => {

                if(

                    child.parentId !== null &&

                    foldersToDelete.has(
                        String(child.parentId)
                    ) &&

                    !foldersToDelete.has(
                        String(child.id)
                    )

                ){

                    foldersToDelete.add(
                        String(child.id)
                    );

                    changed = true;

                }

            }
        );

    }


    if(project.reports){

        project.reports =
            project.reports.filter(
                report =>

                    !foldersToDelete.has(
                        String(
                            report.folderId
                        )
                    )
            );

    }


    project.reportsFolders =
        project.reportsFolders.filter(
            folder =>

                !foldersToDelete.has(
                    String(folder.id)
                )
        );


    window.reportsCurrentFolder[
        project.id
    ] =
        folder.parentId ?? null;


    persist();


    showProjectSection(
        "reports",
        project.id
    );

};

window.uploadReport =
function(projectId){

        );


    if(!project){

        alert(
            "Project not found."
        );

        return;

    ensureReportsFolders(project);


    const currentFolderId =
        window.reportsCurrentFolder[
            project.id
        ] ?? null;


    const input =
        document.createElement(
            "input"
        );


    input.type = "file";


    input.accept =
        ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.zip";


    input.onchange =
    function(){

        const file =
            input.files[0];


        if(!file) return;


        const title =
            prompt(
                "Report Title:",
                file.name
            );


        if(title === null) return;


        const uploadedBy =
            prompt(
                "Uploaded By:",
                "Project Manager"
            );


        if(uploadedBy === null) return;


        const reader =
            new FileReader();


        reader.onload =
        function(e){

            if(!project.reports){

window.viewReport =
function(projectId,index){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );


    if(
        !project ||
        !project.reports
    ){

        alert(
            "Project or reports not found."
        );

        return;

    }


    const report =
        project.reports[index];


    if(
        !report ||
        !report.fileData
    ){

        alert(
            "No file is attached to this report."
        );

        return;

    }


    const parts =
        report.fileData.split(",");


    if(parts.length < 2){

        alert(
            "Invalid file data."
        );

        return;

    }


    const mimeType =
        parts[0]
            .match(
                /data:(.*?);base64/
            )?.[1]

        ||

        report.fileType

        ||

        "application/octet-stream";


    const byteCharacters =
        atob(parts[1]);


    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for(
        let i = 0;
        i < byteCharacters.length;
        i++
    ){

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);

    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    const blob =
        new Blob(
            [byteArray],
            {
                type: mimeType
            }
        );


    const blobURL =
        URL.createObjectURL(
            blob
        );


    window.open(
        blobURL,
        "_blank"
    );

};

/* =====================================================

===================================================== */

function taskPriorityBadge(priority){

    let cls =
        "badge-onhold";


    if(priority === "Low"){

        cls =
            "badge-completed";

    }


    if(priority === "Medium"){

        cls =
            "badge-active";

    }


    if(priority === "High"){

        cls =
            "badge-delayed";

    }


    if(priority === "Critical"){

        cls =
            "badge-onhold";

    }


    return `

        <span
            class="badge ${cls}"
        >

            ${escapeHTML(
                priority || "Medium"
            )}

        </span>

    `;

}


/* =====================================================
   TASK STATUS BADGE
===================================================== */

function taskStatusBadge(status){

    let cls =
        "badge-onhold";


    if(status === "Pending"){

        cls =
            "badge-delayed";

    }


    if(status === "In Progress"){

        cls =
            "badge-active";

    }


    if(status === "Completed"){

        cls =
            "badge-completed";

    }


    if(status === "On Hold"){

        cls =
            "badge-onhold";

    }


    return `

        <span
            class="badge ${cls}"
        >

            ${escapeHTML(
                status || "Pending"
            )}

        </span>

    `;

}

window.createPayment = function(projectId){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(!project) return;


    if(!project.payments){
        project.payments = [];
    }


    const paymentNo =
        prompt(
            "Payment Number:"
        );

    if(paymentNo === null) return;

    if(!paymentNo.trim()){

        alert(
            "Payment Number is required."
        );

        return;

    }


    const type =
        prompt(
            "Type:\n\n" +
            "Advance Payment / Interim Payment / Final Payment / Retention / Other",
            "Interim Payment"
        );

    if(type === null) return;


    const contractor =
        prompt(
            "Contractor:"
        );

    if(contractor === null) return;


    const invoiceValue =
        prompt(
            "Invoice Value:"
        );

    if(invoiceValue === null) return;


    const paymentReceived =
        prompt(
            "Payment Received:"
        );

    if(paymentReceived === null) return;


    const paymentReceivedDate =
        prompt(
            "Date of Payment Received:",
            new Date()
                .toISOString()
                .split("T")[0]
        );

    if(paymentReceivedDate === null) return;


    /*
       CREATE TEMPORARY FILE INPUT
       FOR INVOICE PDF
    */

    const fileInput =
        document.createElement("input");

    fileInput.type = "file";

    fileInput.accept = "application/pdf,.pdf";


    fileInput.style.display = "none";


    document.body.appendChild(
        fileInput
    );


    fileInput.onchange =
    function(){

        const file =
            fileInput.files[0];


        if(!file){

            document.body.removeChild(
                fileInput
            );

            return;

        }


        if(
            file.type !==
            "application/pdf"
        ){

            alert(
                "Please select a PDF invoice only."
            );

            document.body.removeChild(
                fileInput
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
        function(event){

            project.payments.push({

                id:
                    "payment-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,8),

                projectId:
                    project.id,

                paymentNo:
                    paymentNo.trim(),

                type:
                    type.trim(),

                contractor:
                    contractor.trim(),

                invoiceValue:
                    Number(invoiceValue) || 0,

                paymentReceived:
                    Number(paymentReceived) || 0,

                paymentReceivedDate:
                    paymentReceivedDate.trim(),

                invoiceFileName:
                    file.name,

                invoiceFileType:
                    file.type,

                invoiceFileData:
                    event.target.result,

                createdDate:
                    new Date()
                        .toISOString()
                        .split("T")[0]

            });


            persist();


            document.body.removeChild(
                fileInput
            );


            window.showProjectSection(
                "payments",
                project.id
            );

        };


        reader.readAsDataURL(file);

    };


    /*
       OPEN FILE SELECTOR
    */

    fileInput.click();

};


/* =====================================================
   EDIT PAYMENT
===================================================== */

window.editPayment = function(
    projectId,
    index
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(
        !project ||
        !project.payments
    ){

        return;

    }


    const payment =
        project.payments[index];

    if(!payment) return;


    const paymentNo =
        prompt(
            "Payment Number:",
            payment.paymentNo || ""
        );

    if(paymentNo === null) return;


    const type =
        prompt(
            "Type:",
            payment.type || ""
        );

    if(type === null) return;


    const contractor =
        prompt(
            "Contractor:",
            payment.contractor || ""
        );

    if(contractor === null) return;


    const invoiceValue =
        prompt(
            "Invoice Value:",
            payment.invoiceValue || ""
        );

    if(invoiceValue === null) return;


    const paymentReceived =
        prompt(
            "Payment Received:",
            payment.paymentReceived || ""
        );

    if(paymentReceived === null) return;


    const paymentReceivedDate =
        prompt(
            "Date of Payment Received:",
            payment.paymentReceivedDate || ""
        );

    if(paymentReceivedDate === null) return;


    payment.paymentNo =
        paymentNo.trim();

    payment.type =
        type.trim();

    payment.contractor =
        contractor.trim();

    payment.invoiceValue =
        Number(invoiceValue) || 0;

    payment.paymentReceived =
        Number(paymentReceived) || 0;

    payment.paymentReceivedDate =
        paymentReceivedDate.trim();


    /*
       ASK WHETHER TO REPLACE INVOICE
    */

    const replaceInvoice =
        confirm(
            payment.invoiceFileData
            ?
            "Do you want to replace the existing Invoice PDF?"
            :
            "Do you want to upload an Invoice PDF?"
        );


    if(!replaceInvoice){

        persist();

        window.showProjectSection(
            "payments",
            project.id
        );

        return;

    }


    const fileInput =
        document.createElement("input");

    fileInput.type = "file";

    fileInput.accept =
        "application/pdf,.pdf";

    fileInput.style.display =
        "none";


    document.body.appendChild(
        fileInput
    );


    fileInput.onchange =
    function(){

        const file =
            fileInput.files[0];


        if(!file){

            document.body.removeChild(
                fileInput
            );

            persist();

            window.showProjectSection(
                "payments",
                project.id
            );

            return;

        }


        if(
            file.type !==
            "application/pdf"
        ){

            alert(
                "Please select a PDF invoice only."
            );

            document.body.removeChild(
                fileInput
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
        function(event){

            payment.invoiceFileName =
                file.name;

            payment.invoiceFileType =
                file.type;

            payment.invoiceFileData =
                event.target.result;


            persist();


            document.body.removeChild(
                fileInput
            );


            window.showProjectSection(
                "payments",
                project.id
            );

        };


        reader.readAsDataURL(file);

    };


    fileInput.click();

};


/* =====================================================
   VIEW PAYMENT INVOICE
===================================================== */

window.viewPaymentInvoice = function(
    projectId,
    index
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(
        !project ||
        !project.payments
    ){

        return;

    }


    const payment =
        project.payments[index];

    if(
        !payment ||
        !payment.invoiceFileData
    ){

        alert(
            "No Invoice PDF is attached."
        );

        return;

    }


    const byteCharacters =
        atob(
            payment.invoiceFileData
                .split(",")[1]
        );


    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for(
        let i = 0;
        i < byteCharacters.length;
        i++
    ){

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);

    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    const blob =
        new Blob(
            [byteArray],
            {
                type:
                    "application/pdf"
            }
        );


    const url =
        URL.createObjectURL(blob);


    window.open(
        url,
        "_blank"
    );

};


/* =====================================================
   DOWNLOAD PAYMENT INVOICE
===================================================== */

window.downloadPaymentInvoice =
function(
    projectId,
    index
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(
        !project ||
        !project.payments
    ){

        return;

    }


    const payment =
        project.payments[index];


    if(
        !payment ||
        !payment.invoiceFileData
    ){

        alert(
            "No Invoice PDF is attached."
        );

        return;

    }


    const link =
        document.createElement("a");


    link.href =
        payment.invoiceFileData;


    link.download =
        payment.invoiceFileName ||
        (
            payment.paymentNo +
            "-Invoice.pdf"
        );


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

};


/* =====================================================
   DELETE PAYMENT
===================================================== */

window.deletePayment = function(
    projectId,
    index
){

    const project =
        projects.find(
            p =>
                String(p.id) ===
                String(projectId)
        );

    if(
        !project ||
        !project.payments
    ){

        return;

    }


    const payment =
        project.payments[index];

    if(!payment) return;


    const confirmed =
        confirm(
            `Are you sure you want to delete payment "${payment.paymentNo || "Payment"}"?`
        );


    if(!confirmed) return;


    project.payments.splice(
        index,
        1
    );


    persist();


    window.showProjectSection(
        "payments",
        project.id
    );

};
</script>
